<!doctype html><meta charset="utf-8"><title>Printtest</title>
<!-- Tijdelijk: tekent in Safari de echte sticker van A0099 via de werkbank (onzichtbaar
     venster) en stuurt hem naar de printhulp. De uitslag gaat als tekst naar de log van
     de printhulp. Wordt meteen weer verwijderd. -->
<p id="u">Even testen...</p>
<script>
(async()=>{
  const r=[];
  const meld=async t=>{ try{ await fetch('https://127.0.0.1:9909/print',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({png:'',kopieen:'RAPPORT '+t})}); }catch(_e){} };
  try{
    const f=document.createElement('iframe'); f.src='/refurbish/?ingebed=1'; f.style.cssText='width:10px;height:10px';
    document.body.appendChild(f);
    await new Promise(res=>f.onload=res);
    await new Promise(res=>setTimeout(res,6000));
    const w=f.contentWindow;
    r.push('toestel '+w.eval("!!(typeof apparaten!=='undefined' && apparaten.find(x=>x.code==='A0099'))"));
    r.push('url '+w.eval('printHelperUrl()')+' instelling '+JSON.stringify(w.eval('labelInstelling()')));
    w.eval("window.__toasts=[]; var _t=toast; toast=function(m,s){ __toasts.push(String(m)); return _t.apply(this,arguments); }");
    const ok=await w.eval("qzPrintDeviceLabels(apparaten.find(x=>x.code==='A0099').id, true, {zonderDoos:true})");
    r.push('qz '+ok+' toasts '+JSON.stringify(w.eval('__toasts')));
    let png=null;
    try{ png=await w.eval("deviceLabelPng(apparaten.find(x=>x.code==='A0099'))"); r.push('png '+(png&&png.data?png.data.length:0)); }
    catch(e){ r.push('teken-fout '+e.name+': '+e.message+' @ '+String(e.stack||'').split('\n').slice(0,3).join(' / ')); }
    if(png){ try{ await w.eval('printViaHelper')(png.data,{label:62, red:true}); r.push('print ok'); }catch(e){ r.push('print-fout '+e.message); } }
  }catch(e){ r.push('test-fout '+e.message); }
  document.getElementById('u').textContent=r.join(' | ');
  await meld(r.join(' | '));
})();
</script>
