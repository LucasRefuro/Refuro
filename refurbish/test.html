<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Toestel testen · Storvo</title>
<link rel="icon" href="/merk/app-icoon.svg">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Sora:wght@700;800&display=swap" rel="stylesheet">
<style>
/* Functioneel testen met het toestel in de hand.
   Werkt op een code van een half uur uit de QR op de pc; geen inlog op dit
   toestel. De browser doet per onderdeel iets (fullscreen kleur, tekenvlak,
   geluid, camera, trillen) en jij beoordeelt of het werkt. Sommige dingen kan
   een browser niet lezen (accu-gezondheid, Face ID, vingerafdruk, IMEI); die
   blijven met de hand in de controle op de pc. */
:root{
  --groen:#0B5B52; --oranje:#E88A1D; --bg:#F7F6F3; --card:#fff; --border:#ECEAE4;
  --tekst:#17201E; --muted:#5B6663; --muted-l:#8A938F; --lblauw:#E7F1EE;
  --green-soft:#E3F4EC; --green-tekst:#177A51; --red-soft:#FAE4E4; --red-tekst:#A33333;
  --pil:100px;
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
[hidden]{display:none !important;}
html,body{height:100%;}
body{font-family:'Instrument Sans',system-ui,sans-serif; background:var(--bg); color:var(--tekst);
  font-size:16px; line-height:1.55; padding:18px 16px calc(18px + env(safe-area-inset-bottom));
  max-width:600px; margin:0 auto; overscroll-behavior:none;}
h1{font-family:'Sora',sans-serif; font-size:21px; font-weight:800; letter-spacing:-.02em;}
.kop{display:flex; align-items:center; gap:12px; margin-bottom:4px;}
.kop .mark{width:32px; height:32px; flex:none;}
.muted{color:var(--muted);} .klein{font-size:13.5px;}
.kaart{background:var(--card); border-radius:20px; padding:18px; margin-top:14px;
  box-shadow:0 6px 24px rgba(23,32,30,.07);}
.btn{display:flex; align-items:center; justify-content:center; gap:9px; width:100%;
  padding:15px 20px; border:none; border-radius:var(--pil); font-family:inherit;
  font-size:16px; font-weight:700; cursor:pointer; background:var(--groen); color:#fff;}
.btn.actie{background:var(--oranje);} .btn.goed{background:var(--green-tekst);} .btn.slecht{background:var(--red-tekst);}
.btn.ghost{background:var(--card); color:var(--tekst); border:1.5px solid var(--border);}
.btn:disabled{opacity:.5;}

/* voortgang en kop van een test */
.balkrij{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
.terug{flex:none; width:40px; height:40px; border-radius:50%; border:1.5px solid var(--border);
  background:var(--card); display:flex; align-items:center; justify-content:center; cursor:pointer;}
.terug svg{width:18px; height:18px; fill:none; stroke:var(--tekst); stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round;}
.terug:disabled{opacity:.35;}
.voortgang{display:flex; gap:5px; flex:1;}
.vstip{height:6px; flex:1; border-radius:var(--pil); background:var(--border);}
.vstip.nu{background:var(--oranje);} .vstip.ok{background:var(--green-tekst);} .vstip.fout{background:var(--red-tekst);} .vstip.over{background:var(--muted-l);}
.teller{flex:none; font-size:13px; font-weight:700; color:var(--muted);}

.testnaam{font-family:'Sora',sans-serif; font-size:20px; font-weight:800; margin-bottom:4px;}
.testuit{color:var(--muted); font-size:14.5px; margin-bottom:16px;}
.testvak{margin-bottom:18px;}
.oordeel{display:flex; gap:12px;} .oordeel .btn{flex:1;}
.oordeeluit{width:100%; margin-top:10px;}

/* de meter voor de microfoon */
.meter{height:30px; border-radius:var(--pil); background:var(--border); overflow:hidden;}
.meter i{display:block; height:100%; width:0; background:var(--green-tekst); transition:width .04s linear;}
#camerabeeld{width:100%; height:300px; border-radius:16px; background:#111; object-fit:cover;}

/* fullscreen laag voor touch, kleuren en sensoren */
#vol{position:fixed; inset:0; z-index:100; background:#000; display:none;}
#vol.aan{display:block;}
#vol canvas, #vol .kleur{position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none;}
#vol .tilt{position:absolute; inset:0;}
#vol .tiltstip{position:absolute; width:54px; height:54px; border-radius:50%; background:var(--oranje);
  left:calc(50% - 27px); top:calc(50% - 27px); box-shadow:0 6px 20px rgba(0,0,0,.35); will-change:transform;}
#vol .tiltkruis::before,#vol .tiltkruis::after{content:''; position:absolute; background:rgba(255,255,255,.16);}
#vol .tiltkruis::before{left:50%; top:0; bottom:0; width:2px;} #vol .tiltkruis::after{top:50%; left:0; right:0; height:2px;}
#vol .volbalk{position:fixed; left:12px; right:12px; bottom:calc(14px + env(safe-area-inset-bottom));
  display:flex; gap:10px; align-items:center; z-index:2;}
#vol .volbalk .btn{padding:14px 16px; box-shadow:0 8px 24px rgba(0,0,0,.3);}
#vol .vollabel{position:fixed; left:0; right:0; top:calc(14px + env(safe-area-inset-top)); text-align:center;
  z-index:2; color:#fff; font-weight:700; font-size:15px; text-shadow:0 1px 3px rgba(0,0,0,.5); pointer-events:none;}

#toasts{position:fixed; left:16px; right:16px; bottom:16px; display:flex; flex-direction:column; gap:8px; z-index:200;}
.toast{background:var(--tekst); color:#fff; padding:13px 18px; border-radius:14px; font-size:14.5px;}
.toast.ok{background:var(--green-tekst);} .toast.fout{background:var(--red-tekst);}
.klaarvak{text-align:center; padding:10px 0;}
.klaarvak .vink{width:60px; height:60px; margin:0 auto 14px; border-radius:50%;
  background:var(--green-soft); color:var(--green-tekst); display:flex; align-items:center; justify-content:center;}
.klaarvak .vink svg{width:30px; height:30px; fill:none; stroke:currentColor; stroke-width:3; stroke-linecap:round; stroke-linejoin:round;}
.uitslagrij{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); font-size:15px;}
.uitslagrij:last-child{border-bottom:0;} .uitslagrij .st{margin-left:auto; font-weight:700;}
.uitslagrij .st.ok{color:var(--green-tekst);} .uitslagrij .st.fout{color:var(--red-tekst);} .uitslagrij .st.over{color:var(--muted-l);}
</style>
</head>
<body>

<div class="kop">
  <div class="mark" id="merkVlak"></div>
  <div><h1>Toestel testen</h1></div>
</div>
<p class="muted klein" id="watIsHet">Bezig met openen…</p>

<div id="werk" hidden>
  <div class="kaart">
    <div class="balkrij">
      <button class="terug" id="terugKnop" onclick="vorige()" aria-label="Vorige"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div class="voortgang" id="voortgang"></div>
      <div class="teller" id="teller"></div>
    </div>
    <div class="testnaam" id="testnaam"></div>
    <div class="testuit" id="testuit"></div>
    <div class="testvak" id="testvak"></div>
    <div class="oordeel">
      <button class="btn slecht" onclick="oordeel('fout')">Niet goed</button>
      <button class="btn goed" onclick="oordeel('ok')">Werkt</button>
    </div>
    <button class="btn ghost oordeeluit" onclick="oordeel('over')">Overslaan</button>
  </div>
</div>

<div class="kaart" id="klaarKaart" hidden>
  <div class="klaarvak">
    <div class="vink"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></div>
    <b>Uitslag verstuurd</b>
    <p class="muted klein" style="margin-top:6px">Je kunt dit venster sluiten. Op de pc haal je de uitslag op in de controle.</p>
  </div>
  <div id="uitslagLijst" style="margin-top:14px"></div>
</div>

<div class="kaart" id="fout" hidden>
  <b id="foutKop"></b>
  <p class="muted klein" id="foutTekst" style="margin-top:6px"></p>
</div>

<div id="vol">
  <button class="terug" id="volTerug" onclick="vorige()" aria-label="Vorige"
    style="position:fixed; left:14px; top:calc(12px + env(safe-area-inset-top)); z-index:3; background:rgba(255,255,255,.9)">
    <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
  <div class="vollabel" id="volLabel"></div>
  <div id="volInhoud"></div>
  <div class="volbalk">
    <button class="btn slecht" onclick="oordeel('fout')">Niet goed</button>
    <button class="btn goed" onclick="oordeel('ok')">Werkt</button>
  </div>
</div>

<div id="toasts"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://ugilfxqolemxwssbpdwu.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVnaWxmeHFvbGVteHdzc2JwZHd1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3ODk1NTUsImV4cCI6MjEwMTM2NTU1NX0.7q6R7J0_U0iU6AGlxFoBHpH22cRBluapP3nOsuIssqA';

const code=new URLSearchParams(location.search).get('c');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(bericht, soort){
  const c=document.getElementById('toasts');
  const t=document.createElement('div'); t.className='toast '+(soort||''); t.textContent=bericht;
  c.appendChild(t); setTimeout(()=>t.remove(), 3200);
}
function stop(kop, tekst){
  volSluit(); document.getElementById('watIsHet').textContent='';
  document.getElementById('werk').hidden=true;
  document.getElementById('foutKop').textContent=kop;
  document.getElementById('foutTekst').textContent=tekst;
  document.getElementById('fout').hidden=false;
}

document.getElementById('merkVlak').innerHTML=
  `<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
    <rect x="3" y="3" width="19" height="19" rx="5" fill="#0B5B52"/>
    <rect x="26" y="3" width="19" height="19" rx="5" fill="#6A9C93"/>
    <rect x="3" y="26" width="19" height="19" rx="5" fill="#A7C3BD"/>
    <path d="M28 36.5 L33 41.5 L44 28" fill="none" stroke="#0B5B52" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;

async function praat(lijf){
  const res=await fetch(SUPABASE_URL+'/functions/v1/refurbish-test',{
    method:'POST', headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON_KEY},
    body:JSON.stringify(Object.assign({code}, lijf))
  });
  const uit=await res.json().catch(()=>({}));
  if(!res.ok||!uit.ok) throw new Error(uit.error||'Er ging iets mis');
  return uit;
}

/* ---- de tests ----
   soorten: voor welke categorieen deze test telt. vol:true = fullscreen laag.
   Elke start() zet iets klaar; opruimen() stopt camera's/microfoon/timers. */
const ALLE_TESTS=[
  {id:'touch', naam:'Touchscreen', uit:'Veeg met je vinger over het HELE scherm, ook de randen en hoeken. Alles moet meetekenen.', soorten:['Telefoon','Tablet'], vol:true, start:startTouch},
  {id:'scherm', naam:'Beeldscherm', uit:'Het scherm loopt vanzelf door de kleuren. Zoek dode pixels, vlekken of ingebrande beelden.', soorten:['Telefoon','Tablet'], vol:true, start:startScherm},
  {id:'luidspreker', naam:'Luidspreker (onderkant)', uit:'De speaker onderaan, voor muziek en de speaker-stand. Druk op de knop en luister.', soorten:['Telefoon','Tablet'], start:startLuidspreker},
  {id:'oorspeaker', naam:'Oorspeaker (bellen)', uit:'De speaker bovenaan die je bij het oor houdt. Bel een nummer en luister of je de ander helder hoort. Een browser kan deze speaker niet zelf aansturen.', soorten:['Telefoon'], start:startOorspeaker},
  {id:'microfoon', naam:'Microfoon', uit:'Zeg iets. De balk moet meebewegen.', soorten:['Telefoon','Tablet'], start:startMicrofoon},
  {id:'camera_achter', naam:'Camera achter', uit:'Wissel tussen de lenzen en kijk of elke lens scherp beeld geeft, zonder vlekken.', soorten:['Telefoon','Tablet'], start:startCameraAchter},
  {id:'camera_voor', naam:'Camera voor', uit:'Kijk of de selfiecamera goed beeld geeft.', soorten:['Telefoon','Tablet'], start:()=>startCamera('user')},
  {id:'trilfunctie', naam:'Trilfunctie', uit:'Het toestel trilt kort. Voel je het?', soorten:['Telefoon'], start:startTril},
  {id:'sensoren', naam:'Sensoren', uit:'Kantel het toestel rustig. De stip volgt vloeiend mee.', soorten:['Telefoon','Tablet'], vol:true, start:startSensoren},
  {id:'accu', naam:'Accu-conditie', uit:'Lees de maximale capaciteit af in de instellingen en vul hem in. Een browser kan dit zelf niet uitlezen.', soorten:['Telefoon','Tablet'], geenOordeel:true, start:startAccu}
];
let TESTS=ALLE_TESTS.slice();
let nu=0;
let accuWaarde='';
const resultaat={};

/* ---- fullscreen laag ---- */
let opruimer=null, stapId=0;
function opruimen(){ stapId++; if(opruimer){ try{ opruimer(); }catch(e){} opruimer=null; } }
function volOpen(inhoudHtml, label){
  const vol=document.getElementById('vol');
  document.getElementById('volInhoud').innerHTML=inhoudHtml;
  document.getElementById('volLabel').textContent=label||'';
  vol.classList.add('aan');
  /* Op Android zet dit hem echt fullscreen; iOS negeert het netjes en de laag
     vult zelf al het scherm. */
  try{ if(vol.requestFullscreen) vol.requestFullscreen(); else if(vol.webkitRequestFullscreen) vol.webkitRequestFullscreen(); }catch(e){}
}
function volSluit(){
  const vol=document.getElementById('vol');
  vol.classList.remove('aan');
  document.getElementById('volInhoud').innerHTML='';
  document.documentElement.style.background=''; document.body.style.background='';
  try{ if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen();
    else if(document.webkitFullscreenElement && document.webkitExitFullscreen) document.webkitExitFullscreen(); }catch(e){}
}

function tekenVoortgang(){
  document.getElementById('voortgang').innerHTML=TESTS.map((t,i)=>{
    const r=resultaat[t.id];
    const gedaan = t.id==='accu' && typeof r==='number';
    const s = gedaan?'ok' : r==='ok'?'ok' : r==='fout'?'fout' : r==='over'?'over' : (i===nu?'nu':'');
    return `<div class="vstip ${s}"></div>`;
  }).join('');
  document.getElementById('teller').textContent=Math.min(nu+1,TESTS.length)+' / '+TESTS.length;
  document.getElementById('terugKnop').disabled = nu<=0;
  document.getElementById('volTerug').disabled = nu<=0;
}

function tekenTest(){
  opruimen(); volSluit();
  if(nu>=TESTS.length){ versturen(); return; }
  const t=TESTS[nu];
  tekenVoortgang();
  document.getElementById('testnaam').textContent=t.naam;
  document.getElementById('testuit').textContent=t.uit;
  document.getElementById('testvak').innerHTML='';
  /* De accu-stap heeft geen Werkt/Niet goed maar een eigen Doorgaan-knop. */
  const geen=!!t.geenOordeel;
  document.querySelector('.oordeel').style.display=geen?'none':'flex';
  document.querySelector('.oordeeluit').style.display=geen?'none':'block';
  try{ t.start(); }catch(e){ document.getElementById('testvak').innerHTML=
    '<p class="muted klein">Automatisch starten lukte niet. Test met de hand en kies Werkt of Niet goed.</p>'; }
}

function oordeel(w){
  const t=TESTS[nu];
  resultaat[t.id]=w;
  nu++; tekenTest();
}
function vorige(){ if(nu>0){ nu--; tekenTest(); } }

async function versturen(){
  opruimen(); volSluit();
  const schoon={};
  Object.keys(resultaat).forEach(k=>{
    if(k==='accu'){ if(typeof resultaat[k]==='number') schoon.accu=resultaat[k]; }
    else if(resultaat[k]==='ok'||resultaat[k]==='fout') schoon[k]=resultaat[k];
  });
  if(!Object.keys(schoon).length){ document.getElementById('werk').hidden=true; stop('Niets getest','Er is geen uitslag om te versturen.'); return; }
  document.getElementById('werk').hidden=true; document.getElementById('fout').hidden=true;
  document.getElementById('watIsHet').textContent='Bezig met versturen…';
  try{
    await praat({resultaat:schoon});
    document.getElementById('watIsHet').textContent='';
    const naam={touch:'Touchscreen',scherm:'Beeldscherm',luidspreker:'Luidspreker',oorspeaker:'Oorspeaker',microfoon:'Microfoon',
      camera_achter:'Camera achter',camera_voor:'Camera voor',trilfunctie:'Trilfunctie',sensoren:'Sensoren',accu:'Accu-conditie'};
    document.getElementById('uitslagLijst').innerHTML=TESTS.filter(t=>resultaat[t.id]!=null).map(t=>{
      const r=resultaat[t.id];
      const isAccu=t.id==='accu' && typeof r==='number';
      const kl = isAccu?'ok' : r;
      const tk = isAccu ? r+'%' : (r==='ok'?'Werkt':(r==='fout'?'Niet goed':'Overgeslagen'));
      return `<div class="uitslagrij">${esc(naam[t.id]||t.id)}<span class="st ${kl}">${esc(tk)}</span></div>`; }).join('');
    document.getElementById('klaarKaart').hidden=false;
  }catch(e){
    document.getElementById('watIsHet').textContent='';
    document.getElementById('foutKop').textContent='Versturen lukte niet';
    document.getElementById('foutTekst').textContent=e.message+' De uitslag staat nog klaar; probeer het opnieuw.';
    document.getElementById('fout').hidden=false;
    if(!document.getElementById('retryknop')){
      const b=document.createElement('button'); b.id='retryknop'; b.className='btn actie'; b.style.marginTop='12px';
      b.textContent='Opnieuw versturen'; b.onclick=()=>{ document.getElementById('fout').hidden=true; versturen(); };
      document.getElementById('fout').appendChild(b);
    }
  }
}

/* ---- touch: fullscreen tekenvlak ---- */
function startTouch(){
  volOpen('<canvas id="touchdoek"></canvas>', 'Veeg over het hele scherm');
  const c=document.getElementById('touchdoek');
  const dpr=window.devicePixelRatio||1;
  const maat=()=>{ c.width=Math.round(window.innerWidth*dpr); c.height=Math.round(window.innerHeight*dpr); };
  maat();
  const x=c.getContext('2d'); x.scale(dpr,dpr); x.lineWidth=10; x.lineCap='round'; x.strokeStyle='#E88A1D';
  let teken=false, lx=0, ly=0;
  const pos=e=>{ const p=e.touches?e.touches[0]:e; return [p.clientX, p.clientY]; };
  const neer=e=>{ teken=true; [lx,ly]=pos(e); e.preventDefault(); };
  const beweeg=e=>{ if(!teken) return; const [nx,ny]=pos(e); x.beginPath(); x.moveTo(lx,ly); x.lineTo(nx,ny); x.stroke(); [lx,ly]=[nx,ny]; e.preventDefault(); };
  const op=()=>{ teken=false; };
  c.addEventListener('touchstart',neer,{passive:false}); c.addEventListener('touchmove',beweeg,{passive:false});
  c.addEventListener('touchend',op); c.addEventListener('mousedown',neer); c.addEventListener('mousemove',beweeg); c.addEventListener('mouseup',op);
  opruimer=()=>{};
}

/* ---- scherm: fullscreen kleuren die vanzelf doorlopen ---- */
const KLEUREN=[['Rood','#FF0000'],['Groen','#00FF00'],['Blauw','#0000FF'],['Wit','#FFFFFF'],['Zwart','#000000'],['Grijs','#808080']];
function startScherm(){
  volOpen('<div class="kleur" id="kleurvlak"></div>', '');
  let i=0;
  const zet=()=>{
    const [naam,kl]=KLEUREN[i];
    const el=document.getElementById('kleurvlak'); if(el) el.style.background=kl;
    /* ook de achtergrond eronder, zodat rand en overscroll dezelfde kleur zijn */
    document.documentElement.style.background=kl; document.body.style.background=kl;
    document.getElementById('volLabel').textContent=naam+' · loopt vanzelf door';
    document.getElementById('volLabel').style.color = kl==='#FFFFFF'||kl==='#808080' ? '#111' : '#fff';
  };
  zet();
  const timer=setInterval(()=>{ i=(i+1)%KLEUREN.length; zet(); }, 1400);
  opruimer=()=>{ clearInterval(timer); };
}

/* ---- geluid: betrouwbaar afspelen na een tik, ook op iOS ----
   Op iOS dempt de mute-schakelaar pure Web Audio; een stil audio-element en de
   audio-session op 'playback' halen het geluid daar doorheen. Alles moet synchroon
   in de tik gebeuren, anders vervalt het gebaar-token en blijft het stil. Nooit
   exponentieel naar of vanaf exact 0 rampen: dat is de klassieke stille fout. */
let audioCtx=null, stilEl=null;
const STIL_WAV='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';
function ensureAudio(){
  if(!audioCtx){ const AC=window.AudioContext||window.webkitAudioContext; audioCtx=new AC(); }
  try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){}
  if(!stilEl){ stilEl=new Audio(STIL_WAV); stilEl.loop=true; stilEl.setAttribute('playsinline',''); }
  stilEl.play().catch(()=>{});
  if(audioCtx.state!=='running') audioCtx.resume().catch(()=>{});
}
function speelToon(freq){
  try{
    ensureAudio();
    const now=audioCtx.currentTime;
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type='sine'; o.frequency.value=freq||440;
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(0.3, now+0.02);
    g.gain.setTargetAtTime(0.0001, now+0.9, 0.05);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(now); o.stop(now+1.2);
    o.onended=()=>{ try{ o.disconnect(); g.disconnect(); }catch(e){} };
  }catch(e){ toast('Geluid spelen lukte niet, test met de hand','fout'); }
}
/* iOS zet de context op 'interrupted' na een tabwissel of telefoontje; bij
   terugkomst weer aanzwengelen. */
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && audioCtx && audioCtx.state!=='running') audioCtx.resume().catch(()=>{}); });
function startLuidspreker(){

/* ---- microfoon: live meter ---- */
function startMicrofoon(){
  const mijnStap=stapId;
  const vak=document.getElementById('testvak');
  vak.innerHTML='<div class="meter"><i id="micbalk"></i></div><p class="muted klein" style="margin-top:10px">Praat of tik op de microfoon onderaan.</p>';
  navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
    if(mijnStap!==stapId){ stream.getTracks().forEach(t=>t.stop()); return; }
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const bron=ctx.createMediaStreamSource(stream); const an=ctx.createAnalyser(); an.fftSize=512;
    bron.connect(an); const buf=new Uint8Array(an.fftSize); let loopt=true;
    (function meet(){ if(!loopt) return;
      an.getByteTimeDomainData(buf);
      let piek=0; for(let i=0;i<buf.length;i++){ const v=Math.abs(buf[i]-128); if(v>piek) piek=v; }
      const el=document.getElementById('micbalk'); if(el) el.style.width=Math.min(100, piek/1.1)+'%';
      requestAnimationFrame(meet);
    })();
    opruimer=()=>{ loopt=false; stream.getTracks().forEach(t=>t.stop()); try{ctx.close();}catch(e){} };
  }).catch(()=>{ vak.innerHTML='<p class="muted klein">Geen toegang tot de microfoon. Test met de hand.</p>'; });
}

/* ---- camera ---- */
function startCamera(kant){
  const mijnStap=stapId;
  const vak=document.getElementById('testvak');
  const v=document.createElement('video'); v.id='camerabeeld'; v.autoplay=true; v.playsInline=true; v.muted=true;
  vak.appendChild(v);
  navigator.mediaDevices.getUserMedia({video:{facingMode:kant}}).then(stream=>{
    if(mijnStap!==stapId){ stream.getTracks().forEach(t=>t.stop()); return; }
    v.srcObject=stream; opruimer=()=>{ stream.getTracks().forEach(t=>t.stop()); };
  }).catch(()=>{ vak.innerHTML='<p class="muted klein">Geen toegang tot de camera. Test met de hand.</p>'; });
}

/* Camera achter met een lens-kiezer: eerst toestemming (anders zijn de labels
   leeg), dan alle achterlenzen enumereren en er live doorheen wisselen. Mobiel kan
   geen twee achterlenzen tegelijk openen, dus we stoppen de oude stream eerst. */
let camStream=null;
function camStop(){ if(camStream){ try{ camStream.getTracks().forEach(t=>t.stop()); }catch(e){} camStream=null; } }
function lensNaam(label, i){
  const l=(label||'').toLowerCase();
  if(/ultra/.test(l)) return 'Ultragroothoek';
  if(/tele|zoom/.test(l)) return 'Tele';
  if(/wide|groothoek/.test(l)) return 'Groothoek';
  return 'Lens '+(i+1);
}
async function toonLens(deviceId){
  camStop();
  const v=document.getElementById('camerabeeld'); if(!v) return;
  try{
    camStream=await navigator.mediaDevices.getUserMedia({video: deviceId?{deviceId:{exact:deviceId}}:{facingMode:'environment'}});
    v.srcObject=camStream;
  }catch(e){ toast('Deze lens openen lukte niet','fout'); }
}
async function startCameraAchter(){
  const mijnStap=stapId;
  const vak=document.getElementById('testvak');
  vak.innerHTML='<div id="lensknoppen" style="display:flex; gap:8px; overflow-x:auto; margin-bottom:10px"></div>'+
    '<video id="camerabeeld" autoplay playsinline muted></video>';
  try{
    const seed=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    if(mijnStap!==stapId){ seed.getTracks().forEach(t=>t.stop()); return; }
    camStream=seed;
    const v=document.getElementById('camerabeeld'); if(v) v.srcObject=seed;
    opruimer=()=>{ camStop(); };
    const cams=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');
    const achter=cams.filter(d=>/back|rear|environment|achter|arrière|trasera/i.test(d.label||''));
    const lijst=achter.length?achter:cams;
    const kn=document.getElementById('lensknoppen');
    if(kn && lijst.length>1){
      kn.innerHTML=lijst.map((d,i)=>`<button class="btn ghost" style="width:auto; flex:none; padding:11px 16px" data-lens="${esc(d.deviceId)}">${esc(lensNaam(d.label,i))}</button>`).join('');
      kn.querySelectorAll('[data-lens]').forEach(b=>b.onclick=()=>{
        toonLens(b.dataset.lens);
        kn.querySelectorAll('.btn').forEach(x=>x.classList.remove('actie')); b.classList.add('actie');
      });
      const eerste=kn.querySelector('.btn'); if(eerste) eerste.classList.add('actie');
    } else if(kn){
      kn.innerHTML='<span class="muted klein">Eén achterlens beschikbaar op dit toestel.</span>';
    }
  }catch(e){ vak.innerHTML='<p class="muted klein">Geen toegang tot de camera. Test met de hand.</p>'; }
}

  }

}

/* ---- sensoren: vloeiende kantelstip ---- */
function startSensoren(){
  volOpen('<div class="tilt"><div class="tiltkruis"></div><div class="tiltstip" id="tiltstip"></div></div>', 'Kantel het toestel');
  let doelX=0, doelY=0, x=0, y=0, loopt=true;
  const onOri=e=>{
    doelX=Math.max(-40,Math.min(40, e.gamma||0));
    doelY=Math.max(-40,Math.min(40, e.beta||0));
  };
  const teken=()=>{
    if(!loopt) return;
    /* een laagdoorlaatfilter smoothet de sprongen van de sensor weg */
    x+=(doelX-x)*0.12; y+=(doelY-y)*0.12;
    const el=document.getElementById('tiltstip');
    if(el) el.style.transform='translate('+(x*3).toFixed(1)+'px,'+(y*3).toFixed(1)+'px)';
    requestAnimationFrame(teken);
  };
  const aanhaken=()=>{ window.addEventListener('deviceorientation', onOri); teken(); };
  if(typeof DeviceOrientationEvent!=='undefined' && typeof DeviceOrientationEvent.requestPermission==='function'){
    document.getElementById('volInhoud').insertAdjacentHTML('beforeend','<button class="btn" id="sensorknop" style="position:fixed; left:16px; right:16px; top:50%; width:auto; z-index:3">Sensoren aanzetten</button>');
    document.getElementById('sensorknop').onclick=()=>{
      DeviceOrientationEvent.requestPermission().then(s=>{ const b=document.getElementById('sensorknop'); if(b) b.remove(); if(s==='granted') aanhaken(); else toast('Geen toegang tot de sensoren','fout'); }).catch(()=>{});
    };
  } else { aanhaken(); }
  opruimer=()=>{ loopt=false; window.removeEventListener('deviceorientation', onOri); };
}

    '<button class="btn actie" onclick="accuDoor()">Doorgaan</button>';
  const el=document.getElementById('accuveld');

  resultaat['accu']= accuWaarde!=='' ? Math.max(0,Math.min(100,Math.round(Number(accuWaarde)))) : 'over';
  nu++; tekenTest();
