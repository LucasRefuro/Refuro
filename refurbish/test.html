<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Toestel testen · Storvo</title>
<link rel="icon" href="/merk/app-icoon.svg">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Sora:wght@700;800&display=swap" rel="stylesheet">
<style>
/* Functioneel testen met het toestel in de hand.
   Werkt op een code van een half uur uit de QR op de pc; geen inlog op dit
   toestel. De browser doet per onderdeel iets (fullscreen kleur, tekenvlak,
   geluid, camera, trillen) en jij beoordeelt of het werkt. Sommige dingen kan
   een browser niet lezen (accu-gezondheid, Face ID, vingerafdruk, IMEI); die
   blijven met de hand in de controle op de pc. */
:root{
  --groen:#0B5B52; --oranje:#E88A1D; --bg:#F7F6F3; --card:#fff; --border:#ECEAE4;
  --tekst:#17201E; --muted:#5B6663; --muted-l:#8A938F; --lblauw:#E7F1EE;
  --green-soft:#E3F4EC; --green-tekst:#177A51; --red-soft:#FAE4E4; --red-tekst:#A33333;
  --pil:100px;
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
[hidden]{display:none !important;}
html,body{height:100%;}
body{font-family:'Instrument Sans',system-ui,sans-serif; background:var(--bg); color:var(--tekst);
  font-size:16px; line-height:1.55; padding:18px 16px calc(18px + env(safe-area-inset-bottom));
  max-width:600px; margin:0 auto; overscroll-behavior:none;}
h1{font-family:'Sora',sans-serif; font-size:21px; font-weight:800; letter-spacing:-.02em;}
.kop{display:flex; align-items:center; gap:12px; margin-bottom:4px;}
.kop .mark{width:32px; height:32px; flex:none;}
.muted{color:var(--muted);} .klein{font-size:13.5px;}
.kaart{background:var(--card); border-radius:20px; padding:18px; margin-top:14px;
  box-shadow:0 6px 24px rgba(23,32,30,.07);}
.btn{display:flex; align-items:center; justify-content:center; gap:9px; width:100%;
  padding:15px 20px; border:none; border-radius:var(--pil); font-family:inherit;
  font-size:16px; font-weight:700; cursor:pointer; background:var(--groen); color:#fff;}
.btn.actie{background:var(--oranje);} .btn.goed{background:var(--green-tekst);} .btn.slecht{background:var(--red-tekst);}
.btn.ghost{background:var(--card); color:var(--tekst); border:1.5px solid var(--border);}
.btn:disabled{opacity:.5;}

/* voortgang en kop van een test */
.balkrij{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
.terug{flex:none; width:40px; height:40px; border-radius:50%; border:1.5px solid var(--border);
  background:var(--card); display:flex; align-items:center; justify-content:center; cursor:pointer;}
.terug svg{width:18px; height:18px; fill:none; stroke:var(--tekst); stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round;}
.terug:disabled{opacity:.35;}
.voortgang{display:flex; gap:5px; flex:1;}
.vstip{height:6px; flex:1; border-radius:var(--pil); background:var(--border);}
.vstip.nu{background:var(--oranje);} .vstip.ok{background:var(--green-tekst);} .vstip.fout{background:var(--red-tekst);} .vstip.over{background:var(--muted-l);}
.teller{flex:none; font-size:13px; font-weight:700; color:var(--muted);}

.testnaam{font-family:'Sora',sans-serif; font-size:20px; font-weight:800; margin-bottom:4px;}
.testuit{color:var(--muted); font-size:14.5px; margin-bottom:16px;}
.testvak{margin-bottom:18px;}
.oordeel{display:flex; gap:12px;} .oordeel .btn{flex:1;}
.oordeeluit{width:100%; margin-top:10px;}

/* de meter voor de microfoon */
.meter{height:30px; border-radius:var(--pil); background:var(--border); overflow:hidden;}
.meter i{display:block; height:100%; width:0; background:var(--green-tekst); transition:width .04s linear;}
#camerabeeld{width:100%; height:300px; border-radius:16px; background:#111; object-fit:cover;}

/* fullscreen laag voor touch, kleuren en sensoren */
#vol{position:fixed; inset:0; z-index:100; background:#000; display:none;}
#vol.aan{display:block;}
#vol canvas, #vol .kleur{position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none;}
#vol .tilt{position:absolute; inset:0;}
#vol .tiltstip{position:absolute; width:54px; height:54px; border-radius:50%; background:var(--oranje);
  left:calc(50% - 27px); top:calc(50% - 27px); box-shadow:0 6px 20px rgba(0,0,0,.35); will-change:transform;}
#vol .tiltkruis::before,#vol .tiltkruis::after{content:''; position:absolute; background:rgba(255,255,255,.16);}
#vol .tiltkruis::before{left:50%; top:0; bottom:0; width:2px;} #vol .tiltkruis::after{top:50%; left:0; right:0; height:2px;}
#vol .volbalk{position:fixed; left:12px; right:12px; bottom:calc(14px + env(safe-area-inset-bottom));
  display:flex; gap:10px; align-items:center; z-index:2;}
#vol .volbalk .btn{padding:14px 16px; box-shadow:0 8px 24px rgba(0,0,0,.3);}
#vol .vollabel{position:fixed; left:0; right:0; top:calc(14px + env(safe-area-inset-top)); text-align:center;
  z-index:2; color:#fff; font-weight:700; font-size:15px; text-shadow:0 1px 3px rgba(0,0,0,.5); pointer-events:none;}

/* laptop: toetsenbord en touchpad in de fullscreen-laag */
#vol .kbtel{position:fixed; left:0; right:0; top:calc(46px + env(safe-area-inset-top)); text-align:center; z-index:2; color:#fff; font-weight:700; font-size:15px;}
#vol .kbd{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:100%; max-width:900px; display:flex; flex-direction:column; gap:6px; padding:0 12px;}
.kbrow{display:flex; gap:6px;}
.kbkey{flex:1 1 0; min-width:0; background:rgba(255,255,255,.13); color:#fff; border-radius:8px; padding:14px 4px; text-align:center; font-size:13px; font-weight:600; border:1px solid rgba(255,255,255,.18); user-select:none; overflow:hidden; white-space:nowrap;}
.kbkey.in{background:var(--green-tekst); border-color:var(--green-tekst); color:#fff;}
#vol .tpwrap{position:absolute; left:12px; right:12px; top:66px; bottom:96px; display:flex; flex-direction:column; gap:14px;}
#vol .tpwrap canvas{position:static; inset:auto; flex:1; width:100%; height:auto; background:rgba(255,255,255,.92); border-radius:14px; touch-action:none;}
.tpind{display:flex; gap:10px; justify-content:center; flex-wrap:wrap;}
.tpbtn{padding:9px 16px; border-radius:var(--pil); background:rgba(255,255,255,.14); color:#fff; font-weight:700; font-size:13px; border:1px solid rgba(255,255,255,.2);}
.tpbtn.in{background:var(--green-tekst); border-color:var(--green-tekst);}

/* laptop: toetsenbord wisselen (EU/US, met of zonder numpad) */
#vol .kbkies{position:fixed; left:0; right:0; top:calc(70px + env(safe-area-inset-top)); display:flex; gap:8px; justify-content:center; z-index:2;}
.kbtab{padding:8px 15px; border-radius:var(--pil); background:rgba(255,255,255,.14); color:#fff; font-weight:700; font-size:13px; border:1px solid rgba(255,255,255,.22); cursor:pointer; font-family:inherit;}
.kbtab.aan{background:var(--oranje); border-color:var(--oranje);}
#vol .kbwrap{position:absolute; left:50%; top:53%; transform:translate(-50%,-50%); width:100%; max-width:1060px; display:flex; gap:16px; align-items:flex-start; justify-content:center; padding:0 12px;}
.kbmain{flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:6px;}
.kbpad{flex:0 0 auto; width:210px; display:flex; flex-direction:column; gap:6px;}

/* accu-stap op de laptop: kies OS en plak het commando */
.ostabs{display:flex; gap:8px; margin:2px 0 14px; flex-wrap:wrap;}
.ostab{flex:1; min-width:90px; padding:10px 8px; border:1.5px solid var(--border); background:var(--card); border-radius:14px; font-family:inherit; font-size:14px; font-weight:700; color:var(--muted); cursor:pointer;}
.ostab.aan{border-color:var(--groen); background:var(--green-soft); color:var(--green-tekst);}
.astap{display:flex; gap:12px; margin-bottom:12px;}
.astapnr{flex:none; width:24px; height:24px; border-radius:50%; background:var(--groen); color:#fff; font-weight:800; font-size:13px; display:flex; align-items:center; justify-content:center;}
.cmdbox{background:#12211E; color:#EAF3F0; border-radius:12px; padding:12px; overflow-x:auto; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; line-height:1.5; white-space:pre; margin:6px 0 0;}
.astatus{margin-top:14px; padding:14px; border-radius:14px; text-align:center; font-weight:700;}
.astatus.wacht{background:var(--lblauw); color:var(--groen);}
.astatus.klaar{background:var(--green-soft); color:var(--green-tekst);}
.aspin{display:inline-block; width:14px; height:14px; border:2.5px solid var(--groen); border-top-color:transparent; border-radius:50%; animation:adraai .8s linear infinite; vertical-align:-2px; margin-right:8px;}
@keyframes adraai{to{transform:rotate(360deg);}}

/* aansluitingen / poorten */
.poortlijst{display:flex; flex-direction:column; gap:8px;}
.poortrij{display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:10px 0; border-bottom:1px solid var(--border);}
.poortnaam{flex:1 1 130px; font-weight:600; font-size:15px; display:flex; align-items:center; gap:8px;}
.poortauto{background:var(--green-soft); color:var(--green-tekst); font-size:11.5px; font-weight:700; border-radius:var(--pil); padding:2px 8px;}
.poortknoppen{display:flex; gap:6px;}
.poortknop{padding:8px 11px; border:1.5px solid var(--border); background:var(--card); border-radius:12px; font-family:inherit; font-size:13px; font-weight:700; color:var(--muted); cursor:pointer;}
.poortknop.aan[data-w="ok"]{background:var(--green-tekst); border-color:var(--green-tekst); color:#fff;}
.poortknop.aan[data-w="fout"]{background:var(--red-tekst); border-color:var(--red-tekst); color:#fff;}
.poortknop.aan[data-w="nvt"]{background:var(--muted-l); border-color:var(--muted-l); color:#fff;}
.poortlees{margin-top:14px; background:var(--lblauw); border-radius:14px; padding:12px 14px;}
.poortlees summary{font-weight:700; cursor:pointer; color:var(--groen);}

/* camera + microfoon samen (een keer toegang vragen) */
#avbeeld{width:100%; max-width:340px; height:220px; border-radius:16px; background:#111; object-fit:cover; display:block; margin:0 auto;}
.avrij{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 0; border-bottom:1px solid var(--border);}
.avrij:last-of-type{border-bottom:0;}
.avrij b{font-weight:600; font-size:15px;}

#toasts{position:fixed; left:16px; right:16px; bottom:16px; display:flex; flex-direction:column; gap:8px; z-index:200;}
.toast{background:var(--tekst); color:#fff; padding:13px 18px; border-radius:14px; font-size:14.5px;}
.toast.ok{background:var(--green-tekst);} .toast.fout{background:var(--red-tekst);}
.klaarvak{text-align:center; padding:10px 0;}
.klaarvak .vink{width:60px; height:60px; margin:0 auto 14px; border-radius:50%;
  background:var(--green-soft); color:var(--green-tekst); display:flex; align-items:center; justify-content:center;}
.klaarvak .vink svg{width:30px; height:30px; fill:none; stroke:currentColor; stroke-width:3; stroke-linecap:round; stroke-linejoin:round;}
.uitslagrij{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); font-size:15px;}
.uitslagrij:last-child{border-bottom:0;} .uitslagrij .st{margin-left:auto; font-weight:700;}
.uitslagrij .st.ok{color:var(--green-tekst);} .uitslagrij .st.fout{color:var(--red-tekst);} .uitslagrij .st.over{color:var(--muted-l);}
</style>
</head>
<body>

<div class="kop">
  <div class="mark" id="merkVlak"></div>
  <div><h1>Toestel testen</h1></div>
</div>
<p class="muted klein" id="watIsHet">Bezig met openen…</p>

<div id="werk" hidden>
  <div class="kaart">
    <div class="balkrij">
      <button class="terug" id="terugKnop" onclick="vorige()" aria-label="Vorige"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div class="voortgang" id="voortgang"></div>
      <div class="teller" id="teller"></div>
    </div>
    <div class="testnaam" id="testnaam"></div>
    <div class="testuit" id="testuit"></div>
    <div class="testvak" id="testvak"></div>
    <div class="oordeel">
      <button class="btn slecht" onclick="oordeel('fout')">Niet goed</button>
      <button class="btn goed" onclick="oordeel('ok')">Werkt</button>
    </div>
    <button class="btn ghost oordeeluit" onclick="oordeel('over')">Overslaan</button>
  </div>
</div>

<div class="kaart" id="klaarKaart" hidden>
  <div class="klaarvak">
    <div class="vink"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></div>
    <b>Uitslag verstuurd</b>
    <p class="muted klein" style="margin-top:6px">Je kunt dit venster sluiten. Op de pc haal je de uitslag op in de controle.</p>
  </div>
  <div id="uitslagLijst" style="margin-top:14px"></div>
</div>

<div class="kaart" id="fout" hidden>
  <b id="foutKop"></b>
  <p class="muted klein" id="foutTekst" style="margin-top:6px"></p>
</div>

<div class="kaart" id="codeInvoer" hidden>
  <b id="codeKop">Vul de code in</b>
  <p class="muted klein" id="codeUit" style="margin-top:6px; margin-bottom:12px">Typ de code van de computer over.</p>
  <input id="codeVeld" type="text" inputmode="numeric" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="12" placeholder="bijv. 4821"
    style="width:100%; padding:16px 18px; font-size:30px; font-weight:800; letter-spacing:8px; text-transform:uppercase; border:1.5px solid var(--border); border-radius:16px; text-align:center; font-family:inherit">
  <button class="btn actie" style="margin-top:12px" onclick="codeDoor()">Doorgaan</button>
</div>

<div id="vol">
  <button class="terug" id="volTerug" onclick="vorige()" aria-label="Vorige"
    style="position:fixed; left:14px; top:calc(12px + env(safe-area-inset-top)); z-index:3; background:rgba(255,255,255,.9)">
    <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
  <div class="vollabel" id="volLabel"></div>
  <div id="volInhoud"></div>
  <div class="volbalk">
    <button class="btn slecht" onclick="oordeel('fout')">Niet goed</button>
    <button class="btn goed" onclick="oordeel('ok')">Werkt</button>
  </div>
</div>

<div id="toasts"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://ugilfxqolemxwssbpdwu.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVnaWxmeHFvbGVteHdzc2JwZHd1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3ODk1NTUsImV4cCI6MjEwMTM2NTU1NX0.7q6R7J0_U0iU6AGlxFoBHpH22cRBluapP3nOsuIssqA';

/* De code komt uit ?c=CODE (de QR), uit het pad /refurbish/test/CODE (als je hem
   op de laptop overtypt), of straks uit het invoerveld. 'let' want het veld kan
   hem later zetten; praat() pakt de nieuwe waarde dan vanzelf. */
let code=(function(){
  const q=new URLSearchParams(location.search).get('c');
  if(q) return q.trim().toUpperCase();
  const m=location.pathname.match(/\/test\/([A-Za-z0-9]{3,12})\/?$/);
  return m ? m[1].trim().toUpperCase() : '';
})();
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(bericht, soort){
  const c=document.getElementById('toasts');
  const t=document.createElement('div'); t.className='toast '+(soort||''); t.textContent=bericht;
  c.appendChild(t); setTimeout(()=>t.remove(), 3200);
}
function stop(kop, tekst){
  volSluit(); document.getElementById('watIsHet').textContent='';
  document.getElementById('werk').hidden=true;
  document.getElementById('foutKop').textContent=kop;
  document.getElementById('foutTekst').textContent=tekst;
  document.getElementById('fout').hidden=false;
}

document.getElementById('merkVlak').innerHTML=
  `<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
    <rect x="3" y="3" width="19" height="19" rx="5" fill="#0B5B52"/>
    <rect x="26" y="3" width="19" height="19" rx="5" fill="#6A9C93"/>
    <rect x="3" y="26" width="19" height="19" rx="5" fill="#A7C3BD"/>
    <path d="M28 36.5 L33 41.5 L44 28" fill="none" stroke="#0B5B52" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;

async function praat(lijf){
  const res=await fetch(SUPABASE_URL+'/functions/v1/refurbish-test',{
    method:'POST', headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON_KEY},
    body:JSON.stringify(Object.assign({code}, lijf))
  });
  const uit=await res.json().catch(()=>({}));
  if(!res.ok||!uit.ok) throw new Error(uit.error||'Er ging iets mis');
  return uit;
}

/* ---- de tests ----
   soorten: voor welke categorieen deze test telt. vol:true = fullscreen laag.
   Elke start() zet iets klaar; opruimen() stopt camera's/microfoon/timers. */
const ALLE_TESTS=[
  {id:'touch', naam:'Touchscreen', uit:'Veeg met je vinger over het HELE scherm, ook de randen en hoeken. Alles moet meetekenen.', soorten:['Telefoon','Tablet'], vol:true, start:startTouch},
  {id:'scherm', naam:'Beeldscherm', uit:'Het scherm loopt vanzelf door de kleuren. Zoek dode pixels, vlekken of ingebrande beelden.', soorten:['Telefoon','Tablet'], vol:true, start:startScherm},
  {id:'luidspreker', naam:'Luidspreker (onderkant)', uit:'De speaker onderaan, voor muziek en de speaker-stand. Druk op de knop en luister.', soorten:['Telefoon','Tablet'], start:startLuidspreker},
  {id:'microfoon', naam:'Microfoon', uit:'Zeg iets. De balk moet meebewegen.', soorten:['Telefoon','Tablet'], start:startMicrofoon},
  {id:'oorspeaker', naam:'Oorspeaker (bovenaan)', uit:'De speaker bovenaan die je bij het oor houdt. Druk op de knop, houd het aan je oor en luister.', soorten:['Telefoon'], start:startOorspeaker},
  {id:'camera_achter', naam:'Camera achter', uit:'Bekijk elke lens en kijk of het beeld scherp is, zonder vlekken.', soorten:['Telefoon','Tablet'], start:startCameraAchter},
  {id:'camera_voor', naam:'Camera voor', uit:'Kijk of de selfiecamera goed beeld geeft.', soorten:['Telefoon','Tablet'], start:()=>startCamera('user')},
  {id:'trilfunctie', naam:'Trilfunctie', uit:'Het toestel trilt kort. Voel je het?', soorten:['Telefoon'], start:startTril},
  {id:'sensoren', naam:'Sensoren', uit:'Kantel het toestel rustig. De stip volgt vloeiend mee.', soorten:['Telefoon','Tablet'], vol:true, start:startSensoren},
  {id:'accu', naam:'Accu-conditie', uit:'De accugezondheid. Een browser kan die niet zelf lezen: op een telefoon lees je hem af, op een laptop meet hij zichzelf.', soorten:['Telefoon','Tablet','Laptop'], geenOordeel:true, start:startAccu},
  /* ── Laptop: op de laptop zelf. Toetsenbord is de ster: elke toets indrukken en
     groen zien worden, zonder dat er iets gebeurt (preventDefault). ── */
  {id:'toetsenbord', naam:'Toetsenbord', uit:'Druk elke toets één keer in. Hij wordt groen. Zo zie je meteen of alle toetsen werken.', soorten:['Laptop'], vol:true, start:startToetsenbord},
  {id:'touchpad', naam:'Touchpad', uit:'Beweeg de cursor en teken met het touchpad. Test ook de linker- en rechterknop en scrollen.', soorten:['Laptop'], vol:true, start:startTouchpad},
  {id:'scherm', naam:'Beeldscherm', uit:'Het scherm loopt door de kleuren. Zoek dode pixels, vlekken of strepen.', soorten:['Laptop'], vol:true, start:startScherm},
  {id:'luidspreker', naam:'Luidsprekers', uit:'Zet het volume omhoog en druk op de knop. Hoor je hem helder, links en rechts, zonder kraken?', soorten:['Laptop'], start:startLuidspreker},
  {id:'camera', naam:'Camera en microfoon', uit:'Zie je jezelf scherp in beeld en beweegt de balk als je praat?', soorten:['Laptop'], geenOordeel:true, start:startAV},
  {id:'poorten', naam:'Aansluitingen', uit:'Sluit je teststick, de lader en een scherm aan en vink af. Lader en extern scherm gaan vanzelf.', soorten:['Laptop'], geenOordeel:true, start:startPoorten}
];
let TESTS=ALLE_TESTS.slice();
let nu=0;
let accuWaarde='';
let categorie='';
const resultaat={};

/* ---- fullscreen laag ---- */
let opruimer=null, stapId=0;
function opruimen(){ stapId++; if(opruimer){ try{ opruimer(); }catch(e){} opruimer=null; } }
function volOpen(inhoudHtml, label){
  const vol=document.getElementById('vol');
  document.getElementById('volInhoud').innerHTML=inhoudHtml;
  document.getElementById('volLabel').textContent=label||'';
  vol.classList.add('aan');
  /* Op Android zet dit hem echt fullscreen; iOS negeert het netjes en de laag
     vult zelf al het scherm. */
  try{ if(vol.requestFullscreen) vol.requestFullscreen(); else if(vol.webkitRequestFullscreen) vol.webkitRequestFullscreen(); }catch(e){}
}
function uitFullscreen(){
  try{ if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen();
    else if(document.webkitFullscreenElement && document.webkitExitFullscreen) document.webkitExitFullscreen(); }catch(e){}

/* Shift+Esc verlaat een volledig-scherm-test. Gewone Esc niet: die toets testen we

async function versturen(){

    if(k==='accu'){ if(typeof resultaat[k]==='number') schoon.accu=resultaat[k]; }

  });

      return `<div class="uitslagrij">${esc(naam[t.id]||t.id)}<span class="st ${kl}">${esc(tk)}</span></div>`; }).join('');

function startTouch(){

  const maat=()=>{ c.width=Math.round(window.innerWidth*dpr); c.height=Math.round(window.innerHeight*dpr); };
  maat();
  const x=c.getContext('2d'); x.scale(dpr,dpr); x.lineWidth=10; x.lineCap='round'; x.strokeStyle='#E88A1D';
  let teken=false, lx=0, ly=0;
  const pos=e=>{ const p=e.touches?e.touches[0]:e; return [p.clientX, p.clientY]; };
  const neer=e=>{ teken=true; [lx,ly]=pos(e); e.preventDefault(); };
  const beweeg=e=>{ if(!teken) return; const [nx,ny]=pos(e); x.beginPath(); x.moveTo(lx,ly); x.lineTo(nx,ny); x.stroke(); [lx,ly]=[nx,ny]; e.preventDefault(); };
  const op=()=>{ teken=false; };
  c.addEventListener('touchstart',neer,{passive:false}); c.addEventListener('touchmove',beweeg,{passive:false});
  c.addEventListener('touchend',op); c.addEventListener('mousedown',neer); c.addEventListener('mousemove',beweeg); c.addEventListener('mouseup',op);
  opruimer=()=>{};
}

/* ---- toetsenbord: elke toets indrukken, hij wordt groen ----

   toets die we testen). */
function kbBasis(eu){

    [['Escape','esc',1.4],['F1','F1'],['F2','F2'],['F3','F3'],['F4','F4'],['F5','F5'],['F6','F6'],['F7','F7'],['F8','F8'],['F9','F9'],['F10','F10'],['F11','F11'],['F12','F12']],

    [['Tab','Tab',1.5],['KeyQ','Q'],['KeyW','W'],['KeyE','E'],['KeyR','R'],['KeyT','T'],['KeyY','Y'],['KeyU','U'],['KeyI','I'],['KeyO','O'],['KeyP','P'],['BracketLeft','['],['BracketRight',']']],
    [['CapsLock','Caps',1.9],['KeyA','A'],['KeyS','S'],['KeyD','D'],['KeyF','F'],['KeyG','G'],['KeyH','H'],['KeyJ','J'],['KeyK','K'],['KeyL','L'],['Semicolon',';'],['Quote','&#39;'],['Backslash','\\'],['Enter','⏎',1.6]],

      : [['ShiftLeft','⇧',2.4],['KeyZ','Z'],['KeyX','X'],['KeyC','C'],['KeyV','V'],['KeyB','B'],['KeyN','N'],['KeyM','M'],['Comma',','],['Period','.'],['Slash','/'],['ShiftRight','⇧',2.4]],
    [['ControlLeft','Ctrl',1.4],['MetaLeft','⊞',1.2],['AltLeft','Alt',1.2],['Space','spatie',6],['AltRight','Alt',1.2],['ArrowLeft','←'],['ArrowUp','↑'],['ArrowDown','↓'],['ArrowRight','→']]
  ];
}
const KB_NUMPAD=[
  [['NumLock','Num'],['NumpadDivide','/'],['NumpadMultiply','*'],['NumpadSubtract','-']],
  [['Numpad7','7'],['Numpad8','8'],['Numpad9','9'],['NumpadAdd','+']],

function kbCodes(){

function kbRender(){

/* ---- geluid: betrouwbaar afspelen na een tik, ook op iOS ----
   Op iOS dempt de mute-schakelaar pure Web Audio; een stil audio-element en de
   audio-session op 'playback' halen het geluid daar doorheen. Alles moet synchroon
   in de tik gebeuren, anders vervalt het gebaar-token en blijft het stil. Nooit
   exponentieel naar of vanaf exact 0 rampen: dat is de klassieke stille fout. */
let audioCtx=null, stilEl=null;
const STIL_WAV='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';
function ensureAudio(){
  if(!audioCtx){ const AC=window.AudioContext||window.webkitAudioContext; audioCtx=new AC(); }
  try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){}
  if(!stilEl){ stilEl=new Audio(STIL_WAV); stilEl.loop=true; stilEl.setAttribute('playsinline',''); }
  stilEl.play().catch(()=>{});
  if(audioCtx.state!=='running') audioCtx.resume().catch(()=>{});
}
function speelToon(freq){
  try{
    ensureAudio();
    const now=audioCtx.currentTime;
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type='sine'; o.frequency.value=freq||440;
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(0.3, now+0.02);
    g.gain.setTargetAtTime(0.0001, now+0.9, 0.05);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(now); o.stop(now+1.2);
    o.onended=()=>{ try{ o.disconnect(); g.disconnect(); }catch(e){} };
  }catch(e){ toast('Geluid spelen lukte niet, test met de hand','fout'); }
}
/* iOS zet de context op 'interrupted' na een tabwissel of telefoontje; bij
   terugkomst weer aanzwengelen. */
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && audioCtx && audioCtx.state!=='running') audioCtx.resume().catch(()=>{}); });
function startLuidspreker(){
  document.getElementById('testvak').innerHTML='<button class="btn actie" onclick="speelToon(880)">Speel de toon</button>'+
    '<p class="muted klein" style="margin-top:10px">Zet het volume omhoog. Op een iPhone: zet het knopje aan de zijkant op geluid (niet stil). Hoor je hem helder, zonder kraken?</p>';
  opruimer=()=>{ try{ stilEl&&stilEl.pause(); }catch(e){} };
}
/* ---- oorspeaker: browser kan hem niet aansturen, dus een geleid oordeel ---- */
/* Oorspeaker in de app testen: op iOS stuurt een actieve microfoon-sessie de
   weergave naar de oorspeaker (bovenaan), precies zoals bij bellen. We openen dus
   kort de microfoon en spelen de toon; houd het toestel aan je oor. De microfoon
   is meestal al toegestaan (die stap komt hiervoor), dus geen extra vraag. */
let oorStream=null;
function startOorspeaker(){
  document.getElementById('testvak').innerHTML=
    '<button class="btn actie" onclick="speelOorspeaker()">Speel de toon</button>'+
    '<p class="muted klein" style="margin-top:10px">Houd het toestel aan je oor, zoals bij bellen, en druk op de knop. Hoor je de toon via de speaker <b>bovenaan</b>?</p>';
  opruimer=()=>{ if(oorStream){ try{ oorStream.getTracks().forEach(t=>t.stop()); }catch(e){} oorStream=null; } };
}
function speelOorspeaker(){
  ensureAudio();
  const speelEnStop=()=>{ speelToon(660); setTimeout(()=>{ if(oorStream){ try{ oorStream.getTracks().forEach(t=>t.stop()); }catch(e){} oorStream=null; } }, 1700); };
  if(oorStream){ speelEnStop(); return; }
  navigator.mediaDevices.getUserMedia({audio:true}).then(s=>{ oorStream=s; speelEnStop(); }).catch(()=>{ speelToon(660); });
}

/* ---- microfoon: live meter ---- */
function startMicrofoon(){
  const mijnStap=stapId;
  const vak=document.getElementById('testvak');
  vak.innerHTML='<div class="meter"><i id="micbalk"></i></div><p class="muted klein" style="margin-top:10px">Praat of tik op de microfoon onderaan.</p>';
  navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
    if(mijnStap!==stapId){ stream.getTracks().forEach(t=>t.stop()); return; }
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const bron=ctx.createMediaStreamSource(stream); const an=ctx.createAnalyser(); an.fftSize=512;
    bron.connect(an); const buf=new Uint8Array(an.fftSize); let loopt=true;
    (function meet(){ if(!loopt) return;
      an.getByteTimeDomainData(buf);
      let piek=0; for(let i=0;i<buf.length;i++){ const v=Math.abs(buf[i]-128); if(v>piek) piek=v; }
      const el=document.getElementById('micbalk'); if(el) el.style.width=Math.min(100, piek/1.1)+'%';
      requestAnimationFrame(meet);
    })();
    opruimer=()=>{ loopt=false; stream.getTracks().forEach(t=>t.stop()); try{ctx.close();}catch(e){} };
  }).catch(()=>{ vak.innerHTML='<p class="muted klein">Geen toegang tot de microfoon. Test met de hand.</p>'; });
}

/* Camera achter: de fysieke lenzen betrouwbaar tonen.
   Onderzoek (aug 2026): op labelnaam kiezen kan niet 100% (iOS vertaalt de labels
   en wisselt ze per versie, Android-labels zijn betekenisloos). Daarom verankeren
   we de 1x op de deviceId die de environment-stream echt opende (getSettings), en
   voegen alleen een DISTINCTE 0.5x en tele toe. Zo kan er nooit een virtuele
   combi-camera of een vierde lens tussen sluipen. Toestemming MOET vóór het
   enumereren, anders zijn de labels leeg. Android zonder losse lenzen: via zoom. */
const LENS_KW={
  ultra:[/ultra.?wide/i,/ultra.?groothoek/i,/ultra.?weit/i,/ultra.?grand.?angle/i,/ultra.?gran.?angular/i],
  tele:[/tele/i,/t[ée]l[ée]ob/i],
  virtueel:[/\bdual\b/i,/\btriple\b/i,/dual.?wide/i,/dreifach/i,/drievoud/i,/dubbel/i,/doble/i,/desk.?view/i],
  voor:[/front/i,/voor/i,/avant/i,/frontal/i,/anteriore/i,/truedepth/i],
  achter:[/back/i,/rear/i,/achter/i,/r[üu]ck/i,/arri[eè]re/i,/trasera/i,/posteriore/i]
};
const lensHit=(s,arr)=>arr.some(re=>re.test(s||''));
let camState=null; /* {stream, track, lenzen:[{key,naam,kind,deviceId?,waarde?}], actief} */
function camStop(){ if(camState&&camState.stream){ try{ camState.stream.getTracks().forEach(t=>t.stop()); }catch(e){} } camState=null; }

async function startCameraAchter(){
  const mijnStap=stapId;
  const vak=document.getElementById('testvak');
  vak.innerHTML='<video id="camerabeeld" autoplay playsinline muted></video>'+
    '<div id="lensrij" style="display:flex; gap:8px; justify-content:center; margin-top:12px; flex-wrap:wrap"></div>';
  opruimer=()=>{ camStop(); };
  try{
    /* Toestemming eerst (anders lege labels), en dit is meteen de echte 1x-stream. */
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}, audio:false});
    if(mijnStap!==stapId){ stream.getTracks().forEach(t=>t.stop()); return; }
    const track=stream.getVideoTracks()[0];
    const ankerId=(track.getSettings&&track.getSettings().deviceId)||null;
    const v=document.getElementById('camerabeeld'); if(v) v.srcObject=stream;
    const devs=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');
    const lenzen=lensBouw(devs, ankerId, track);
    camState={stream, track, lenzen, actief:Math.max(0, lenzen.findIndex(l=>l.key==='1x'))};
    tekenLensrij();
  }catch(e){ vak.innerHTML='<p class="muted klein">Geen toegang tot de camera. Test met de hand.</p>'; }
}

/* De lens die environment opende is de gegarandeerde 1x (verankerd op deviceId,
   niet op labelnaam). Daar zoeken we een distincte ultragroothoek en tele bij.
   De virtuele combi-camera's (Dual/Triple) worden nooit als knop getoond. */
function lensBouw(devs, ankerId, track){
  const achter=devs.filter(d=> d.deviceId===ankerId
    || (lensHit(d.label,LENS_KW.achter) && !lensHit(d.label,LENS_KW.voor))
    || (!d.label && !lensHit(d.label,LENS_KW.voor)));
  const bak={ultra:[],tele:[],virt:[],wide:[]};
  achter.forEach(d=>{
    const l=d.label||'';
    if(lensHit(l,LENS_KW.ultra)) bak.ultra.push(d);
    else if(lensHit(l,LENS_KW.virtueel)) bak.virt.push(d);
    else if(lensHit(l,LENS_KW.tele)) bak.tele.push(d);
    else bak.wide.push(d);
  });
  const lenzen=[];
  const eenX = bak.wide.find(d=>d.deviceId===ankerId) || bak.wide[0] || bak.virt.find(d=>d.deviceId===ankerId) || null;
  if(eenX) lenzen.push({key:'1x', naam:'1x', kind:'device', deviceId:eenX.deviceId});
  const ultra=bak.ultra.find(d=>!eenX||d.deviceId!==eenX.deviceId);
  if(ultra) lenzen.unshift({key:'0.5x', naam:'0.5x', kind:'device', deviceId:ultra.deviceId});
  const tele=bak.tele.find(d=>!eenX||d.deviceId!==eenX.deviceId);
  if(tele) lenzen.push({key:'2x', naam:'Tele', kind:'device', deviceId:tele.deviceId});
  /* Te weinig losse lenzen (typisch Android met één logische camera): probeer de
     zoom-route op dezelfde stream. Bestaat alleen op Chromium/Android. */
  if(lenzen.length<2){
    const zl=lensZoom(track);
    if(zl.length>lenzen.length) return zl;
  }
  if(!lenzen.length && ankerId) lenzen.push({key:'1x', naam:'1x', kind:'device', deviceId:ankerId});
  return lenzen;
}

function lensZoom(track){
  const supa=(navigator.mediaDevices.getSupportedConstraints&&navigator.mediaDevices.getSupportedConstraints())||{};
  if(!supa.zoom || typeof track.getCapabilities!=='function') return [];
  const caps=track.getCapabilities(); if(!caps||!caps.zoom||typeof caps.zoom.max!=='number') return [];
  const min=(typeof caps.zoom.min==='number')?caps.zoom.min:1, max=caps.zoom.max;
  const out=[];
  if(min<1) out.push({key:'0.5x', naam:'0.5x', kind:'zoom', waarde:Math.max(min,0.5)});
  out.push({key:'1x', naam:'1x', kind:'zoom', waarde:1});
  if(max>=2) out.push({key:'2x', naam:'Tele', kind:'zoom', waarde:2});
  return out;
}

function tekenLensrij(){
  const rij=document.getElementById('lensrij'); if(!rij||!camState) return;
  const L=camState.lenzen;
  if(L.length<=1){ rij.innerHTML='<span class="muted klein">Dit toestel toont maar één achterlens.</span>'; return; }
  rij.innerHTML=L.map((l,i)=>'<button class="btn ghost" style="width:auto; flex:none; min-width:66px; padding:12px 18px" onclick="lensKies('+i+')">'+esc(l.naam)+'</button>').join('');
  /* de actieve lens oplichten via classList, niet in de class-string (dat leest
     de huisstijl-controle als een onbekende klasse) */
  const kn=rij.querySelectorAll('button');
  if(kn[camState.actief]){ kn[camState.actief].classList.remove('ghost'); kn[camState.actief].classList.add('actie'); }
}

async function lensKies(i){
  if(!camState || i===camState.actief) return;
  const mijnStap=stapId;
  const lens=camState.lenzen[i];
  camState.actief=i; tekenLensrij();
  const v=document.getElementById('camerabeeld');
  if(lens.kind==='zoom'){
    try{ await camState.track.applyConstraints({advanced:[{zoom:lens.waarde}]}); }catch(e){}
    return;
  }
  /* Losse lens: oude stream stoppen en exact deze deviceId openen. Op iOS géén
     facingMode meegeven naast exact deviceId, anders kan de combi-camera terugkomen. */
  try{ camState.stream.getTracks().forEach(t=>t.stop()); }catch(e){}
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{deviceId:{exact:lens.deviceId}}, audio:false});
    if(mijnStap!==stapId){ stream.getTracks().forEach(t=>t.stop()); return; }
    camState.stream=stream; camState.track=stream.getVideoTracks()[0];
    if(v) v.srcObject=stream;
  }catch(e){ toast('Deze lens openen lukte niet','fout'); }
}

/* ---- trilfunctie ---- */
/* Android heeft een echte trilmotor: navigator.vibrate werkt daar programmatisch.
   Een iPhone niet. iOS heeft de Vibration API nooit gehad, en sinds iOS 26.5 heeft
   Apple ook de programmatische haptiek-trucs dichtgezet. Het enige dat op de
   nieuwste iPhone nog trilt is een ECHTE vingertik op een native schakelaar (de
   Taptic Engine, en dat IS de trilmotor). Daarom op de iPhone geen knop-die-zelf-
   trilt maar een schakelaar die de winkelier zelf aantikt. */
function trilAndroid(){ try{ navigator.vibrate(0); navigator.vibrate([70,45,70,45,140]); }catch(e){} }
function startTril(){
  const vak=document.getElementById('testvak');
  if(navigator.vibrate){
    vak.innerHTML=
      '<button class="btn actie" onclick="trilAndroid()">Laat trillen</button>'+
      '<p class="muted klein" style="margin-top:12px">Druk op de knop. Voel je het toestel trillen?</p>';
  } else {
    /* De native switch NIET met appearance:none stylen, dat doodt de haptiek. We
       vergroten hem alleen met transform, zodat hij goed aan te tikken is. */
    vak.innerHTML=
      '<div style="display:flex; align-items:center; justify-content:center; gap:22px; padding:14px 0">'+
        '<input type="checkbox" switch aria-label="Trilschakelaar" style="transform:scale(2.4); transform-origin:center">'+
        '<span style="font-weight:600; font-size:17px">Tik een paar keer</span>'+
      '</div>'+
      '<p class="muted klein" style="margin-top:16px">Tik een paar keer op de schakelaar. Voel je bij elke tik een korte trilling? Dan werkt de trilmotor.</p>'+
      '<p class="muted klein" style="margin-top:6px">Voel je niks? Zet dan de systeemhaptiek aan bij Instellingen, Geluiden en haptiek. Op een ouder toestel bel je jezelf om te voelen of hij trilt.</p>';
  }
  opruimer=()=>{};
}

/* ---- sensoren: vloeiende kantelstip ---- */
function startSensoren(){
  volOpen('<div class="tilt"><div class="tiltkruis"></div><div class="tiltstip" id="tiltstip"></div></div>', 'Kantel het toestel');
  let doelX=0, doelY=0, x=0, y=0, loopt=true;
  const onOri=e=>{
    doelX=Math.max(-40,Math.min(40, e.gamma||0));
    doelY=Math.max(-40,Math.min(40, e.beta||0));
  };
  const teken=()=>{
    if(!loopt) return;
    /* een laagdoorlaatfilter smoothet de sprongen van de sensor weg */
    x+=(doelX-x)*0.12; y+=(doelY-y)*0.12;
    const el=document.getElementById('tiltstip');
    if(el) el.style.transform='translate('+(x*3).toFixed(1)+'px,'+(y*3).toFixed(1)+'px)';
    requestAnimationFrame(teken);
  };
  const aanhaken=()=>{ window.addEventListener('deviceorientation', onOri); teken(); };
  if(typeof DeviceOrientationEvent!=='undefined' && typeof DeviceOrientationEvent.requestPermission==='function'){
    document.getElementById('volInhoud').insertAdjacentHTML('beforeend','<button class="btn" id="sensorknop" style="position:fixed; left:16px; right:16px; top:50%; width:auto; z-index:3">Sensoren aanzetten</button>');
    document.getElementById('sensorknop').onclick=()=>{
      DeviceOrientationEvent.requestPermission().then(s=>{ const b=document.getElementById('sensorknop'); if(b) b.remove(); if(s==='granted') aanhaken(); else toast('Geen toegang tot de sensoren','fout'); }).catch(()=>{});
    };
  } else { aanhaken(); }
  opruimer=()=>{ loopt=false; window.removeEventListener('deviceorientation', onOri); };
}

/* ---- camera + microfoon op EEN stap ----
   Samen op een pagina, zodat de browser maar EEN keer om toegang vraagt (video en
   audio in dezelfde getUserMedia). Je ziet jezelf in beeld en de balk beweegt bij
   geluid; je beoordeelt de webcam en de microfoon apart. Vult resultaat.camera en
   resultaat.microfoon, die allebei naar de controle teruglopen. */
let avStream=null;
const avStatus={};
function avZet(k, w){
  avStatus[k]=w;
  document.querySelectorAll(`.poortknop[data-p="${k}"]`).forEach(b=>b.classList.toggle('aan', b.dataset.w===avStatus[k]));
}
function avDoor(){
  resultaat['camera']    = avStatus['cam']==='ok' ? 'ok' : avStatus['cam']==='fout' ? 'fout' : 'over';
  resultaat['microfoon'] = avStatus['mic']==='ok' ? 'ok' : avStatus['mic']==='fout' ? 'fout' : 'over';
  nu++; tekenTest();
}
function startAV(){
  delete avStatus['cam']; delete avStatus['mic'];
  const vak=document.getElementById('testvak');
  vak.innerHTML=
    '<video id="avbeeld" autoplay playsinline muted></video>'+
    '<div class="meter" style="margin-top:10px"><i id="avmic"></i></div>'+
    '<div class="avrij"><b>Webcam</b><div class="poortknoppen">'+
      '<button class="poortknop" data-p="cam" data-w="ok" onclick="avZet(\'cam\',\'ok\')">Werkt</button>'+
      '<button class="poortknop" data-p="cam" data-w="fout" onclick="avZet(\'cam\',\'fout\')">Niet goed</button>'+
    '</div></div>'+
    '<div class="avrij"><b>Microfoon</b><div class="poortknoppen">'+
      '<button class="poortknop" data-p="mic" data-w="ok" onclick="avZet(\'mic\',\'ok\')">Werkt</button>'+
      '<button class="poortknop" data-p="mic" data-w="fout" onclick="avZet(\'mic\',\'fout\')">Niet goed</button>'+
    '</div></div>'+
    '<button class="btn actie" style="margin-top:12px" onclick="avDoor()">Doorgaan</button>';
  const mijnStap=stapId;
  navigator.mediaDevices.getUserMedia({audio:true, video:true}).then(stream=>{
    if(mijnStap!==stapId){ stream.getTracks().forEach(t=>t.stop()); return; }
    avStream=stream;
    const v=document.getElementById('avbeeld'); if(v) v.srcObject=stream;
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const bron=ctx.createMediaStreamSource(stream); const an=ctx.createAnalyser(); an.fftSize=512;
    bron.connect(an); const buf=new Uint8Array(an.fftSize); let loopt=true;
    (function meet(){ if(!loopt || mijnStap!==stapId) return;
      an.getByteTimeDomainData(buf); let piek=0;
      for(let i=0;i<buf.length;i++){ const d=Math.abs(buf[i]-128); if(d>piek) piek=d; }
      const el=document.getElementById('avmic'); if(el) el.style.width=Math.min(100, piek/1.1)+'%';
      requestAnimationFrame(meet);
    })();
    opruimer=()=>{ loopt=false; try{ stream.getTracks().forEach(t=>t.stop()); }catch(e){} try{ctx.close();}catch(e){} avStream=null; };
  }).catch(()=>{
    vak.insertAdjacentHTML('afterbegin','<p class="muted klein" style="margin-bottom:10px">Geen toegang tot camera of microfoon. Sta het toe en probeer opnieuw, of beoordeel met de hand.</p>');
  });
}

/* ---- aansluitingen / poorten ----
   Een browser ziet niet welke fysieke poort werkt, dus dit is deels met de hand. Wat
   de browser WEL vanzelf ziet, kleuren we automatisch: de lader (de accu gaat laden)
   en een extern scherm (er komt een tweede beeldscherm bij). Voor de USB- en HDMI-
   poorten steek je je teststick in en tik je Werkt of Niet goed. Met het uitlees-
   commando kun je zeker weten dat een USB-poort echt data doorgeeft. */
const POORTEN=[
  {id:'voeding',  naam:'Voeding (lader / USB-C)'},
  {id:'beeld',    naam:'Beeld uit (HDMI / USB-C)'},
  {id:'usba',     naam:'USB-A poorten'},
  {id:'usbc',     naam:'USB-C (data)'},
  {id:'audio',    naam:'Koptelefoon / audio'},
  {id:'sd',       naam:'SD-kaart'},
  {id:'ethernet', naam:'Netwerk (ethernet)'}
];
const poortStatus={};
let poortBat=null, poortBatFn=null, poortScherm=null, poortOs='win';
function poortRij(p){
  return `<div class="poortrij">`+
    `<div class="poortnaam">${p.naam}<span class="poortauto" id="pa_${p.id}" hidden>vanzelf</span></div>`+
    `<div class="poortknoppen">`+
      `<button class="poortknop" data-p="${p.id}" data-w="ok" onclick="poortZet('${p.id}','ok')">Werkt</button>`+
      `<button class="poortknop" data-p="${p.id}" data-w="fout" onclick="poortZet('${p.id}','fout')">Niet goed</button>`+
      `<button class="poortknop" data-p="${p.id}" data-w="nvt" onclick="poortZet('${p.id}','nvt')">n.v.t.</button>`+
    `</div></div>`;
}
function poortVerf(id){
  document.querySelectorAll(`.poortknop[data-p="${id}"]`).forEach(b=>b.classList.toggle('aan', b.dataset.w===poortStatus[id]));
}
function poortZet(id, w){ poortStatus[id]=w; poortVerf(id); }
function poortAuto(id){
  if(poortStatus[id]==='fout') return;   // een met de hand gezet defect niet overschrijven
  poortStatus[id]='ok'; poortVerf(id);
  const b=document.getElementById('pa_'+id); if(b) b.hidden=false;
}
function poortCmd(os){
  if(os==='win') return `Get-PnpDevice -PresentOnly -Class USB | Where-Object { $_.Status -eq 'OK' } | Select-Object -ExpandProperty FriendlyName`;
  if(os==='mac') return `system_profiler SPUSBDataType`;
  return `lsusb`;
}
function poortKiesOs(os){
  poortOs=os;
  document.querySelectorAll('.ostab').forEach(b=>b.classList.toggle('aan', b.dataset.os===os));
  const el=document.getElementById('poortcmd'); if(el) el.textContent=poortCmd(os);
}
async function poortKopieer(knop){
  try{ await navigator.clipboard.writeText(poortCmd(poortOs)); knop.textContent='Gekopieerd, nu plakken en Enter'; }
  catch(e){ knop.textContent='Selecteer het commando en kopieer (Ctrl+C)'; }
  setTimeout(()=>{ knop.textContent='Kopieer het commando'; }, 3000);
}
function startPoorten(){
  Object.keys(poortStatus).forEach(k=>delete poortStatus[k]);
  const os0 = /Mac/i.test(navigator.userAgent) ? 'mac'
    : (/Linux|X11/i.test(navigator.userAgent) && !/Android/i.test(navigator.userAgent) ? 'linux' : 'win');
  const vak=document.getElementById('testvak');
  vak.innerHTML=
    '<div class="poortlijst">'+POORTEN.map(poortRij).join('')+'</div>'+
    '<details class="poortlees"><summary>Zeker weten dat een USB-poort data doorgeeft?</summary>'+
      '<p class="muted klein" style="margin:10px 0">Steek je teststick in een poort en plak dit in PowerShell of Terminal. Je ziet hem in de lijst. Herhaal per poort.</p>'+
      '<div class="ostabs">'+
        '<button class="ostab" data-os="win" onclick="poortKiesOs(\'win\')">Windows</button>'+
        '<button class="ostab" data-os="mac" onclick="poortKiesOs(\'mac\')">Mac</button>'+
        '<button class="ostab" data-os="linux" onclick="poortKiesOs(\'linux\')">Linux</button>'+
      '</div>'+
      '<pre class="cmdbox" id="poortcmd"></pre>'+
      '<button class="btn actie" onclick="poortKopieer(this)">Kopieer het commando</button>'+
    '</details>'+
    '<button class="btn actie" style="margin-top:14px" onclick="poortDoor()">Doorgaan</button>';
  poortKiesOs(os0);
  /* Auto: de lader (accu gaat laden) en een extern scherm. */
  try{
    if(navigator.getBattery){
      navigator.getBattery().then(bat=>{
        poortBat=bat;
        poortBatFn=()=>{ if(bat.charging) poortAuto('voeding'); };
        poortBatFn();
        bat.addEventListener('chargingchange', poortBatFn);
      }).catch(()=>{});
    }
  }catch(e){}
  const mijnStap=stapId;
  poortScherm=setInterval(()=>{
    if(mijnStap!==stapId) return;
    try{ if(window.screen && screen.isExtended) poortAuto('beeld'); }catch(e){}
  }, 2000);
  opruimer=()=>{
    if(poortScherm){ clearInterval(poortScherm); poortScherm=null; }
    if(poortBat && poortBatFn){ try{ poortBat.removeEventListener('chargingchange', poortBatFn); }catch(e){} }
    poortBat=null; poortBatFn=null;
  };
}
function poortDoor(){
  const eenFout = POORTEN.some(p=>poortStatus[p.id]==='fout');
  const eenOk = POORTEN.some(p=>poortStatus[p.id]==='ok');
  resultaat['poorten'] = eenFout ? 'fout' : (eenOk ? 'ok' : 'over');
  const lad = poortStatus['voeding'];
  if(lad==='ok'||lad==='fout') resultaat['lader']=lad;
  nu++; tekenTest();
}

/* ---- accu-conditie ----
   Telefoon/tablet: lees de maximale capaciteit af en vul hem in (een browser kan de
   accugezondheid niet lezen). LAPTOP op Windows: één knop downloadt een bestandje dat
   je dubbelklikt; dat leest de accugezondheid uit het ingebouwde accurapport (powercfg)
   en stuurt het percentage naar dezelfde code, dat hier vanzelf verschijnt. Geen
   terminal, geen plakken. Op de Mac lees je het gewoon af in de instellingen. */
let accuPoll=null;
function ps64(script){
  /* PowerShell -EncodedCommand wil UTF-16LE base64. Zo hoeven we in het .bat-bestand
     niets te escapen en draait het als EEN script (de if/else klopt dan ook). */
  let bin='';
  for(let i=0;i<script.length;i++){ const c=script.charCodeAt(i); bin+=String.fromCharCode(c & 0xff, (c>>8) & 0xff); }
  return btoa(bin);
}
function accuBatWindows(){
  const F=SUPABASE_URL+'/functions/v1/refurbish-test', K=SUPABASE_ANON_KEY, C=code;
  /* String.raw zodat de backslashes (paden, regex) letterlijk blijven; alleen
     ${F}/${K}/${C} worden ingevuld. Het script leest de accugezondheid (uit het
     accurapport, want de WMI-accuklassen zijn vaak leeg) EN de systeemgegevens
     (merk, model, serienummer, processor, geheugen, opslag, videokaart, scherm) en
     stuurt alles in één bericht. Alles in een try, zodat een misser een veld leeg
     laat maar de rest gewoon doorgaat. */
  const ps = String.raw`$ErrorActionPreference='SilentlyContinue'
$accu=$null
try{
  $rep="$env:TEMP\storvo-accu.xml"
  powercfg /batteryreport /output $rep /xml | Out-Null
  $raw = Get-Content $rep -Raw
  $md = [regex]::Match($raw,'<DesignCapacity>(\d+)</DesignCapacity>')
  $mf = [regex]::Match($raw,'<FullChargeCapacity>(\d+)</FullChargeCapacity>')
  if($md.Success -and $mf.Success -and [double]$md.Groups[1].Value -gt 0){ $accu=[int][math]::Round(([double]$mf.Groups[1].Value/[double]$md.Groups[1].Value)*100) }
}catch{}
$g=$null
try{
  $cs = Get-CimInstance Win32_ComputerSystem
  $merk = ($cs.Manufacturer -replace 'Inc\.?','' -replace 'Corporation','' -replace 'Co\.,? Ltd\.?','' -replace 'Computer','').Trim()
  if($merk -match '^LENOVO$'){ $merk='Lenovo' }
  $model = (Get-CimInstance Win32_ComputerSystemProduct).Version
  if(-not $model -or $model -match 'To be filled|System Product|Default string|O\.E\.M'){ $model = $cs.Model }
  $model = "$model".Trim()
  if($merk -and $model.ToLower().StartsWith(($merk.ToLower()+' '))){ $model = $model.Substring($merk.Length).Trim() }
  $serie = (Get-CimInstance Win32_BIOS).SerialNumber
  $mpn = "$($cs.SystemSKUNumber)"
  if($mpn){ $mpn = ($mpn -split '#')[0].Trim() }
  if($mpn -match 'To be filled|Default string|System SKU'){ $mpn='' }
  $cpu = (Get-CimInstance Win32_Processor | Select-Object -First 1).Name
  if($cpu){ $cpu = ($cpu -replace '\(R\)','' -replace '\(TM\)','' -replace ' CPU','' -replace '@.*$','').Trim() }
  $ram = [int][math]::Round($cs.TotalPhysicalMemory/1GB)
  $totGB=0; $ssd=$false
  try{ foreach($d in (Get-PhysicalDisk)){ $totGB += [int][math]::Round($d.Size/1GB); if($d.MediaType -eq 'SSD' -or $d.BusType -eq 'NVMe'){ $ssd=$true } } }catch{}
  if($totGB -eq 0){ try{ foreach($d in (Get-CimInstance Win32_DiskDrive)){ $totGB += [int][math]::Round($d.Size/1GB) } }catch{} }
  $opslag=''
  if($totGB -gt 0){ $opslag = "$totGB GB"; if($ssd){ $opslag = "$opslag SSD" } }
  $gpu = Get-CimInstance Win32_VideoController | Where-Object { $_.Name -and $_.Name -notmatch 'Microsoft Basic|Remote|Parsec' } | Select-Object -Last 1 -ExpandProperty Name
  $inch=''
  try{ $mon = Get-CimInstance -Namespace root/wmi -ClassName WmiMonitorBasicDisplayParams | Select-Object -First 1
       if($mon.MaxHorizontalImageSize -gt 0){ $inch=[math]::Round([math]::Sqrt([math]::Pow($mon.MaxHorizontalImageSize,2)+[math]::Pow($mon.MaxVerticalImageSize,2))/2.54,1) } }catch{}
  $scherm=''
  $res = Get-CimInstance Win32_VideoController | Where-Object { $_.CurrentHorizontalResolution } | Select-Object -First 1
  if($res){ $h=[int]$res.CurrentVerticalResolution
    if($h -ge 2000){$lab='4K'} elseif($h -ge 1400){$lab='QHD'} elseif($h -ge 1080){$lab='Full HD'} elseif($h -ge 700){$lab='HD'} else {$lab="$($res.CurrentHorizontalResolution)x$h"}
    if($inch){ $scherm="$inch inch $lab" } else { $scherm=$lab }
  } elseif($inch){ $scherm="$inch inch" }
  $g = @{ merk=$merk; model=$model; serienummer=$serie; mpn=$mpn; specs=@{ Processor=$cpu; Geheugen="$ram GB"; Opslag=$opslag; Videokaart=$gpu; Scherm=$scherm } }
}catch{}
$body=@{ code='${C}' }
if($accu -ne $null){ $body.resultaat=@{ accu=$accu } }
if($g){ $body.gegevens=$g }
try{
  Invoke-RestMethod -Method Post -Uri '${F}' -Headers @{ apikey='${K}' } -ContentType 'application/json' -Body ($body | ConvertTo-Json -Depth 6) | Out-Null
  Write-Host "  Klaar. De gegevens staan in Storvo."
  exit 0
}catch{ Write-Host "  Versturen lukte niet. Vul met de hand in Storvo."; exit 1 }`;
  /* Na een geslaagde meting (exit 0) ruimt het bestand zichzelf op: `(goto) 2>nul &
     del "%~f0"` verwijdert het draaiende .bat-bestand. Bij een fout blijft het staan
     zodat je het opnieuw kunt draaien. Zo blijft er geen bestandje met de code liggen. */
  return "@echo off\r\n"+
    "title Storvo laptop uitlezen\r\n"+
    "echo Bezig met uitlezen...\r\n"+
    "powershell -NoProfile -ExecutionPolicy Bypass -EncodedCommand "+ps64(ps)+"\r\n"+
    "if %errorlevel%==0 (\r\n"+
    "  echo Klaar. Dit venster sluit vanzelf.\r\n"+
    "  timeout /t 2 >nul\r\n"+
    "  (goto) 2>nul & del \"%~f0\"\r\n"+
    ") else (\r\n"+
    "  echo.\r\n"+
    "  pause\r\n"+
    ")\r\n";
}
/* Alles wat de laptop terugstuurde overzichtelijk tonen: niet alleen de accu, maar
   ook merk/model, serienummer en de specs. Zo zie je meteen wat er is opgehaald. */
function accuToonGegevens(g){
  const el=document.getElementById('accugeg'); if(!el) return;
  if(!g || typeof g!=='object'){ el.innerHTML=''; return; }
  const rijen=[];
  const naam=[g.merk,g.model].filter(Boolean).join(' ');
  if(naam) rijen.push(['Merk / model', naam]);
  if(g.serienummer) rijen.push(['Serienummer', g.serienummer]);
  const sp=g.specs||{};
  ['Processor','Geheugen','Opslag','Videokaart','Scherm'].forEach(k=>{ if(sp[k]) rijen.push([k, sp[k]]); });
  el.innerHTML = rijen.length
    ? '<div style="font-weight:700; margin:14px 0 4px">Opgehaald van de laptop</div>'+
      rijen.map(([l,v])=>`<div class="uitslagrij"><span class="muted">${esc(l)}</span><span style="margin-left:auto; font-weight:600; text-align:right; max-width:62%">${esc(v)}</span></div>`).join('')
    : '';
}
function accuStartPoll(){
  if(accuPoll) return;
  const mijnStap=stapId;
  accuPoll=setInterval(async()=>{
    if(mijnStap!==stapId){ clearInterval(accuPoll); accuPoll=null; return; }
    try{
      const j=await praat({actie:'status'});
      const r=j&&j.ok&&j.resultaat;
      const heeftAccu = r && typeof r.accu==='number';
      const heeftGeg = r && r.gegevens && typeof r.gegevens==='object';
      if(heeftAccu || heeftGeg){
        if(heeftAccu){ accuWaarde=String(r.accu); const inp=document.getElementById('accuveldL'); if(inp) inp.value=accuWaarde; }
        const st=document.getElementById('astatus');
        if(st){ st.className='astatus klaar'; st.hidden=false;
          st.textContent = heeftAccu
            ? ('Accu '+r.accu+'% opgehaald. Haal de uitslag op de pc op.')
            : 'Gegevens opgehaald. Haal de uitslag op de pc op.'; }
        if(heeftGeg) accuToonGegevens(r.gegevens);
        clearInterval(accuPoll); accuPoll=null;
      }
    }catch(e){}
  }, 3000);
}
function accuDownloadWin(){
  const blob=new Blob([accuBatWindows()], {type:'application/octet-stream'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='Storvo-accu-meten.bat';
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ try{ document.body.removeChild(a); }catch(e){} URL.revokeObjectURL(url); }, 1500);
  const st=document.getElementById('astatus'); if(st) st.hidden=false;
  accuStartPoll();
}
function startAccu(){
  const vak=document.getElementById('testvak');
  if(categorie==='Laptop'){
    const isMac = /Mac/i.test(navigator.userAgent) && !/iPhone|iPad/i.test(navigator.userAgent);
    const isWin = /Windows/i.test(navigator.userAgent);
    let boven;
    if(isWin){
      boven=
        '<p class="muted klein" style="margin-bottom:12px">Klik de knop. Er wordt een klein bestandje gedownload; dubbelklik het. Het leest in één keer de <b>accu én de specs</b> uit (processor, geheugen, opslag, videokaart, scherm, plus merk, model en serienummer) en zet ze in Storvo. Daarna ruimt het bestand zichzelf op.</p>'+
        '<button class="btn actie" onclick="accuDownloadWin()">Lees de accu en specs uit</button>'+
        '<div class="astatus wacht" id="astatus" hidden><span class="aspin"></span>Wachten op de laptop</div>'+
        '<div id="accugeg"></div>'+
        '<details class="poortlees" style="margin-top:12px"><summary>Blokkeert Edge het bestand?</summary>'+
          '<p class="muted klein" style="margin:10px 0 12px">Edge vindt een .bat-bestand van internet gevaarlijk. Het is veilig: het leest alleen de accu en stuurt het percentage. Zo laat je het door:</p>'+
          '<div class="astap"><div class="astapnr">1</div><div>Klik rechtsboven op het <b>download-pijltje</b>. Je ziet <b>Storvo-accu-meten.bat</b> met een waarschuwing.</div></div>'+
          '<div class="astap"><div class="astapnr">2</div><div>Ga met de muis over het bestand, klik op de <b>drie puntjes</b> en kies <b>Behouden</b>. Vraagt Edge het nog eens: <b>Toch behouden</b>.</div></div>'+
          '<div class="astap"><div class="astapnr">3</div><div><b>Dubbelklik</b> het bestand. Zegt Windows "Windows heeft je pc beschermd"? Klik <b>Meer info</b> en <b>Toch uitvoeren</b>.</div></div>'+
          '<div class="astap"><div class="astapnr">4</div><div>Een zwart venster opent kort. Het percentage komt hier vanzelf en het bestand ruimt zichzelf op.</div></div>'+
          '<p class="muted klein" style="margin:4px 0 0">Lukt het echt niet? Vul hieronder met de hand in.</p>'+
        '</details>'+
        '<p class="muted klein" style="margin:16px 0 6px">Of vul met de hand in:</p>';
    } else if(isMac){
      boven=
        '<p class="muted klein" style="margin-bottom:6px">Lees het af op de Mac: menu Apple, Systeeminstellingen, Batterij, klik op de i naast Batterijconditie. Vul de <b>maximale capaciteit</b> in.</p>'+
        '<p class="muted klein" style="margin:12px 0 6px">Percentage:</p>';
    } else {
      boven=
        '<p class="muted klein" style="margin-bottom:6px">Lees de accugezondheid af (bijvoorbeeld met een accu-app) en vul het percentage in.</p>'+
        '<p class="muted klein" style="margin:12px 0 6px">Percentage:</p>';
    }
    vak.innerHTML= boven +
      '<input id="accuveldL" type="number" min="0" max="100" inputmode="numeric" placeholder="bijvoorbeeld 87" value="'+esc(accuWaarde)+'"'+
      ' style="width:100%; padding:14px 16px; font-size:20px; font-weight:700; border:1.5px solid var(--border); border-radius:14px; text-align:center; font-family:inherit">'+
      '<button class="btn actie" style="margin-top:10px" onclick="accuDoor()">Doorgaan</button>';
    const el=document.getElementById('accuveldL'); if(el){ el.oninput=()=>{ accuWaarde=el.value; }; }
    opruimer=()=>{ if(accuPoll){ clearInterval(accuPoll); accuPoll=null; } };
    return;
  }
  vak.innerHTML=
    '<input id="accuveld" type="number" min="0" max="100" inputmode="numeric" placeholder="bijvoorbeeld 87" value="'+esc(accuWaarde)+'"'+
    ' style="width:100%; padding:16px 18px; font-size:22px; font-weight:700; border:1.5px solid var(--border); border-radius:16px; text-align:center; font-family:inherit">'+
    '<p class="muted klein" style="margin:10px 0">iPhone: Instellingen ▸ Batterij ▸ Batterijconditie ▸ Maximale capaciteit. Android: Instellingen ▸ Batterij, of een accu-app.</p>'+
    '<button class="btn actie" onclick="accuDoor()">Doorgaan</button>';
  const el=document.getElementById('accuveld');
  if(el){ el.oninput=()=>{ accuWaarde=el.value; }; el.focus(); }

function accuDoor(){
  const el=document.getElementById('accuveld')||document.getElementById('accuveldL'); if(el) accuWaarde=el.value;
  if(accuPoll){ clearInterval(accuPoll); accuPoll=null; }
  resultaat['accu']= accuWaarde!=='' ? Math.max(0,Math.min(100,Math.round(Number(accuWaarde)))) : 'over';
  nu++; tekenTest();
}

/* Het invoerscherm tonen in plaats van dood te lopen. Op een laptop scan je de QR
   niet makkelijk, dus daar typ je de code over; hier komt hij binnen. */
function vraagCode(kop, uit){
  volSluit();
  document.getElementById('werk').hidden=true;
  document.getElementById('fout').hidden=true;
  document.getElementById('klaarKaart').hidden=true;
  document.getElementById('watIsHet').textContent='';
  document.getElementById('codeKop').textContent=kop||'Vul de code in';
  document.getElementById('codeUit').textContent=uit||'Typ de code van de computer over.';
  document.getElementById('codeInvoer').hidden=false;
  const veld=document.getElementById('codeVeld');
  veld.value=code||'';
  veld.oninput=()=>{ veld.value=veld.value.toUpperCase(); };
  veld.onkeydown=(e)=>{ if(e.key==='Enter'){ e.preventDefault(); codeDoor(); } };
  setTimeout(()=>{ try{ veld.focus(); }catch(_e){} }, 50);
}
function codeDoor(){
  const veld=document.getElementById('codeVeld');
  const inv=String(veld.value||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(inv.length<3){ toast('Vul eerst de code in','fout'); veld.focus(); return; }
  code=inv;
  /* De code ook in het adres zetten, zodat verversen hem onthoudt. */
  try{ history.replaceState(null,'','?c='+encodeURIComponent(code)); }catch(_e){}
  document.getElementById('codeInvoer').hidden=true;
  document.getElementById('watIsHet').textContent='Bezig met openen…';
  start();
}

async function start(){
  if(!code){ vraagCode('Vul de code in','Typ de code van de computer over.'); return; }
  try{
    const uit=await praat({actie:'kijken'});
    const a=uit.apparaat;
    const cat=a.categorie||'Telefoon';
    categorie=cat;
    TESTS=ALLE_TESTS.filter(t=>!t.soorten || t.soorten.includes(cat));
    if(!TESTS.length) TESTS=ALLE_TESTS.slice();
    /* Laptop: een prettige volgorde (toetsenbord eerst, accu als laatste), los van
       waar de tests in de lijst staan. */
    if(cat==='Laptop'){
      const orde=['toetsenbord','touchpad','scherm','luidspreker','camera','poorten','accu'];
      TESTS.sort((x,y)=>orde.indexOf(x.id)-orde.indexOf(y.id));
    }
    document.getElementById('watIsHet').innerHTML=
      `<b>${esc([a.merk,a.model].filter(Boolean).join(' '))}</b>${a.code?' · '+esc(a.code):''} · loop de tests langs`;
    document.getElementById('werk').hidden=false;
    tekenTest();
  }catch(e){
    /* Verkeerde of verlopen code: opnieuw laten invullen in plaats van vastlopen. */
    const m=String(e.message||'');
    if(/bestaat niet|verlopen|niet gevonden/i.test(m)){ vraagCode('Klopt de code?', m.replace(/[.\s]*$/,'')+'. Typ hem opnieuw over.'); return; }
    stop('Dit werkt niet meer', e.message);
  }
}

start();
