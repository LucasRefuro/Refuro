<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Klantportaal</title>
<link rel="icon" href="/klantportaal/merk/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/klantportaal/merk/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/klantportaal/merk/apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* De kleuren komen uit klantportaal_instellingen van de winkel; dit zijn de
   standaardwaarden (Reloop it) tot die geladen zijn. */
:root { color-scheme: light;
  --kleur:#0F6B4B; --accent:#C6F36B; --inkt:#10231B;
  --bg:#F4F1EA; --card:#FFFFFF; --soft:#EFEBE2; --lijn:#DEDAD0; --muted:#5A6660; --muted-l:#8A938F;
  --zacht:#E3F0E8; --oranje-soft:#FFF1D6; --oranje-tekst:#8A5A00; --rood-soft:#FAE4E4; --rood-tekst:#A33333;
  --radius:20px; --radius-s:14px; --pil:999px; --schaduw:0 6px 24px rgba(16,35,27,.07);
  --display:'Bricolage Grotesque', Georgia, serif; --body:'Figtree', -apple-system, BlinkMacSystemFont, sans-serif;
  --mono:'JetBrains Mono', ui-monospace, monospace; }
[hidden] { display:none !important; }
* { box-sizing:border-box; margin:0; padding:0; }
html { overflow-x:clip; }
body { font-family:var(--body); background:var(--bg); color:var(--inkt); min-height:100vh; font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased; }
a { color:var(--kleur); }
button, input, textarea { font:inherit; color:inherit; }
:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
svg.i { width:18px; height:18px; flex-shrink:0; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.mono { font-family:var(--mono); letter-spacing:.02em; }
.muted { color:var(--muted); }
.klein { font-size:13px; }
.label { font-family:var(--mono); font-weight:500; font-size:11.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }
h1, h2, h3 { font-family:var(--display); font-weight:800; letter-spacing:-.03em; line-height:1.1; }
h1 { font-size:clamp(30px, 4vw, 44px); }
h2 { font-size:clamp(22px, 2.4vw, 28px); }
h3 { font-size:18px; letter-spacing:-.01em; }

/* ═══ knoppen en velden ═══ */
.btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:46px; padding:0 20px; border-radius:var(--pil); border:2px solid transparent; background:var(--kleur); color:#fff; font-weight:700; font-size:15px; cursor:pointer; text-decoration:none; white-space:nowrap; transition:filter .15s, background .15s; }
.btn:hover { filter:brightness(.92); }
.btn:disabled { opacity:.5; cursor:default; filter:none; }
.btn.licht { background:#fff; color:var(--inkt); border-color:var(--lijn); }
.btn.licht:hover { border-color:var(--inkt); filter:none; }
.btn.accent { background:var(--accent); color:var(--inkt); }
.btn.klein { min-height:36px; padding:0 14px; font-size:13.5px; }
.btn.breed { width:100%; }
.veld { display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
.veld label { font-weight:600; font-size:14px; }
.invoer { width:100%; min-height:48px; padding:12px 14px; border:1.5px solid var(--lijn); border-radius:var(--radius-s); background:#fff; font-size:15px; }
.invoer:focus { outline:none; border-color:var(--kleur); box-shadow:0 0 0 4px rgba(15,107,75,.12); }
textarea.invoer { min-height:110px; resize:vertical; }
.keuzes { display:flex; gap:8px; flex-wrap:wrap; }
.keuze { display:inline-flex; align-items:center; gap:8px; min-height:44px; padding:0 16px; border:1.5px solid var(--lijn); border-radius:var(--pil); background:#fff; cursor:pointer; font-weight:600; font-size:14px; }
.keuze.aan { border-color:var(--kleur); background:var(--zacht); color:var(--kleur); }
.melding { border-radius:var(--radius-s); padding:14px 16px; font-size:14.5px; margin-bottom:16px; background:var(--zacht); color:var(--kleur); }
.melding.fout { background:var(--rood-soft); color:var(--rood-tekst); }

/* ═══ inloggen ═══ */
#inlog { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px; background:var(--kleur); position:relative; overflow:hidden; }
.inlogboog { position:absolute; width:min(70vw, 620px); right:-14%; top:-24%; pointer-events:none; }
.inlogkaart { position:relative; background:#fff; border-radius:28px; padding:36px 32px 30px; width:420px; max-width:100%; box-shadow:0 30px 80px rgba(0,0,0,.25); }
.inlogkaart h1 { font-size:30px; margin:18px 0 6px; }
.inlogkaart p { color:var(--muted); margin-bottom:22px; }
.merk { display:flex; align-items:center; gap:10px; font-family:var(--display); font-weight:800; font-size:22px; letter-spacing:-.03em; color:var(--inkt); text-decoration:none; }
.merk img { height:30px; width:auto; display:block; }
.inlogvoet { margin-top:18px; font-size:13px; color:var(--muted-l); }
.inloglinks { display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-top:14px; }
.linkknop { background:none; border:none; padding:0; font:inherit; font-size:14px; font-weight:600; color:var(--kleur); cursor:pointer; text-decoration:underline; text-underline-offset:3px; }
.linkknop:hover { color:var(--inkt); }

/* ═══ de app ═══ */
#app { min-height:100vh; display:flex; flex-direction:column; }
.balk { position:sticky; top:0; z-index:10; background:rgba(244,241,234,.9); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-bottom:1px solid var(--lijn); }
.balk-in { max-width:1320px; margin:0 auto; padding:14px clamp(16px, 4vw, 40px); display:flex; align-items:center; gap:20px; }
.tabs { display:flex; gap:4px; margin-left:12px; overflow-x:auto; }
.tab { display:inline-flex; align-items:center; gap:8px; min-height:40px; padding:0 14px; border-radius:var(--pil); background:none; border:0; color:var(--muted); font-weight:600; cursor:pointer; white-space:nowrap; }
.tab:hover { background:var(--soft); color:var(--inkt); }
.tab.aan { background:var(--zacht); color:var(--kleur); }
.wie { margin-left:auto; display:flex; align-items:center; gap:10px; }
.wie-naam { text-align:right; font-size:13px; line-height:1.3; }
.wie-naam b { display:block; font-size:14px; }
.bekijkbalk { background:var(--inkt); color:var(--accent); font-family:var(--mono); font-size:12px; letter-spacing:.06em; text-transform:uppercase; text-align:center; padding:8px 16px; }
main { flex:1; width:100%; max-width:1320px; margin:0 auto; padding:28px clamp(16px, 4vw, 40px) 72px; display:flex; flex-direction:column; gap:22px; }
.kop { display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap; }
.kop .knoppen { display:flex; gap:10px; flex-wrap:wrap; }
.kaart { background:var(--card); border:1px solid var(--lijn); border-radius:var(--radius); padding:clamp(18px, 2.4vw, 26px); }

.kpis { list-style:none; display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:12px; }
.kpis li { background:var(--card); border:1px solid var(--lijn); border-radius:16px; padding:18px; }
.kpis b { display:block; font-family:var(--display); font-weight:800; font-size:30px; letter-spacing:-.03em; line-height:1.1; }
.kpis small { color:var(--muted); font-size:13px; }
.kpis li.accent { background:var(--accent); border-color:var(--accent); }
.kpis li.accent small { color:var(--inkt); }

.raster { display:grid; grid-template-columns:300px minmax(0, 1fr); gap:20px; align-items:start; }
.raster > *, .twee > * { min-width:0; }
.lijst { list-style:none; display:flex; flex-direction:column; gap:10px; }
.opdracht { width:100%; text-align:left; background:var(--card); border:1px solid var(--lijn); border-radius:16px; padding:14px 16px; display:flex; flex-direction:column; gap:4px; cursor:pointer; }
.opdracht:hover { border-color:var(--muted-l); }
.opdracht.aan { border-color:var(--kleur); box-shadow:0 0 0 1px var(--kleur); }
.opdracht-boven { display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--muted); }
.opdracht b { font-size:15.5px; }
.opdracht small { color:var(--muted); font-size:13px; }
.voortgang { height:5px; border-radius:var(--pil); background:var(--lijn); overflow:hidden; margin-top:6px; }
.voortgang span { display:block; height:100%; background:var(--kleur); border-radius:var(--pil); }
.status { display:inline-flex; align-items:center; border-radius:var(--pil); padding:4px 10px; font-size:12px; font-weight:700; white-space:nowrap; }
.status.bezig { background:var(--oranje-soft); color:var(--oranje-tekst); }
.status.klaar { background:var(--zacht); color:var(--kleur); }
.status.nieuw { background:var(--soft); color:var(--inkt); }

.detail { display:flex; flex-direction:column; gap:22px; min-width:0; }
.detail-kop { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; }
.detail-kop h2 { margin-top:4px; }
.stappen { list-style:none; display:grid; grid-template-columns:repeat(5, minmax(0, 1fr)); }
.stap { position:relative; display:flex; flex-direction:column; gap:6px; padding-right:8px; }
.stap::before { content:''; position:absolute; top:14px; left:30px; right:0; height:3px; border-radius:3px; background:var(--lijn); }
.stap:last-child::before { display:none; }
.stap.klaar::before { background:var(--kleur); }
.stip { position:relative; z-index:1; width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; background:var(--lijn); color:var(--muted); }
.stap.klaar .stip { background:var(--kleur); color:#fff; }
.stap.volgende .stip { background:var(--accent); color:var(--inkt); box-shadow:0 0 0 5px rgba(198,243,107,.35); }
.stap-naam { font-size:13.5px; font-weight:600; line-height:1.25; }
.stap.later .stap-naam { color:var(--muted); }
.stap-datum { font-size:12px; color:var(--muted); min-height:16px; }
.panelen { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:12px; }
.paneel { border:1px solid var(--lijn); border-radius:16px; padding:16px; display:flex; flex-direction:column; gap:10px; background:var(--bg); }
.paneel.accent { background:var(--accent); border-color:var(--accent); }
.groot { font-family:var(--display); font-weight:800; font-size:30px; letter-spacing:-.035em; line-height:1; }
.groot small { font-family:var(--body); font-weight:500; font-size:13px; letter-spacing:0; color:var(--muted); }
.paneel.accent .groot small { color:var(--inkt); }
.balkje { display:flex; height:12px; border-radius:var(--pil); overflow:hidden; gap:3px; background:var(--lijn); }
.balkje span { display:block; min-width:4px; }
.legenda { list-style:none; display:flex; flex-direction:column; gap:7px; font-size:14px; }
.legenda li, .regels li { display:flex; justify-content:space-between; gap:8px; }
.legenda i { width:10px; height:10px; border-radius:3px; display:inline-block; margin-right:8px; }
.regels { list-style:none; display:flex; flex-direction:column; gap:8px; font-size:14px; }
.regels li { padding-bottom:8px; border-bottom:1px dashed var(--lijn); }
.regels li:last-child { border:0; padding:0; }
.docs { list-style:none; }
.docs li { display:flex; align-items:center; gap:14px; padding:12px 0; border-top:1px solid var(--lijn); }
.docs li:first-child { border-top:0; }
.doc-ic { width:38px; height:38px; border-radius:10px; background:var(--zacht); color:var(--kleur); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.docs li.wacht .doc-ic { background:var(--soft); color:var(--muted); }
.doc-t { flex:1; min-width:0; display:flex; flex-direction:column; }
.doc-t b { font-size:14.5px; }
.doc-t small { color:var(--muted); font-size:12.5px; }
.wacht-tekst { font-size:12.5px; color:var(--muted); white-space:nowrap; }
.zoek { display:flex; align-items:center; gap:8px; border:1.5px solid var(--lijn); border-radius:var(--pil); padding:0 14px; min-height:40px; background:#fff; color:var(--muted); }
.zoek input { border:0; outline:0; background:none; min-width:180px; font-size:14px; }
.tabelrol { overflow-x:auto; }
table { width:100%; border-collapse:collapse; font-size:14px; }
th { text-align:left; font-family:var(--mono); font-weight:500; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); padding:10px 12px 10px 0; border-bottom:1px solid var(--inkt); white-space:nowrap; }
td { padding:12px 12px 12px 0; border-bottom:1px solid var(--lijn); white-space:nowrap; }
.pil { display:inline-flex; align-items:center; gap:4px; border-radius:var(--pil); padding:3px 9px; font-size:12px; font-weight:700; background:var(--soft); }
.pil.ok { background:var(--zacht); color:var(--kleur); }
.pil.donker { background:var(--inkt); color:#fff; }
.leeg { background:var(--card); border:1px dashed var(--lijn); border-radius:var(--radius); padding:48px 24px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:12px; color:var(--muted); }
.leeg h2 { color:var(--inkt); }
.leeg p { max-width:440px; }
.am-rijen { display:flex; flex-direction:column; gap:10px; margin-bottom:12px; }
.am-rij { display:grid; grid-template-columns:120px minmax(0,1.3fr) minmax(0,1fr) 72px 170px 36px; gap:8px; align-items:end; padding:12px; border:1px solid var(--lijn); border-radius:var(--radius-s); background:var(--card); }
.am-rij .veld { margin-bottom:0; }
.am-rij .veld label { font-size:12.5px; }
.am-weg { width:36px; height:44px; border:0; border-radius:10px; background:var(--soft); color:var(--muted); font-size:20px; cursor:pointer; }
.am-weg:hover { background:var(--rood-soft); color:var(--rood-tekst); }
.am-bod { grid-column:1/-1; display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; font-size:14px; border-top:1px dashed var(--lijn); padding-top:8px; }
.am-bod strong { color:var(--kleur); }
.am-totaal { display:flex; flex-direction:column; gap:4px; margin-top:14px; padding:16px 18px; border-radius:var(--radius-s); background:var(--kleur); color:#fff; }
.am-totaal strong { font-family:var(--display); font-size:30px; letter-spacing:-.03em; }
.am-totaal .label, .am-totaal .muted { color:rgba(255,255,255,.82); }
@media (max-width:760px) { .am-rij { grid-template-columns:repeat(2, minmax(0,1fr)); } .am-model { grid-column:1/-1; } .am-weg { grid-column:2; justify-self:end; } }
.twee { display:grid; grid-template-columns:minmax(0, 1.2fr) minmax(0, .8fr); gap:20px; align-items:start; }
.persoon { display:flex; align-items:center; gap:12px; padding:12px 0; border-top:1px solid var(--lijn); }
.persoon:first-child { border-top:0; }
.ava { width:38px; height:38px; border-radius:50%; background:var(--zacht); color:var(--kleur); display:flex; align-items:center; justify-content:center; font-weight:700; flex-shrink:0; }
.persoon-t { flex:1; min-width:0; }
.persoon-t small { display:block; color:var(--muted); font-size:13px; overflow:hidden; text-overflow:ellipsis; }
#toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--inkt); color:#fff; padding:12px 18px; border-radius:var(--pil); font-weight:600; font-size:14px; z-index:50; max-width:92vw; }
#toast.fout { background:var(--rood-tekst); }

@media (max-width:1000px) { .raster, .twee { grid-template-columns:1fr; } .kpis { grid-template-columns:repeat(2, minmax(0, 1fr)); } }
@media (max-width:700px) {
  .balk-in { flex-wrap:wrap; gap:10px; }
  .tabs { order:3; width:100%; margin-left:0; }
  .wie-naam { display:none; }
  .stappen { grid-template-columns:1fr; gap:12px; }
  .stap { flex-direction:row; align-items:center; gap:12px; }
  .stap::before { display:none; }
  .stap-datum { margin-left:auto; }
}

/* ═══ documenten om te printen ═══
   De documenten zijn gewone HTML die de browser als PDF bewaart (Afdrukken >
   Bewaar als PDF). Zo is er geen PDF-bibliotheek of opslag nodig, en klopt een
   document altijd met wat er op dat moment in Storvo staat. */
#printvak { display:none; }
.blad { font-family:var(--body); color:#111; max-width:780px; margin:0 auto; }
.blad-kop { display:flex; justify-content:space-between; align-items:flex-start; gap:20px; padding-bottom:18px; border-bottom:2px solid var(--kleur); margin-bottom:22px; }
.blad-kop h1 { font-size:26px; margin-top:12px; }
.blad-meta { text-align:right; font-size:12.5px; color:#444; line-height:1.6; }
.blad table { font-size:12px; }
.blad td, .blad th { padding:7px 10px 7px 0; }
.blad-tekst { font-size:13.5px; margin-bottom:16px; line-height:1.6; }
.blad-cijfers { display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; margin:18px 0 22px; }
.blad-cijfers div { border:1px solid #ddd; border-radius:10px; padding:12px; }
.blad-cijfers b { display:block; font-family:var(--display); font-size:24px; }
.blad-voet { margin-top:30px; display:flex; justify-content:space-between; align-items:flex-end; gap:20px; font-size:12px; color:#444; }
.handtekening { border-top:1px solid #111; padding-top:6px; min-width:220px; }
@media print {
  @page { margin:16mm; }
  body { background:#fff; }
  body.printen #app, body.printen #inlog, body.printen #toast { display:none !important; }
  body.printen #printvak { display:block; }
  .blad table { page-break-inside:auto; }
  .blad tr { page-break-inside:avoid; }
}
</style>
</head>
<body>

<!-- ═══ inloggen ═══ -->
<section id="inlog" hidden>
  <svg class="inlogboog" viewBox="16 8 70 76" aria-hidden="true"><path d="M70.8 38 A24 24 0 1 1 62 29.2" fill="none" stroke="var(--accent)" stroke-width="9" stroke-linecap="round"/><path d="M59.2 18.6 L62 29.2 L51.4 32" fill="none" stroke="var(--accent)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <div class="inlogkaart" id="inlogKaart"></div>
</section>

<!-- ═══ de app ═══ -->
<div id="app" hidden>
  <div class="bekijkbalk" id="bekijkBalk" hidden>Je kijkt mee als de klant. Alleen lezen.</div>
  <header class="balk">
    <div class="balk-in">
      <a class="merk" id="merkApp" href="./" aria-label="Klantportaal"></a>
      <nav class="tabs" aria-label="Portaal">
        <button class="tab aan" data-tab="overzicht" onclick="naarTab('overzicht')">Overzicht</button>
        <button class="tab" data-tab="collegas" onclick="naarTab('collegas')">Collega's</button>
        <button class="tab" data-tab="aanmelden" onclick="naarTab('aanmelden')">Partij aanmelden</button>
      </nav>
      <div class="wie">
        <div class="wie-naam" id="wieNaam"></div>
        <button class="btn licht klein" id="uitlogKnop" onclick="uitloggen()">Uitloggen</button>
      </div>
    </div>
  </header>
  <main id="vak"></main>
</div>

<div id="printvak"></div>
<div id="toast" hidden></div>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   Klantportaal

   Organisaties van wie de winkel IT opkoopt, volgen hier hun partij: status,
   wissen, testen, bod en betaling, en de documenten. De gegevens komen uit
   Supabase via de functies klantportaal_overzicht en klantportaal_opdracht. Die
   geven alleen veilige velden terug; een portaalgebruiker heeft geen toegang tot
   de tabellen zelf.

   Het portaal draait op het eigen domein van de winkel (portaal.reloopit.nl) of
   op storvo.app/klantportaal/?w=<slug>. De huisstijl komt uit
   klantportaal_instellingen.
   ═══════════════════════════════════════════════════════════════════════════ */
const SUPABASE_URL = 'https://ugilfxqolemxwssbpdwu.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVnaWxmeHFvbGVteHdzc2JwZHd1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3ODk1NTUsImV4cCI6MjEwMTM2NTU1NX0.7q6R7J0_U0iU6AGlxFoBHpH22cRBluapP3nOsuIssqA';

let params = {};
try { params = Object.fromEntries(new URLSearchParams(location.search)); } catch(e){}
/* Meekijken: de winkel opent het portaal van een organisatie vanuit de refurbish-app
   met ?bekijk=<organisatie_id>. Dan gebruiken we de gewone Storvo-sessie (dezelfde
   opslag als de winkelapp) en is alles alleen-lezen. De database controleert zelf
   of je eigenaar of beheerder bent van die winkel. */
const BEKIJK = params.bekijk || null;
/* Een eigen opslagsleutel voor portaalklanten. Anders delen ze de sessie met de
   winkelapp op hetzelfde domein, en logt uitloggen hier ook de winkel uit. */
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY,
  BEKIJK ? {} : { auth: { storageKey: 'storvo-klantportaal', persistSession: true, detectSessionInUrl: true, flowType: 'implicit' } });

const STAPPEN = [
  { sleutel: 'aangemeld', naam: 'Aangemeld' },
  { sleutel: 'opgehaald', naam: 'Opgehaald' },
  { sleutel: 'gewist', naam: 'Gewist' },
  { sleutel: 'getest', naam: 'Getest' },
  { sleutel: 'afgerond', naam: 'Afgerond' }
];
const VOLGENDE = { opgehaald: 'Ophaling gepland', gewist: 'Wordt gewist', getest: 'Wordt getest', afgerond: 'Rapport en betaling' };
const BESTEMMING = { hergebruik: 'Hergebruik', recycling: 'Recycling', vernietigd: 'Vernietigd' };
const DOCSOORT = {
  ophaalbon: { naam: 'Ophaalbon', icoon: 'truck' },
  wiscertificaat: { naam: 'Wiscertificaat', icoon: 'schild' },
  verwerkingsrapport: { naam: 'Verwerkingsrapport', icoon: 'doc' },
  apparatenlijst: { naam: 'Apparatenlijst', icoon: 'lijst' },
  impactrapport: { naam: 'Impactrapport', icoon: 'blad' }
};

let huisstijl = {}, data = null, gekozen = null, detailCache = {}, zoekterm = '', tabNu = 'overzicht';
let aanmeldKlaar = false, collegas = [];

/* ═══ hulpjes ═══ */
function f(id){ return document.getElementById(id); }
/* Een class-attribuut met een wisselende klasse. Via een template-string, zodat
   tests/huisstijl.js hem niet als losse (ongestijlde) klassen leest. */
function kl(c){ return ` class="${String(c).trim()}"`; }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c])); }
const nf = new Intl.NumberFormat('nl-NL');
const euroFmt = new Intl.NumberFormat('nl-NL', { style:'currency', currency:'EUR', maximumFractionDigits:0 });
function euro(n){ return euroFmt.format(Number(n) || 0); }
function datum(d, lang){
  if(!d) return '';
  const dt = new Date(String(d).length === 10 ? d + 'T12:00:00' : d);
  if(isNaN(dt)) return esc(d);
  return dt.toLocaleDateString('nl-NL', lang ? { day:'numeric', month:'long', year:'numeric' } : { day:'numeric', month:'short' });
}
function ton(kg){ kg = Number(kg) || 0; return kg >= 1000 ? (kg/1000).toLocaleString('nl-NL', { maximumFractionDigits:1 }) + ' t' : nf.format(kg) + ' kg'; }
function kleurOk(k){ return /^#[0-9a-f]{3,8}$/i.test(String(k || '')); }
let toastTimer = null;
function toast(tekst, soort){
  const t = f('toast'); t.textContent = tekst; t.className = soort === 'fout' ? 'fout' : ''; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 3600);
}
const ICONEN = {
  truck:'<path d="M3 7h11v9H3z"/><path d="M14 10h4l3 3v3h-7"/><circle cx="7" cy="18" r="1.8"/><circle cx="17" cy="18" r="1.8"/>',
  schild:'<path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/>',
  doc:'<path d="M7 3h7l4 4v14H7z"/><path d="M10 12h5M10 16h5M14 3v4h4"/>',
  lijst:'<path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6h.01M4 12h.01M4 18h.01"/>',
  blad:'<path d="M5 19c0-8 5-14 15-14 0 10-6 15-14 15"/><path d="M5 19l7-7"/>',
  download:'<path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/>',
  vink:'<path d="M5 12l5 5 9-10"/>',
  klok:'<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>',
  zoek:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  bel:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a1 1 0 0 1-1 1A16 16 0 0 1 4 5a1 1 0 0 1 1-1z"/>',
  doos:'<path d="M4 8l8-4 8 4v8l-8 4-8-4z"/><path d="M4 8l8 4 8-4M12 12v8"/>',
  euro:'<path d="M17 6.5A7 7 0 1 0 17 17.5"/><path d="M4 10h9M4 14h9"/>'
};
function icoon(naam, maat){ maat = maat || 18; return '<svg class="i" width="'+maat+'" height="'+maat+'" viewBox="0 0 24 24" aria-hidden="true">'+(ICONEN[naam]||'')+'</svg>'; }

/* ═══ huisstijl ═══ */
function merkHtml(){
  const naam = esc(huisstijl.merknaam || 'Klantportaal');
  return huisstijl.logo_url && /^https:\/\//.test(huisstijl.logo_url)
    ? '<img src="'+esc(huisstijl.logo_url)+'" alt="'+naam+'">'
    : naam;
}
function huisstijlToepassen(h){
  huisstijl = Object.assign({}, huisstijl, h || {});
  const r = document.documentElement.style;
  if(kleurOk(huisstijl.kleur)) r.setProperty('--kleur', huisstijl.kleur);
  if(kleurOk(huisstijl.accent)) r.setProperty('--accent', huisstijl.accent);
  if(kleurOk(huisstijl.inkt)) r.setProperty('--inkt', huisstijl.inkt);
  document.title = 'Klantportaal' + (huisstijl.merknaam ? ' · ' + huisstijl.merknaam : '');
  f('merkApp').innerHTML = merkHtml();
}
/* Op het eigen domein van de winkel zoeken we de huisstijl op hostnaam, op
   storvo.app op de slug uit ?w=. */
function eigenDomein(){ const h = location.hostname; return /(^|\.)storvo\.(app|nl)$|^localhost$|^127\./.test(h) ? null : h; }
async function huisstijlLaden(){
  try {
    const { data: h } = await sb.rpc('klantportaal_huisstijl', { p_domein: eigenDomein(), p_slug: params.w || null });
    if(h) huisstijlToepassen(h);
  } catch(e){ console.error('huisstijl:', e); }
}

/* ═══ inloggen ═══
   Gewoon: e-mail en wachtwoord. Wie nog geen wachtwoord heeft (of het kwijt is)
   vraagt een link aan. Na de uitnodigingslink maakt de klant eerst zijn account aan. */
function adresHier(){ return location.hostname + (eigenDomein() ? '' : location.pathname.replace(/\/$/, '')); }
function contactZin(){ return huisstijl.contact_email ? ' via <a href="mailto:'+esc(huisstijl.contact_email)+'">'+esc(huisstijl.contact_email)+'</a>' : ''; }
/* Het e-mailadres staat alvast ingevuld: uit de link (?email=) of van de vorige keer
   op dit apparaat. Alleen het adres, nooit het wachtwoord. */
function onthoudMail(m){ try { if(m) localStorage.setItem('klantportaal-email', m); } catch(e){} }
function bekendeMail(){ if(params.email) return params.email; try { return localStorage.getItem('klantportaal-email') || ''; } catch(e){ return ''; } }
/* Eén e-mailveld voor alle inlogschermen (één plek met id inlogMail). */
function mailVeld(label, auto, bijEnter){
  return '<div class="veld"><label for="inlogMail">'+label+'</label>'
    + '<input class="invoer" id="inlogMail" type="email" autocomplete="'+auto+'" placeholder="naam@bedrijf.nl" value="'+esc(bekendeMail())+'" onkeydown="if(event.key===\'Enter\')'+bijEnter+'"></div>';
}
function toonInlog(stand){
  f('app').hidden = true; f('inlog').hidden = false;
  const k = f('inlogKaart');
  const merk = '<div class="merk">'+merkHtml()+'</div>';
  if(stand === 'verstuurd' || stand === 'verstuurdww'){
    k.innerHTML = merk
      + '<h1>Check je mail</h1>'
      + '<p>' + (stand === 'verstuurdww'
          ? 'Als je e-mailadres bij ons bekend is, staat er nu een link in je mailbox om een nieuw wachtwoord te kiezen. Die werkt een uur.'
          : 'Als je e-mailadres bij ons bekend is, staat er nu een inloglink in je mailbox. Die werkt een uur.') + '</p>'
      + '<button class="btn licht breed" onclick="toonInlog()">Terug naar inloggen</button>';
    return;
  }
  if(stand === 'geentoegang'){
    k.innerHTML = merk
      + '<h1>Geen toegang</h1>'
      + '<p>Dit account hoort niet bij een klantportaal, of je toegang is uitgezet. Neem contact met ons op als dat niet klopt.</p>'
      + '<button class="btn breed" onclick="uitloggen()">Opnieuw inloggen</button>';
    return;
  }
  const verlopen = /error_code=otp_expired|error=access_denied/.test(location.hash);
  const melding = verlopen ? '<div class="melding fout">Deze link is verlopen of al gebruikt. Vraag hieronder een nieuwe aan.</div>' : '';
  if(stand === 'link' || stand === 'vergeten' || verlopen){
    const ww = stand === 'vergeten';
    k.innerHTML = merk
      + '<h1>' + (ww ? 'Wachtwoord vergeten' : 'Inloggen met een link') + '</h1>'
      + '<p>' + (ww ? 'Vul je e-mailadres in. Je krijgt een link om een nieuw wachtwoord te kiezen.'
                    : 'Vul je e-mailadres in. Je krijgt een link waarmee je zonder wachtwoord binnenkomt.') + '</p>'
      + melding
      + mailVeld('Je e-mailadres', 'email', 'inlogLinkVragen('+(ww ? '\'wachtwoord\'' : '')+')')
      + '<button class="btn breed" id="inlogKnop" onclick="inlogLinkVragen('+(ww ? '\'wachtwoord\'' : '')+')">' + (ww ? 'Stuur mij de link' : 'Stuur mij een inloglink') + '</button>'
      + '<div class="inloglinks"><button class="linkknop" onclick="toonInlog()">Terug naar inloggen</button></div>';
    return;
  }
  k.innerHTML = merk
    + '<h1>Klantportaal</h1>'
    + '<p>Volg je partij: ophaling, wissen, testen en betaling. Met al je certificaten en rapporten.</p>'
    + mailVeld('E-mailadres', 'username', 'f(\'inlogWw\').focus()')
    + '<div class="veld"><label for="inlogWw">Wachtwoord</label>'
    + '<input class="invoer" id="inlogWw" type="password" autocomplete="current-password" onkeydown="if(event.key===\'Enter\')wachtwoordInloggen()"></div>'
    + '<button class="btn breed" id="wwKnop" onclick="wachtwoordInloggen()">Inloggen</button>'
    + '<div class="inloglinks"><button class="linkknop" onclick="toonInlog(\'vergeten\')">Wachtwoord vergeten?</button>'
    + '<button class="linkknop" onclick="toonInlog(\'link\')">Inloggen met een link</button></div>'
    + '<p class="inlogvoet">Nog geen account? Je krijgt een uitnodiging van je contactpersoon' + contactZin() + '.</p>';
  if(bekendeMail()) setTimeout(() => { const w = f('inlogWw'); if(w) w.focus(); }, 0);
}
async function wachtwoordInloggen(){
  const mail = (f('inlogMail').value || '').trim(), ww = f('inlogWw').value || '';
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)){ toast('Vul een geldig e-mailadres in.', 'fout'); return; }
  if(!ww){ toast('Vul je wachtwoord in.', 'fout'); f('inlogWw').focus(); return; }
  const knop = f('wwKnop'); knop.disabled = true; knop.textContent = 'Even geduld...';
  try {
    const { error } = await sb.auth.signInWithPassword({ email: mail, password: ww });
    if(error) throw error;
    onthoudMail(mail);
    await opstarten();
  } catch(e){
    knop.disabled = false; knop.textContent = 'Inloggen';
    toast(/invalid|credentials/i.test(e && e.message || '') ? 'E-mailadres of wachtwoord klopt niet.' : 'Inloggen lukte niet. Probeer het zo nog eens.', 'fout');
  }
}
async function inlogLinkVragen(doel){
  const mail = (f('inlogMail').value || '').trim();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)){ toast('Vul een geldig e-mailadres in.', 'fout'); return; }
  const knop = f('inlogKnop'), tekst = knop ? knop.textContent : '';
  if(knop){ knop.disabled = true; knop.textContent = 'Even geduld...'; }
  try {
    const res = await fetch(SUPABASE_URL + '/functions/v1/klantportaal', {
      method:'POST', headers:{ 'Content-Type':'application/json', apikey:SUPABASE_ANON_KEY, Authorization:'Bearer '+SUPABASE_ANON_KEY },
      body: JSON.stringify({ actie:'inloglink', email:mail, domein:eigenDomein(), slug:params.w || huisstijl.slug || null, doel: doel || null })
    });
    const uit = await res.json().catch(() => ({}));
    if(!res.ok || uit.ok === false){ throw new Error(uit.error || 'mislukt'); }
    if(location.hash) history.replaceState(null, '', location.pathname + location.search);
    toonInlog(doel === 'wachtwoord' ? 'verstuurdww' : 'verstuurd');
  } catch(e){
    if(knop){ knop.disabled = false; knop.textContent = tekst; }
    toast('Versturen lukte niet. Probeer het zo nog eens.', 'fout');
  }
}

/* ═══ account aanmaken / nieuw wachtwoord ═══
   Na de uitnodigingslink (nog geen account) of na 'wachtwoord vergeten' (?stap=wachtwoord). */
function toonAccount(nieuwWw){
  f('app').hidden = true; f('inlog').hidden = false;
  f('inlogKaart').innerHTML = '<div class="merk">'+merkHtml()+'</div>'
    + '<h1>' + (nieuwWw ? 'Kies een nieuw wachtwoord' : 'Maak je account aan') + '</h1>'
    + '<p>' + (nieuwWw ? 'Je bent ingelogd als <b>'+esc(data.email || '')+'</b>. Kies een nieuw wachtwoord.'
        : 'Welkom bij het klantportaal van '+esc(data.bedrijf || 'je organisatie')+'. Je e-mailadres is <b>'+esc(data.email || '')+'</b>. '
          + 'Kies een wachtwoord, dan log je voortaan in op <b>'+esc(adresHier())+'</b>.') + '</p>'
    + '<div class="veld"><label for="accMail">E-mailadres (hiermee log je in)</label><input class="invoer" id="accMail" type="email" autocomplete="username" value="'+esc(data.email || '')+'" readonly></div>'
    + (nieuwWw ? '' : '<div class="veld"><label for="accNaam">Je naam</label><input class="invoer" id="accNaam" type="text" autocomplete="name" value="'+esc(data.naam || '')+'"></div>')
    + '<div class="veld"><label for="accWw">Wachtwoord</label><input class="invoer" id="accWw" type="password" autocomplete="new-password" placeholder="Minstens 8 tekens"></div>'
    + '<div class="veld"><label for="accWw2">Herhaal wachtwoord</label><input class="invoer" id="accWw2" type="password" autocomplete="new-password" onkeydown="if(event.key===\'Enter\')accountOpslaan('+(nieuwWw ? 'true' : 'false')+')"></div>'
    + '<button class="btn breed" id="accKnop" onclick="accountOpslaan('+(nieuwWw ? 'true' : 'false')+')">' + (nieuwWw ? 'Wachtwoord opslaan' : 'Account aanmaken') + '</button>';
}
async function accountOpslaan(nieuwWw){
  const ww = f('accWw').value || '', ww2 = f('accWw2').value || '';
  const naam = f('accNaam') ? (f('accNaam').value || '').trim() : '';
  if(ww.length < 8){ toast('Kies een wachtwoord van minstens 8 tekens.', 'fout'); return; }
  if(ww !== ww2){ toast('De twee wachtwoorden zijn niet gelijk.', 'fout'); return; }
  const knop = f('accKnop'), tekst = knop.textContent; knop.disabled = true; knop.textContent = 'Even geduld...';
  try {
    const { data: { session } } = await sb.auth.getSession();
    const res = await fetch(SUPABASE_URL + '/functions/v1/klantportaal', {
      method:'POST', headers:{ 'Content-Type':'application/json', apikey:SUPABASE_ANON_KEY, Authorization:'Bearer '+(session ? session.access_token : '') },
      body: JSON.stringify({ actie:'account_aanmaken', wachtwoord:ww, naam: naam || null })
    });
    const uit = await res.json().catch(() => ({}));
    if(!res.ok || uit.ok === false) throw new Error(uit.error || 'Opslaan lukte niet. Probeer het opnieuw.');
    data.account_klaar = true; if(naam) data.naam = naam;
    onthoudMail(data.email);
    delete params.stap;
    const zoek = new URLSearchParams(location.search); zoek.delete('stap');
    history.replaceState(null, '', location.pathname + (zoek.toString() ? '?' + zoek : ''));
    toast(nieuwWw ? 'Je nieuwe wachtwoord is opgeslagen.' : 'Je account is klaar. We hebben je een mail gestuurd met waar je voortaan inlogt.');
    toonApp();
  } catch(e){
    knop.disabled = false; knop.textContent = tekst;
    toast(e.message || 'Opslaan lukte niet.', 'fout');
  }
}
async function uitloggen(){
  if(BEKIJK){ window.close(); return; }
  try { await sb.auth.signOut(); } catch(e){}
  data = null; detailCache = {}; gekozen = null;
  history.replaceState(null, '', location.pathname + (params.w ? '?w=' + encodeURIComponent(params.w) : ''));
  toonInlog();
}

/* ═══ laden ═══ */
async function laden(){
  const { data: d, error } = await sb.rpc('klantportaal_overzicht', BEKIJK ? { p_organisatie: BEKIJK } : {});
  if(error){ console.error('overzicht:', error); toast('Kon je gegevens niet laden. Probeer het opnieuw.', 'fout'); return false; }
  if(!d){ toonInlog('geentoegang'); return false; }
  data = d;
  huisstijlToepassen(d.huisstijl);
  if(!gekozen || !(d.opdrachten || []).some(o => o.id === gekozen)) gekozen = (d.opdrachten[0] || {}).id || null;
  return true;
}
let opstartBezig = false;
async function opstarten(){
  if(opstartBezig) return; opstartBezig = true;
  try { await opstartenEcht(); } finally { opstartBezig = false; }
}
async function opstartenEcht(){
  await huisstijlLaden();
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ toonInlog(); return; }
  if(await laden()){
    // De tokens uit de inloglink staan nog in de adresbalk: weghalen.
    if(location.hash) history.replaceState(null, '', location.pathname + location.search);
    if(!BEKIJK && (data.account_klaar === false || params.stap === 'wachtwoord')){
      toonAccount(data.account_klaar !== false && params.stap === 'wachtwoord');
      return;
    }
    toonApp();
  }
}
function toonApp(){
  if(!BEKIJK) onthoudMail(data.email);
  {
    f('inlog').hidden = true; f('app').hidden = false;
    f('bekijkBalk').hidden = !BEKIJK;
    f('uitlogKnop').textContent = BEKIJK ? 'Sluiten' : 'Uitloggen';
    f('wieNaam').innerHTML = '<b>'+esc(data.bedrijf)+'</b>'+esc(data.naam || '');
    document.querySelectorAll('.tab').forEach(t => { if(BEKIJK && t.dataset.tab !== 'overzicht') t.hidden = true; });
    if(!BEKIJK) sb.rpc('klantportaal_gezien').then(() => {}, () => {});
    teken();
  }
}

/* ═══ tabs ═══ */
function naarTab(t){
  tabNu = t;
  document.querySelectorAll('.tab').forEach(k => k.classList.toggle('aan', k.dataset.tab === t));
  if(t === 'collegas') collegasLaden();
  teken(); window.scrollTo(0, 0);
}
function teken(){
  if(!data) return;
  if(tabNu === 'collegas') tekenCollegas();
  else if(tabNu === 'aanmelden') tekenAanmelden();
  else tekenOverzicht();
}

/* ═══ overzicht ═══ */
function stapIndex(o){ const t = o.tijdlijn || {}; let i = -1; STAPPEN.forEach((s, n) => { if(t[s.sleutel]) i = n; }); return i; }
function statusVan(o){
  const i = stapIndex(o);
  if(i >= STAPPEN.length - 1) return { tekst:'Afgerond', kort:'Afgerond', klas:'klaar' };
  if(i < 0) return { tekst:'Nieuw', kort:'Nieuw', klas:'nieuw' };
  return { tekst:VOLGENDE[STAPPEN[i+1].sleutel], kort:'Bezig', klas:'bezig' };
}
function begroeting(){ const u = new Date().getHours(); return u < 12 ? 'Goedemorgen' : u < 18 ? 'Goedemiddag' : 'Goedenavond'; }
function kpiRij(){
  let tot = 0, herg = 0, verw = 0, co2 = 0, waarde = 0;
  (data.opdrachten || []).forEach(o => {
    const a = o.aantallen || {};
    tot += a.totaal || 0;
    if(a.hergebruik != null){ herg += a.hergebruik; verw += (a.hergebruik||0) + (a.recycling||0) + (a.vernietigd||0); }
    if(o.impact) co2 += o.impact.co2_kg || 0;
    if(o.bod) waarde += o.bod.definitief || o.bod.indicatief || 0;
  });
  const pct = verw ? Math.round(herg / verw * 100) + '%' : '-';
  return '<ul class="kpis">'
    + '<li><b>'+nf.format(tot)+'</b><small>apparaten aangeboden</small></li>'
    + '<li class="accent"><b>'+pct+'</b><small>krijgt een tweede leven</small></li>'
    + '<li><b>'+ton(co2)+'</b><small>CO₂-uitstoot vermeden</small></li>'
    + '<li><b>'+euro(waarde)+'</b><small>opbrengst</small></li></ul>';
}
function tekenOverzicht(){
  const lijst = data.opdrachten || [];
  const am = data.accountmanager || {};
  let h = '<div class="kop"><div><span class="label">'+esc(data.bedrijf)+'</span><h1>'+begroeting()+(data.naam ? ', '+esc(data.naam) : '')+'</h1></div>'
    + '<div class="knoppen">'
    + (am.telefoon ? '<a class="btn licht klein" href="tel:'+esc(String(am.telefoon).replace(/\s/g,''))+'">'+icoon('bel',16)+esc(am.naam || 'Bel ons')+'</a>' : '')
    + (BEKIJK ? '' : '<button class="btn klein" onclick="naarTab(\'aanmelden\')">'+icoon('plus',16)+'Partij aanmelden</button>')
    + '</div></div>';
  if(!lijst.length){
    h += '<div class="leeg">'+icoon('doos',32)+'<h2>Nog geen opdrachten</h2><p>Zodra je een partij aanmeldt, volg je hier alles: ophaling, wissen, testen, rapporten en betaling.</p>'
      + (BEKIJK ? '' : '<button class="btn" onclick="naarTab(\'aanmelden\')">Partij aanmelden</button>') + '</div>';
    f('vak').innerHTML = h; return;
  }
  h += kpiRij();

async function documentOpenen(id, soort){
  const o = (data.opdrachten || []).find(x => x.id === id);
  const d = await detailLaden(id);
  if(!o || !d){ toast('Kon het document niet maken.', 'fout'); return; }
  if(soort === 'apparatenlijst'){ csvDownloaden(o, d); return; }
  const html = soort === 'ophaalbon' ? docOphaalbon(o, d)
    : soort === 'wiscertificaat' ? docWiscertificaat(o, d)
    : soort === 'verwerkingsrapport' ? docVerwerking(o, d)
    : soort === 'impactrapport' ? docImpact(o, d) : '';
  if(!html) return;
  f('printvak').innerHTML = '<div class="blad">'+html+'</div>';
  document.body.classList.add('printen');
  const oud = document.title;
  document.title = (DOCSOORT[soort] || {}).naam + ' ' + (o.nummer || '');
  const klaar = () => { document.body.classList.remove('printen'); document.title = oud; window.removeEventListener('afterprint', klaar); };
  window.addEventListener('afterprint', klaar);
  setTimeout(() => { window.print(); setTimeout(klaar, 1000); }, 50);
}

function csvDownloaden(o, d){
  const kol = ['Serienummer','Model','Soort','Wissen','Methode','Datum gewist','Grade','Bestemming'];
  const cel = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const regels = [kol.map(cel).join(';')].concat((d.apparaten || []).map(a =>
    [a.sn, a.model, a.categorie, a.wis, a.wis_methode, a.wis_op ? String(a.wis_op).slice(0,10) : '', a.grade, BESTEMMING[a.bestemming] || ''].map(cel).join(';')));
  // BOM zodat Excel de accenten goed leest; puntkomma omdat Excel in Nederland die verwacht.
  const blob = new Blob(['﻿' + regels.join('\r\n')], { type:'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob), link = document.createElement('a');
  link.href = url; link.download = 'apparaten-' + (o.nummer || 'opdracht') + '.csv';
  document.body.appendChild(link); link.click(); link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

async function collegaUitnodigen(){
  const naam = f('nieuwNaam').value.trim(), mail = f('nieuwMail').value.trim();
  const rolKnop = document.querySelector('.keuze.aan[data-rol]');
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)){ toast('Vul een geldig e-mailadres in.', 'fout'); return; }
  const knop = f('uitnodigKnop'); knop.disabled = true; knop.textContent = 'Versturen...';
  try {
    const { data: { session } } = await sb.auth.getSession();
    const res = await fetch(SUPABASE_URL + '/functions/v1/klantportaal', {
      method:'POST', headers:{ 'Content-Type':'application/json', apikey:SUPABASE_ANON_KEY, Authorization:'Bearer ' + (session ? session.access_token : '') },
      body: JSON.stringify({ actie:'uitnodigen', email:mail, naam:naam, rol:rolKnop ? rolKnop.dataset.rol : 'lezer' })
    });
    const uit = await res.json().catch(() => ({}));
    if(!res.ok || uit.ok === false) throw new Error(uit.error || 'Uitnodigen lukte niet.');
    toast('Uitnodiging verstuurd naar ' + mail);
    await collegasLaden();
  } catch(e){
    toast(e.message || 'Uitnodigen lukte niet.', 'fout');
    knop.disabled = false; knop.textContent = 'Uitnodiging sturen';
  }
}
async function collegaUit(id){
  if(!confirm('Deze collega kan dan niet meer inloggen. Doorgaan?')) return;
  const { data: gelukt } = await sb.rpc('klantportaal_collega_uit', { p_user:id });
  toast(gelukt ? 'Toegang weggehaald.' : 'Dat lukte niet.', gelukt ? '' : 'fout');
  collegasLaden();
}

const AM_STAAT = [['goed','Werkt, nette staat'],['sporen','Werkt, flinke gebruikssporen'],['defect','Defect of onbekend']];

function amOpties(lijst, gekozen){ return lijst.map(o => '<option value="'+o[0]+'"'+(o[0] === gekozen ? ' selected' : '')+'>'+o[1]+'</option>').join(''); }

    + '<div class="veld am-model"><label for="amModel'+i+'">Merk en model</label><input class="invoer" id="amModel'+i+'" value="'+esc(r.model)+'" placeholder="'+esc(AM_VOORBEELD[r.soort][0])+'" oninput="amZet('+i+',\'model\',this.value)"></div>'
    + '<div class="veld"><label for="amSpecs'+i+'">Specs</label><input class="invoer" id="amSpecs'+i+'" value="'+esc(r.specs)+'" placeholder="'+esc(AM_VOORBEELD[r.soort][1])+'" oninput="amZet('+i+',\'specs\',this.value)"></div>'
    + '<div class="veld"><label for="amAantal'+i+'">Aantal</label><input class="invoer" id="amAantal'+i+'" type="number" min="1" inputmode="numeric" value="'+esc(r.aantal)+'" oninput="amZet('+i+',\'aantal\',this.value)"></div>'
    + '<div class="veld"><label for="amStaat'+i+'">Staat</label><select class="invoer" id="amStaat'+i+'" onchange="amZet('+i+',\'staat\',this.value)">'+amOpties(AM_STAAT, r.staat)+'</select></div>'
    + '<button class="am-weg" type="button" aria-label="Regel weghalen" onclick="amWeg('+i+')">×</button>'
    + '<div class="am-bod" id="amBod'+i+'" hidden></div></div>').join('');
}
function tekenAanmelden(){
  if(aanmeldKlaar){
    const t = amUitkomst && amUitkomst.max ? '<p><strong>Onze eerste indicatie: '+amBereik(amUitkomst.min, amUitkomst.max)+'.</strong></p>' : '';
    f('vak').innerHTML = '<div class="leeg">'+icoon('vink',32)+'<h2>Ontvangen</h2>'+t+'<p>We nemen binnen twee werkdagen contact op om de ophaling te plannen. Je krijgt ook een bevestiging per mail.</p>'
      + '<button class="btn licht" onclick="aanmeldOpnieuw()">Nog een partij aanmelden</button></div>';
    return;
  }
  if(!amRegels.length) amRegels = [amNieuw()];
  f('vak').innerHTML = '<div class="kop"><div><span class="label">'+esc(data.bedrijf)+'</span><h1>Partij aanmelden</h1></div></div>'
    + '<div class="twee"><div class="kaart">'
    + '<h3>Wat wil je aanmelden?</h3><p class="muted" style="margin:6px 0 14px">Vul per model in wat je hebt. Je ziet meteen wat we ongeveer bieden.</p>'
    + '<div id="amRijen" class="am-rijen">'+amRijenHtml()+'</div>'
    + '<button class="btn licht" type="button" onclick="amRegel()">+ Nog een model</button>'
    + '<div class="am-totaal" id="amTotaal" hidden></div>'
    + '<div class="veld" style="margin-top:16px"><label for="amWat">Nog iets dat we moeten weten? (optioneel)</label><textarea class="invoer" id="amWat" placeholder="Bijvoorbeeld: inclusief laders, 3 toestellen zonder SSD"></textarea></div>'
    + '<div class="veld"><label for="amAdres">Ophaaladres</label><input class="invoer" id="amAdres" autocomplete="street-address"></div>'
    + '<div class="veld"><label for="amPeriode">Wanneer?</label><input class="invoer" id="amPeriode" placeholder="Bijvoorbeeld: eind oktober"></div>'
    + '<button class="btn breed" id="amKnop" onclick="aanmelden()">Aanmelden</button></div>'
    + '<div class="kaart"><h3>Wat er daarna gebeurt</h3><p class="muted" style="margin-top:8px">Je ziet hier meteen een indicatief bod. Binnen twee werkdagen nemen we contact op om de ophaling te plannen. Het definitieve bod volgt nadat we alles gewist en getest hebben. Vanaf dan volg je alles hier in het portaal.</p></div></div>';
  amPlan(0);
}
function amZet(i, k, w){
  if(!amRegels[i]) return;
  amRegels[i][k] = k === 'aantal' ? Math.max(1, parseInt(w, 10) || 1) : w;
  if(k === 'soort'){ const m = f('amModel'+i), s = f('amSpecs'+i); if(m) m.placeholder = AM_VOORBEELD[w][0]; if(s) s.placeholder = AM_VOORBEELD[w][1]; }
  amPlan(k === 'soort' || k === 'staat' ? 200 : 900);
}
function amRegel(){ bewaarVelden(); amRegels.push(amNieuw()); tekenAanmelden(); const m = f('amModel'+(amRegels.length-1)); if(m) m.focus(); }
function amWeg(i){ bewaarVelden(); amRegels.splice(i, 1); if(!amRegels.length) amRegels = [amNieuw()]; tekenAanmelden(); }
/* De losse velden onder de regels onthouden als de lijst opnieuw getekend wordt. */
let amVelden = {};
function bewaarVelden(){ ['amWat','amAdres','amPeriode'].forEach(id => { const e = f(id); if(e) amVelden[id] = e.value; }); }
function amPlan(ms){
  clearTimeout(amTimer);
  amTimer = setTimeout(amBereken, ms);
  ['amWat','amAdres','amPeriode'].forEach(id => { const e = f(id); if(e && amVelden[id] && !e.value) e.value = amVelden[id]; });
}
function amBruikbaar(){ return amRegels.map((r, i) => ({ r, i })).filter(x => String(x.r.model || '').trim().length >= 3); }
async function amBereken(){
  const lijst = amBruikbaar(), tot = f('amTotaal');
  amRegels.forEach((r, i) => { const b = f('amBod'+i); if(b && String(r.model || '').trim().length < 3) b.hidden = true; });
  if(!lijst.length){ if(tot) tot.hidden = true; return; }
  const nr = ++amNr;
  lijst.forEach(x => { const b = f('amBod'+x.i); if(b){ b.hidden = false; b.innerHTML = '<span class="muted">Bod berekenen…</span>'; } });
  try {
    const res = await fetch(SUPABASE_URL + '/functions/v1/klantportaal', {
      method:'POST', headers:{ 'Content-Type':'application/json', apikey:SUPABASE_ANON_KEY, Authorization:'Bearer '+SUPABASE_ANON_KEY },
      body: JSON.stringify({ actie:'bod', domein:eigenDomein(), slug:params.w || huisstijl.slug || null, regels: lijst.map(x => x.r) })
    });
    const d = await res.json();
    if(nr !== amNr) return;
    if(!res.ok || d.ok === false) throw new Error(d.error || 'mislukt');
    (d.regels || []).forEach((u, n) => {
      const x = lijst[n]; if(!x) return; const b = f('amBod'+x.i); if(!b) return;
      b.innerHTML = u.per_stuk ? '<span><strong>'+amBereik(u.per_stuk.min, u.per_stuk.max)+'</strong> per stuk</span><span>'+x.r.aantal+'× = <strong>'+amBereik(u.totaal.min, u.totaal.max)+'</strong></span>'
        : '<span class="muted">Dit model beoordelen we zelf; je krijgt binnen twee werkdagen een bod.</span>';
    });
    if(tot){
      if(d.totaal && d.totaal.max){
        tot.innerHTML = '<span class="label">Indicatief bod</span><strong>'+amBereik(d.totaal.min, d.totaal.max)+'</strong><span class="muted">'+(d.open ? 'voor de modellen die we al kennen' : 'voor de hele partij')+'. Het definitieve bod volgt na wissen en testen.</span>';
        tot.hidden = false;
      } else tot.hidden = true;
    }
  } catch(e){
    if(nr !== amNr) return;
    lijst.forEach(x => { const b = f('amBod'+x.i); if(b) b.innerHTML = '<span class="muted">Een bod rekenen lukte even niet. Je kunt gewoon aanmelden.</span>'; });
  }
}
async function aanmelden(){
  const lijst = amBruikbaar().map(x => x.r);
  const wat = (f('amWat') ? f('amWat').value : '').trim();
  if(!lijst.length && wat.length < 3){ toast('Vul minstens één model in, of vertel kort wat je hebt.', 'fout'); return; }
  const knop = f('amKnop'); knop.disabled = true; knop.textContent = 'Versturen...';
  try {
    const { data: { session } } = await sb.auth.getSession();
    const res = await fetch(SUPABASE_URL + '/functions/v1/klantportaal', {
      method:'POST', headers:{ 'Content-Type':'application/json', apikey:SUPABASE_ANON_KEY, Authorization:'Bearer '+(session ? session.access_token : '') },
      body: JSON.stringify({ actie:'aanmelden', regels:lijst, opmerking:wat, ophaaladres:f('amAdres').value.trim(), periode:f('amPeriode').value.trim() })
    });
    const d = await res.json().catch(() => ({}));
    if(!res.ok || d.ok === false) throw new Error(d.error || 'Aanmelden lukte niet. Probeer het opnieuw.');
    amUitkomst = d.totaal || null; amRegels = []; amVelden = {};
    aanmeldKlaar = true; tekenAanmelden();
    laden().then(() => {}, () => {});
  } catch(e){
    knop.disabled = false; knop.textContent = 'Aanmelden';
    toast(e.message || 'Aanmelden lukte niet. Probeer het opnieuw.', 'fout');
  }
}
function aanmeldOpnieuw(){ aanmeldKlaar = false; tekenAanmelden(); }

/* Bij het inloggen via de link komt de sessie binnen via de adresbalk. */
try { sb.auth.onAuthStateChange((event) => { if(event === 'SIGNED_IN' && !data && !BEKIJK) opstarten(); }); } catch(e){}
opstarten();
</script>
</body>
</html>
