<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Storvo Partner</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
:root { color-scheme: light;
  --navy:#123F39; --navy-2:#0E4C44; --oranje:#0B5B52; --oranje-d:#093F39;
  --actie:#E88A1D; --actie-d:#CE7811; --lblauw:#E7F1EE;
  --blue:#0B5B52; --blue-d:#093F39;   /* alias: het oude accent wordt Storvo-groen */
  --bg:#F7F6F3; --line:#ECEAE4; --txt:#17201E; --mut:#5B6663; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Instrument Sans', -apple-system, sans-serif; background: var(--bg); color: var(--txt); min-height: 100vh; }
#app { display: flex; min-height: 100vh; }
svg.i { width: 18px; height: 18px; flex-shrink: 0; }
#sidebar { width: 232px; background: var(--navy); flex-shrink: 0; padding: 22px 14px 16px; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; border-right: none; }
.brand { display: flex; align-items: center; gap: 10px; font-family: 'Sora', sans-serif; font-weight: 800; font-size: 19px; padding: 0 8px 22px; color: var(--txt); }
.navbtn { display: flex; align-items: center; gap: 11px; width: 100%; text-align: left; background: none; border: none; color: #A9B4B0; padding: 11px 14px; font-size: 13.5px; font-weight: 600; cursor: pointer; border-radius: 12px; margin-bottom: 3px; font-family: inherit; position: relative; }
.navbtn:hover { background: var(--navy-2); color: #fff; }
.navbtn.active { background: var(--oranje); color: #fff; box-shadow: none; }
.navspacer { flex: 1; }
.navdot { background: var(--blue); color: #fff; font-size: 10px; font-weight: 700; border-radius: 999px; min-width: 18px; height: 18px; display: none; align-items: center; justify-content: center; padding: 0 5px; margin-left: auto; }
#alertdot { background: #e5484d; }
#margedot { background: #f59e0b; }
.navbtn.active .navdot { background: rgba(255,255,255,.28); }
#content { flex: 1; min-width: 0; display: flex; flex-direction: column; }
#topbar { display: flex; align-items: center; gap: 16px; padding: 18px 30px 0; max-width: 1250px; width: 100%; margin: 0 auto; }
.search { flex: 1; max-width: 420px; display: flex; align-items: center; gap: 9px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; color: var(--mut); }
.search input { border: none; outline: none; flex: 1; font-size: 13px; background: none; color: var(--txt); }
.topright { margin-left: auto; display: flex; align-items: center; gap: 16px; }
.bell { position: relative; background: #fff; border: 1px solid var(--line); width: 40px; height: 40px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #5a6478; }
.bell:hover { color: var(--blue); }
#belldot { position: absolute; top: -5px; right: -5px; background: var(--blue); color: #fff; font-size: 10px; font-weight: 700; border-radius: 999px; min-width: 17px; height: 17px; display: none; align-items: center; justify-content: center; padding: 0 4px; }
.userchip { display: flex; align-items: center; gap: 10px; }
.userchip .ava { width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg, #0B5B52, #123F39); color: #fff; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.userchip b { font-size: 13px; display: block; }
.userchip small { color: var(--mut); font-size: 11px; }
#main { flex: 1; padding: 22px 30px 34px; max-width: 1250px; width: 100%; margin: 0 auto; }
h1 { font-size: 20px; margin-bottom: 4px; letter-spacing: -.2px; }
.sub { color: var(--mut); font-size: 13px; margin-bottom: 20px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 16px; }
.kpi { background: #fff; border-radius: 16px; padding: 16px 18px; display: flex; align-items: center; gap: 13px; box-shadow: 0 1px 2px rgba(28,35,51,.05); }
.kico { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: #eef0f4; color: #5a6478; }
.kpi.green .kico { background: #e2f6ec; color: #16a077; }
.kpi.blue .kico { background: var(--lblauw); color: var(--oranje); }
.kpi.purple .kico { background: var(--lblauw); color: var(--navy); }
.kpi.orange .kico { background: #FBEEDD; color: var(--actie-d); }
.kpi.red .kico { background: #fde8e9; color: #e5484d; }
.kpi .lbl { font-size: 11.5px; color: var(--mut); font-weight: 600; margin-bottom: 3px; }
.kpi .val { font-size: 19px; font-weight: 800; letter-spacing: -.3px; }
.chartrow { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
.chart { display: flex; align-items: stretch; gap: 8px; height: 185px; margin-top: 34px; }
.cb { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; justify-content: flex-end; position: relative; min-width: 0; }
.cb .bar { width: 68%; max-width: 36px; background: #e8ecf3; border-radius: 9px; min-height: 6px; transition: background .15s; }
.cb:hover .bar, .cb.hot .bar { background: var(--blue); }
.cb.green:hover .bar, .cb.green.hot .bar { background: #16a077; }
.cb .m { font-size: 11px; color: var(--mut); }
.cb .tip { position: absolute; top: -34px; left: 50%; transform: translateX(-50%); background: #171c26; color: #fff; font-size: 11px; font-weight: 700; padding: 6px 10px; border-radius: 8px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .15s; z-index: 2; }
.cb:hover .tip, .cb.hot .tip { opacity: 1; }
.cb.hot:not(:hover) .tip { opacity: 0; }
.chart:hover .cb.hot:not(:hover) .bar { background: #e8ecf3; }
.chart:hover .cb.green.hot:not(:hover) .bar { background: #e8ecf3; }
table { width: 100%; border-collapse: collapse; background: #fff; font-size: 13px; }
th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .4px; color: var(--mut); background: #fff; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 11px 12px; border-bottom: 1px solid #f2f4f9; vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tr.click { cursor: pointer; }
tr.click:hover td { background: #f5f8ff; }
.tablewrap { border-radius: 14px; overflow-x: auto; background: #fff; box-shadow: 0 1px 2px rgba(28,35,51,.05); }
/* login */
#loginwrap { position: fixed; inset: 0; z-index: 100; display: none; align-items: center; justify-content: center; background: linear-gradient(135deg, #123F39, #0E4C44 55%, #0B5B52); }
.logincard { background: #fff; border-radius: 24px; padding: 38px 34px 30px; width: 400px; max-width: 92vw; box-shadow: 0 30px 80px rgba(10,20,60,.35); text-align: left; }
.logincard .mk { width: 52px; height: 52px; margin: 0 0 18px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.logincard .mk svg { width: 100%; height: 100%; }
.logincard h2 { font-family: 'Sora', sans-serif; font-size: 24px; font-weight: 800; letter-spacing: -.04em; margin-bottom: 4px; color: var(--txt); }
.logincard h2 span { color: var(--actie); }
.logincard .lmut { color: var(--mut); font-size: 14.5px; line-height: 1.55; margin-bottom: 22px; }
#loginerr { color: #e5484d; font-size: 12px; margin-top: 8px; display: none; }
.badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.b-ok { background: #e6f6ee; color: #12805c; }
.b-warn { background: #fdf0e5; color: #c2540a; }
.b-bad { background: #fdebec; color: #ce2c31; }
.b-info { background: #e8f0fe; color: #2563eb; }
.b-gray { background: #eef0f3; color: #556; }
.b-purple { background: #f1e8fd; color: #7c3aed; }
.card { background: #fff; border-radius: 16px; padding: 20px 22px; margin-bottom: 16px; box-shadow: 0 1px 2px rgba(28,35,51,.05); }
label { display: block; font-size: 12px; font-weight: 600; color: #344054; margin-bottom: 4px; }
input[type=text], input[type=number], input[type=password], textarea, select { width: 100%; padding: 9px 11px; border: 1px solid #dde3ee; border-radius: 10px; font-size: 13px; font-family: inherit; background: #fff; color: var(--txt); }
input:focus, textarea:focus, select:focus { outline: 2px solid var(--mint, #7FC4B6); border-color: var(--oranje); }
textarea { resize: vertical; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
.grid4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 14px; }
.field { margin-bottom: 14px; }
.btn { display: inline-flex; align-items: center; gap: 6px; background: var(--blue); color: #fff; border: none; border-radius: 10px; padding: 9px 16px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; }
.btn:hover { background: var(--blue-d); }
.btn.gray { background: #eef0f3; color: #344054; }
.btn.gray:hover { background: #e2e5ea; }
.btn.green { background: var(--actie); }
.btn.green:hover { background: var(--actie-d); }
.btn.sm { padding: 5px 10px; font-size: 12px; }
.btn.purple { background: var(--oranje); }
.btn.red { background: #e5484d; }
.btn:disabled { opacity: .5; cursor: default; }
.checkrow { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-bottom: 8px; flex-wrap: wrap; }
.checkrow input { width: auto; }
.dupbanner { background: #fff8e6; border: 1px solid #f0d47a; color: #8a6a10; border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-bottom: 14px; display: none; }
.notice { background: #fdebec; border: 1px solid #f4b0b4; color: #ce2c31; border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-bottom: 14px; }
.notice.blue { background: #e8f0fe; border-color: #b9d0fb; color: #2563eb; }
.notice.green { background: #e6f6ee; border-color: #a8dcc5; color: #12805c; }
.notice.orange { background: #fdf0e5; border-color: #f3c99a; color: #c2540a; }
.empty { color: #98a2b3; text-align: center; padding: 34px; font-size: 13px; }
#modalbg { position: fixed; inset: 0; background: rgba(15,20,30,.45); display: none; align-items: center; justify-content: center; z-index: 50; }
#modal { background: #fff; border-radius: 12px; padding: 22px; width: 460px; max-width: 94vw; max-height: 88vh; overflow-y: auto; }
#modal h2 { font-size: 16px; margin-bottom: 14px; }
.mini { font-size: 12px; color: #667085; }
.right { text-align: right; }
input.cell { width: 90px; padding: 5px 7px; font-size: 13px; }
select.cell { width: auto; padding: 5px 7px; font-size: 12px; }
.stepdots { display: flex; gap: 6px; margin-bottom: 16px; }
.stepdots span { width: 26px; height: 5px; border-radius: 3px; background: #e4e7ec; }
.stepdots span.on { background: #2563eb; }
.toast { position: fixed; bottom: 20px; right: 20px; background: #171c26; color: #fff; padding: 11px 18px; border-radius: 9px; font-size: 13px; z-index: 99; box-shadow: 0 6px 24px rgba(0,0,0,.25); max-width: 340px; }
.toast.ok { background: #177245; }
.toast.err { background: #b42318; }
.toast.waarschuw { background: #b45309; }
.typecard { background: #fff; border: 2px solid #e4e7ec; border-radius: 12px; padding: 26px; text-align: center; cursor: pointer; font-size: 15px; font-weight: 600; }
.typecard:hover { border-color: #4f8ef7; background: #f5f8ff; }
.typecard .big { font-size: 34px; display: block; margin-bottom: 10px; }
.copyrow { display: flex; gap: 8px; align-items: flex-start; }
.copyrow > :first-child { flex: 1; }
.fotos { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
.foto { position: relative; width: 92px; height: 92px; border-radius: 8px; overflow: hidden; border: 1px solid #e4e7ec; }
.foto img { width: 100%; height: 100%; object-fit: cover; }
.foto .del { position: absolute; top: 3px; right: 3px; background: rgba(0,0,0,.6); color: #fff; border: none; border-radius: 50%; width: 20px; height: 20px; cursor: pointer; font-size: 11px; line-height: 1; }
.exrow { display: grid; grid-template-columns: 90px 1fr 1fr 110px; gap: 10px; align-items: center; margin-bottom: 8px; font-size: 13px; }
.exrow b { font-size: 12px; color: #344054; }
tr.hl td { background: #fffaf0; }
.savebar { position: sticky; bottom: 0; background: linear-gradient(transparent, var(--bg) 30%); padding: 14px 0 4px; z-index: 5; }
#camv { width: 100%; border-radius: 10px; background: #000; max-height: 55vh; }
/* ---------- nog online zetten ---------- */
.pubcard { display: flex; gap: 14px; align-items: center; background: #fff; border: 1px solid #e4e7ec; border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; cursor: pointer; transition: border-color .15s; }
.pubcard:hover { border-color: #4f8ef7; background: #f5f8ff; }
.pubthumb { width: 56px; height: 56px; border-radius: 10px; background: #eef0f3; display: flex; align-items: center; justify-content: center; font-size: 26px; overflow: hidden; flex-shrink: 0; }
.pubthumb img { width: 100%; height: 100%; object-fit: cover; }
/* label preview */
.labprev { width: 250px; height: 129px; border: 1.5px dashed #c7cede; border-radius: 8px; padding: 9px 11px; display: flex; gap: 9px; align-items: center; background: #fff; margin: 0 auto; overflow: hidden; }
.labprev .lt { flex: 1; min-width: 0; }
.labprev .lm { font-size: 12px; font-weight: 800; line-height: 1.15; }
.labprev .ls { font-size: 9px; margin-top: 4px; line-height: 1.3; color: #333; }
.labprev .lp { font-size: 13px; font-weight: 800; margin-top: 4px; }
.labprev .ld { font-size: 9px; margin-top: 3px; font-style: italic; }
.labprev .lq { width: 68px; text-align: center; flex-shrink: 0; }
.labprev .lq img { width: 62px; height: 62px; image-rendering: pixelated; }
.labprev .ln { font-size: 10px; font-weight: 700; letter-spacing: .5px; }
/* ---------- mobiel ---------- */
@media (max-width: 760px) {
  #app { flex-direction: column; }
  #sidebar { position: fixed; bottom: 0; left: 0; right: 0; top: auto; width: 100%; height: 60px; flex-direction: row; padding: 0; z-index: 40; align-items: stretch; justify-content: space-around; border-top: 1px solid var(--line); border-right: none; }
  #sidebar .brand, .navspacer, .hidemob { display: none; }
  .navbtn { flex-direction: column; gap: 2px; padding: 7px 2px; flex: 1; align-items: center; justify-content: center; margin: 0; border-radius: 0; }
  .navbtn.active { background: none; color: var(--blue); box-shadow: none; }
  .navbtn .txt { font-size: 9px; }
  .navdot { position: absolute; top: 4px; right: 12%; margin: 0; }
  .navbtn.active .navdot { background: var(--blue); }
  #topbar { padding: 12px 14px 0; }
  .userchip div:last-child { display: none; }
  .search { max-width: none; }
  #main { padding: 16px 14px 92px; }
  .kpis { grid-template-columns: 1fr 1fr; }
  .grid2, .grid3, .grid4, .chartrow { grid-template-columns: 1fr; }
  .exrow { grid-template-columns: 1fr; border-bottom: 1px solid #f0f2f5; padding-bottom: 10px; }
  .savebar { bottom: 60px; }
  .toast { bottom: 76px; left: 14px; right: 14px; max-width: none; }
  #sidebar { background: var(--navy); }
  .navbtn.active { color: var(--actie); background: none; }
  .navbtn.active .navdot { background: var(--actie); }
}
/* Storvo-huisstijl afwerking */
#sidebar .brand { color: #F7F6F3; }
.logincard .brand { color: var(--txt); }
.logincard .btn { background: var(--actie); }
.logincard .btn:hover { background: var(--actie-d); }
.kpi { border-radius: 18px; }
h1 { font-family: 'Sora', sans-serif; }
</style>
</head>
<body>
<div id="loginwrap">
  <div class="logincard">
    <div class="mk"><svg viewBox="0 0 400 400" aria-hidden="true"><rect x="28" y="28" width="156" height="156" rx="40" fill="#0B5B52"/><rect x="216" y="28" width="156" height="156" rx="40" fill="#6A9C93"/><rect x="28" y="216" width="156" height="156" rx="40" fill="#A7C3BD"/><path d="M244 304 L284 344 L360 244" fill="none" stroke="#0B5B52" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <h2>Storvo <span>Partner</span></h2>
    <p class="lmut">Log in op je partner-dashboard</p>
    <div class="field"><label>E-mail</label><input type="email" id="loginname" placeholder="jouw@email.nl" autocomplete="email" onkeydown="if(event.key==='Enter')f('loginpin').focus()"></div>
    <div class="field"><label>Wachtwoord</label><input type="password" id="loginpin" placeholder="Wachtwoord" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <div id="loginerr">Vul je e-mail en wachtwoord in</div>
    <button class="btn" style="width:100%;justify-content:center;margin-top:6px" onclick="doLogin()">Inloggen</button>
    <div class="mini" style="margin-top:14px">Je krijgt een uitnodiging van de winkel om je account aan te maken</div>
  </div>
</div>
<div id="app">
<nav id="sidebar">
  <div class="brand">Storvo<span style="color:var(--actie)"> Partner</span></div>
  <button class="navbtn" data-p="dash" onclick="nav('dash')"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg><span class="txt">Dashboard</span></button>
  <button class="navbtn" data-p="voorraad" onclick="nav('voorraad')"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"/><path d="M3.3 8.3L12 13l8.7-4.7"/><path d="M12 22V13"/></svg><span class="txt">Voorraad</span></button>
  <button class="navbtn" data-p="add" onclick="nav('add')"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg><span class="txt">Toevoegen</span></button>
  <button class="navbtn" data-p="online" onclick="nav('online')"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg><span class="txt">Online zetten</span><span id="onlinedot" class="navdot"></span></button>
  <button class="navbtn" data-p="verkocht" onclick="nav('verkocht')"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.1V12a10 10 0 1 1-5.9-9.1"/><path d="M22 4L12 14l-3-3"/></svg><span class="txt">Verkocht</span><span id="alertdot" class="navdot"></span></button>
  <button class="navbtn" data-p="marge" onclick="nav('marge')"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.2 15.9A10 10 0 1 1 8 2.8"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg><span class="txt">Marge</span><span id="margedot" class="navdot"></span></button>
  <div class="navspacer"></div>
  <button class="navbtn" data-p="instellingen" onclick="nav('instellingen')"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span class="txt">Instellingen</span></button>
  <button class="navbtn hidemob" onclick="logout()"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg><span class="txt">Uitloggen</span></button>
</nav>

const SUPABASE_URL = 'https://ugilfxqolemxwssbpdwu.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVnaWxmeHFvbGVteHdzc2JwZHd1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3ODk1NTUsImV4cCI6MjEwMTM2NTU1NX0.7q6R7J0_U0iU6AGlxFoBHpH22cRBluapP3nOsuIssqA';
/* Gedeelde login met de winkelapp (zelfde Supabase-project, standaard opslag), net

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let PARTNER_ID = null, ACCOUNT = null;
let uitdraaiLijst = [];   // eerdere afrekenrondes uit partner_uitdraaien
let bekekenBatch = null;  // welke oude batch je nu terugkijkt op de Marge-pagina
let uitbetaaldeVerkopen = new Map();  // verkoopId -> batch-id, opgebouwd uit de historie (leidend)
let pullPromise = null, pushTimer = null, lastSyncedAt = null, pendingLocalChange = false;
let S = load();
function migrate(s){
  s.products = s.products || [];
  s.settings = Object.assign({nextAd: 1, template: '', pin: '1234', labW: 62, labH: 32}, s.settings || {});
  const today = new Date().toISOString().slice(0,10);
  s.products.forEach(p => {
    if (!p.type) p.type = 'anders';
    p.specs = p.specs || {cpu:'', ram:'', scherm:'', opslag:''};
    if (p.adKosten == null) p.adKosten = 0;
    p.fotos = p.fotos || [];
    if (!p.titel) p.titel = p.model;
    p.adsOffline = p.adsOffline || {fb:false, mp:false};
    if (p.fb && !p.fbDatum) p.fbDatum = today;
    if (p.mp && !p.mpDatum) p.mpDatum = today;
    p.units.forEach(u => {
      if (u.extra == null) u.extra = '';
      if (u.extraKosten == null) u.extraKosten = 0;
      if (u.verkocht){
        if (u.deelGezet == null) u.deelGezet = true;
        if (!u.levering) u.levering = 'ophalen';
        if (u.geleverd == null) u.geleverd = false;
        if (!u.vervoerder) u.vervoerder = 'PostNL';
        if (u.betaal === 'mp' && u.mpUitbetaald == null) u.mpUitbetaald = false;
      }
    });
  });
  return s;
}
function load(){
  let s; try { s = JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ s = {}; }
  s.ui = s.ui || {page:'dash', pageArg:null};
  s.draft = s.draft || null;
  return migrate(s);
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ toast(' Opslag vol! Verwijder een paar foto\'s.'); }
  pendingLocalChange = true;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(pushRemote, 700);
}
function setSync(state){
  const b = f('syncbadge'); if (!b) return;
  const map = { ok:['●','#16a077','Live gesynct'], syncing:['○','#e07b1f','Synchroniseren...'], offline:['●','#e5484d','Niet gesynct — lokaal opgeslagen'] };
  const m = map[state] || map.offline;
  b.style.color = m[1]; b.title = m[2]; b.textContent = m[0];
}
async function pushRemote(){
  if (!PARTNER_ID) return false;
  setSync('syncing');
  try {
    const { error } = await sb.from('partners')
      .update({ data: { products: S.products, settings: S.settings }, bijgewerkt_op: new Date().toISOString() })
      .eq('id', PARTNER_ID);
    if (error) throw error;
    pendingLocalChange = false;
    setSync('ok');
    return true;
  } catch(e){ setSync('offline'); return false; }
}
async function pullRemote(renderAfter){
  if (!PARTNER_ID){ setSync('offline'); return false; }
  try {
    const { data, error } = await sb.from('partners').select('data, bijgewerkt_op').eq('id', PARTNER_ID).maybeSingle();
    if (error) throw error;
    const d = (data && data.data && typeof data.data === 'object') ? data.data : null;
    /* niet-gesyncte lokale wijzigingen nooit overschrijven met (oudere) serverdata */
    if (!pendingLocalChange && d && (d.products || d.settings)){
      S.products = d.products || [];
      S.settings = Object.assign({nextAd:1, template:'', pin:'1234', labW:62, labH:32}, d.settings || {});
      migrate(S);
      herkenUitbetaald();   // markering "al uitbetaald" opnieuw uit de historie afleiden
      try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){}
    }
    lastSyncedAt = data ? data.bijgewerkt_op : null;
    setSync('ok');
    if (renderAfter) render();
    return true;
  } catch(e){ setSync('offline'); return false; }
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function eur(n){ return '€ ' + (Number(n)||0).toLocaleString('nl-NL',{minimumFractionDigits:2, maximumFractionDigits:2}); }
function num(v){ const n = parseFloat(String(v).replace(',','.')); return isNaN(n)?0:n; }
function norm(s){ return String(s||'').trim().toLowerCase().replace(/\s+/g,' '); }
function pad4(n){ return String(n).padStart(4,'0'); }
function f(id){ return document.getElementById(id); }
function today(){ return new Date().toISOString().slice(0,10); }
function daysSince(d){ if(!d) return 0; return Math.max(0, Math.floor((Date.now() - new Date(d+'T00:00').getTime())/DAG)); }

/* ============ berekeningen ============ */
function adShare(p){ return p.units.length ? (p.adKosten||0)/p.units.length : 0; }
function unitCost(p,u){ return (p.inkoop||0)+(p.kosten||0)+(u.extraKosten||0)+adShare(p); }
function unitWinst(p,u){
  /* In hele centen rekenen en het winkeldeel afleiden als winst - jouwdeel. Anders
     kunnen winkel en deel elk apart afronden en sluit winkel + deel niet op winst;
     dat zou in de uitdraai-historie een cent scheef vast komen te staan. */
  const w = (u.prijs||0) - unitCost(p,u);
  const winstC = Math.round(w*100);
  let deelC = 0;
  if (u.deelGezet){ const dr = u.deelType==='eur' ? (u.deelWaarde||0) : w*(u.deelWaarde||0)/100; deelC = Math.round(dr*100); }
  return { winst: winstC/100, deel: deelC/100, winkel: u.deelGezet ? (winstC-deelC)/100 : 0 };
}
function voorraadUnits(p){ return p.units.filter(u=>!u.verkocht); }
function soldUnits(p){ return p.units.filter(u=>u.verkocht); }
function allSold(){ const r=[]; S.products.forEach(p=>soldUnits(p).forEach(u=>r.push({p,u}))); r.sort((a,b)=>(b.u.datum||'').localeCompare(a.u.datum||'')); return r; }
function potWinst(p){ /* verwachte winst voorraad, zonder marge-verdeling */
  return voorraadUnits(p).reduce((a,u)=>a + (p.vraagprijs - unitCost(p,u)), 0);
}
function totals(){
  let omzet=0, inkoop=0, winst=0, winkel=0, deel=0, cash=0, bank=0, mpOnderweg=0, voorraadWaarde=0, opVoorraad=0, teVerdelen=0;
  S.products.forEach(p=>{
    p.units.forEach(u=>{
      inkoop += unitCost(p,u);
      if (u.verkocht){
        omzet += u.prijs||0;
        const w = unitWinst(p,u);
        winst += w.winst;
        if (u.deelGezet){ winkel += w.winkel; deel += w.deel; } else teVerdelen += w.winst;
        if (u.betaal==='cash') cash += u.prijs||0;
        else if (u.betaal==='mp'){ if (u.mpUitbetaald) bank += u.prijs||0; else mpOnderweg += u.prijs||0; }
        else bank += u.prijs||0;
      } else { voorraadWaarde += unitCost(p,u); opVoorraad++; }
    });
  });
  return {omzet, inkoop, winst, winkel, deel, cash, bank, mpOnderweg, voorraadWaarde, opVoorraad, teVerdelen};
}
function voorraadTotals(){
  let omzet=0, investering=0, extraK=0, winst=0;
  S.products.forEach(p=>{
    voorraadUnits(p).forEach(u=>{
      omzet += p.vraagprijs||0;
      investering += p.inkoop||0;
      extraK += (u.extraKosten||0) + adShare(p) + (p.kosten||0);
      winst += (p.vraagprijs||0) - unitCost(p,u);
    });
  });
  return {omzet, investering, extraK, winst};
}
function adsTodo(){
  return S.products.filter(p => p.units.length>0 && voorraadUnits(p).length===0 &&
    ((p.fb && !p.adsOffline.fb) || (p.mp && !p.adsOffline.mp)));
}
function onlineTodo(){
  return S.products.filter(p => voorraadUnits(p).length>0 && !p.fb && !p.mp);
}
function adsChannels(p){ const c=[]; if(p.fb&&!p.adsOffline.fb)c.push('Facebook'); if(p.mp&&!p.adsOffline.mp)c.push('Marktplaats'); return c; }
function specsLine(p){
  if (p.type!=='laptop') return '';
  return [p.specs.cpu, p.specs.ram, p.specs.opslag, p.specs.scherm].filter(Boolean).join(' · ');
}
function maxDagenOnline(p){
  let m = 0;
  if (p.fb && p.fbDatum) m = Math.max(m, daysSince(p.fbDatum));
  if (p.mp && p.mpDatum) m = Math.max(m, daysSince(p.mpDatum));
  return m;
}
function onlineBadges(p){
  const parts = [];
  if (p.fb){ const d = daysSince(p.fbDatum); parts.push('<span class="badge '+(d>=18?'b-bad':d>=14?'b-warn':'b-info')+'">FB '+d+'d</span>'); }
  if (p.mp){ const d = daysSince(p.mpDatum); parts.push('<span class="badge '+(d>=18?'b-bad':d>=14?'b-warn':'b-info')+'">MP '+d+'d</span>'); }
  return parts.join(' ') || '<span class="badge b-gray">niet online</span>';
}

/* ============ login & zoeken ============ */
let USER = null, searchQ = '';
let syncInterval = null;
async function doLogin(){
  const email = f('loginname').value.trim();
  const pw = f('loginpin').value;
  if (!email || !pw){ f('loginerr').textContent = 'Vul je e-mail en wachtwoord in'; f('loginerr').style.display='block'; return; }
  const btn = document.querySelector('.logincard .btn');
  if (btn){ btn.disabled = true; btn.textContent = 'Bezig...'; }
  const { data, error } = await sb.auth.signInWithPassword({ email, password: pw });
  if (btn){ btn.disabled = false; btn.textContent = 'Inloggen'; }
  if (error){ f('loginerr').textContent = 'E-mail of wachtwoord onjuist'; f('loginerr').style.display='block'; return; }
  await naLogin(data.session);
}
/* Na een geslaagde login: het account ophalen, zo nodig een eigen werkruimte
   aanmaken, de data laden en de app tonen. Zowel een externe partner als de
   eigenaar of een teamlid kan hier inloggen (gedeelde sessie met de winkelapp). */
async function naLogin(session){
  if (!session) return;
  const { data: acc } = await sb.from('accounts').select('id,naam,rol,team_id').eq('id', session.user.id).maybeSingle();
  if (!acc){
    f('loginerr').textContent = 'Je account is niet gevonden.';
    f('loginerr').style.display='block';
    try { await sb.auth.signOut(); } catch(e){}
    return;
  }
  ACCOUNT = acc; PARTNER_ID = acc.id; USER = acc.naam || 'Partner';
  /* Zorg dat er een werkruimte is. Een echte partner heeft die al; de eigenaar of
     een teamlid die zelf dit dashboard gebruikt, krijgt hem hier aangemaakt. De RLS
     staat alleen een eigen rij toe (id = auth.uid()). */
  try {
    const { data: bestaat } = await sb.from('partners').select('id').eq('id', acc.id).maybeSingle();
    if (!bestaat) await sb.from('partners').insert({ id: acc.id, team_id: acc.team_id || null, naam: acc.naam || 'Partner', data: {} });
  } catch(e){}
  f('loginerr').style.display='none'; f('loginpin').value='';
  f('loginwrap').style.display='none'; f('app').style.display='flex';
  await pullRemote(false);
  await laadUitdraaien();
  applyUser(); render();
  clearInterval(syncInterval);
  syncInterval = setInterval(()=>{ pendingLocalChange ? pushRemote() : pullRemote(page==='dash'); }, 25000);
}
function applyUser(){
  if (!USER) return;
  f('uava').textContent = USER[0].toUpperCase();
  f('uname').textContent = USER;
}
async function logout(){
  clearInterval(syncInterval);
  try { await sb.auth.signOut(); } catch(e){}
  USER = null; PARTNER_ID = null; ACCOUNT = null;
  f('app').style.display='none'; f('loginwrap').style.display='flex';
}
document.addEventListener('visibilitychange', ()=>{ if (!document.hidden && USER) pullRemote(page==='dash'); });
function doSearch(){ searchQ = f('q').value.trim(); nav('voorraad'); }
function clearSearch(){ searchQ = ''; if (f('q')) f('q').value = ''; nav('voorraad'); }

/* ============ router ============ */
let page = 'dash', pageArg = null;
function nav(p, arg){
  page = p; pageArg = arg==null?null:arg;
  bekekenBatch = null;   // een oude uitdraai-batch bekijk je alleen zolang je op Marge blijft
  S.ui = {page, pageArg}; save();
  render();
}
function render(){
  document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active', b.dataset.p===page || (page==='product'&&b.dataset.p==='voorraad')));
  const todo = adsTodo().length, otodo = onlineTodo().length;
  const mtodo = allSold().filter(r=>!r.u.deelGezet).length;
  const setDot = (id,n)=>{ const el=f(id); el.style.display = n?'flex':'none'; el.textContent = n; };
  setDot('alertdot', todo); setDot('onlinedot', otodo); setDot('margedot', mtodo);
  setDot('belldot', todo + otodo + mtodo);
  const m = f('main');
  if (page==='dash') m.innerHTML = rDash();
  else if (page==='voorraad') m.innerHTML = rVoorraad();
  else if (page==='add') m.innerHTML = rAdd();
  else if (page==='online') m.innerHTML = rOnline(pageArg);
  else if (page==='verkocht') m.innerHTML = rVerkocht();
  else if (page==='marge') m.innerHTML = rMarge();
  else if (page==='product') m.innerHTML = rProduct(pageArg);
  else if (page==='instellingen') m.innerHTML = rSettings();
  window.scrollTo(0,0);
}
function toast(msg, type){
  /* type: 'fout' (rood), 'let-op' (amber), iets anders truthy (groen/ok), leeg (neutraal).
     Zo is een mislukte geldhandeling ook aan de kleur te zien, niet alleen aan de tekst. */
  const kl = type==='fout' ? ' err' : (type==='let-op' ? ' waarschuw' : (type ? ' ok' : ''));
  const t = document.createElement('div'); t.className='toast'+kl; t.textContent = msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(), 4000);
}
async function copyTxt(id){
  const el = f(id); const t = el.value!==undefined ? el.value : el.textContent;
  try { await navigator.clipboard.writeText(t); }
  catch(e){ if(el.select){ el.select(); document.execCommand('copy'); } }
  toast(' Gekopieerd!');
}

const KICONS = {
  blue: '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>',
  green: '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 6l-9.5 9.5-5-5L1 18"/><path d="M17 6h6v6"/></svg>',
  orange: '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 1v22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>',
  purple: '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2"/><path d="M1 10h22"/></svg>',
  red: '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>',
  '': '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"/><path d="M3.3 8.3L12 13l8.7-4.7"/><path d="M12 22V13"/></svg>'
};
function kpi(l,v,c){ return '<div class="kpi '+(c||'')+'"><div class="kico">'+(KICONS[c||'']||KICONS[''])+'</div><div><div class="lbl">'+l+'</div><div class="val">'+v+'</div></div></div>'; }
const MND = ['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
function monthChart(title, mode, color){
  const now = new Date(), cols = [];
  let vals = [];
  for (let i=8; i>=0; i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    const pref = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    let sum = 0;
    allSold().forEach(({p,u})=>{
      if ((u.datum||'').slice(0,7) === pref) sum += mode==='winst' ? unitWinst(p,u).winst : (u.prijs||0);
    });
    cols.push({d, sum});
  }
  const max = Math.max(1, ...cols.map(c=>c.sum));
  const bars = cols.map((c,i)=>
    '<div class="cb'+(i===cols.length-1?' hot':'')+(color==='green'?' green':'')+'"><span class="tip">'+eur(c.sum)+'</span>' +
    '<div class="bar" style="height:'+Math.max(4, Math.round(c.sum/max*82))+'%"></div>' +
    '<span class="m">'+MND[c.d.getMonth()]+'</span></div>').join('');
  return '<div class="card" style="margin-bottom:0"><div class="mini" style="font-weight:600">'+title+'</div>' +
    '<div style="font-size:23px;font-weight:800;margin-top:2px">'+eur(cols[cols.length-1].sum)+'<span class="mini" style="font-weight:600"> deze maand</span></div>' +
    '<div class="chart">'+bars+'</div></div>';
}
function adsWarnHtml(){
  const todo = adsTodo();
  if (!todo.length) return '';
  return '<div class="notice"> Ads offline halen: ' + todo.map(p=>
    '<a href="#" onclick="adsPopup(\''+p.id+'\');return false;" style="color:inherit;font-weight:600">'+esc(p.model)+'</a> ('+adsChannels(p).join(' & ')+')'
  ).join(' · ') + '</div>';
}
function rDash(){
  const t = totals();
  let extra = '';
  const ot = onlineTodo();
  if (ot.length) extra += '<div class="notice blue"> <b>'+ot.length+'</b> product'+(ot.length===1?'':'en')+' nog online zetten — <a href="#" onclick="nav(\'online\');return false;" style="color:inherit;font-weight:600">naar Online zetten</a></div>';
  if (t.teVerdelen > 0) extra += '<div class="notice orange"> <b>'+eur(t.teVerdelen)+'</b> winst nog te verdelen — <a href="#" onclick="nav(\'marge\');return false;" style="color:inherit;font-weight:600">Marge berekening</a></div>';
  return '<h1>Dashboard</h1><div class="sub">Overzicht van de handel</div>' + adsWarnHtml() + extra +
  '<div class="kpis">' +
    kpi('Omzet', eur(t.omzet), 'blue') + kpi('Inkoop totaal', eur(t.inkoop), '') +
    kpi('Winst', eur(t.winst), 'green') + kpi('Voor de winkel', eur(t.winkel), 'green') + kpi('Jouw winst', eur(t.deel), 'green') +
  '</div><div class="kpis">' +
    kpi('Cash', eur(t.cash), 'orange') + kpi('Bank', eur(t.bank), 'purple') +
    (t.mpOnderweg>0 ? kpi('MP nog uit te betalen', eur(t.mpOnderweg), 'red') : '') +
    kpi('Op voorraad', t.opVoorraad + ' stuks', '') + kpi('Voorraadwaarde', eur(t.voorraadWaarde), '') +
  '</div>' +
  '<div class="chartrow">' + monthChart('Omzet per maand', 'omzet') + monthChart('Winst per maand', 'winst', 'green') + '</div>' +
  '<div class="card"><b style="font-size:14px">Laatste verkopen</b>' + lastSales() + '</div>';
}
function lastSales(){
  const rows = allSold().slice(0,5);
  if (!rows.length) return '<div class="empty">Nog geen verkopen</div>';
  return '<div class="tablewrap" style="margin-top:10px"><table><tr><th>Model</th><th>Datum</th><th class="right">Verkoopprijs</th><th class="right">Winst</th><th>Betaald</th></tr>' +
    rows.map(({p,u})=>{ const w=unitWinst(p,u);
      return '<tr class="click" onclick="nav(\'product\',\''+p.id+'\')"><td>'+esc(p.model)+'</td><td>'+esc(u.datum||'')+'</td><td class="right">'+eur(u.prijs)+'</td><td class="right">'+eur(w.winst)+'</td><td>'+betaalLabel(u)+'</td></tr>';
    }).join('') + '</table></div>';
}

  const units = voorraadUnits(p);

  if (!units.length) return '<span class="badge b-gray">—</span>';
  if (!def.length) return '<span class="badge b-ok">Allemaal in orde</span>';
  if (def.length === units.length){
    const txt = def.length===1 ? esc(def[0].defect) : 'Alle '+def.length+' met defect';
    return '<span class="badge b-bad"> '+txt+'</span>';
  }
  return '<span class="badge b-warn"> '+def.length+' van '+units.length+' met defect — rest in orde</span>';

/* ============ foto's & camera ============ */
let fotoTarget = null, fotoAfter = null, camStream = null, camTarget = null, camAfter = null;
function fotoPick(input){
  const files = Array.from(input.files||[]); input.value = '';
  if (!files.length || !fotoTarget) return;
  let left = files.length;
  files.forEach(file=>{
    const rd = new FileReader();
    rd.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        fotoTarget.push(shrink(img));
        if (--left===0){ if (fotoAfter) fotoAfter(); else { save(); render(); } }
      };
      img.src = e.target.result;
    };
    rd.readAsDataURL(file);
  });
}
function shrink(img){
  const max = 900; let w = img.width||img.videoWidth, h = img.height||img.videoHeight;
  if (w>max||h>max){ const s = max/Math.max(w,h); w=Math.round(w*s); h=Math.round(h*s); }
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  c.getContext('2d').drawImage(img,0,0,w,h);
  return c.toDataURL('image/jpeg',0.72);
}
function openCam(targetArr, afterFn){
  camTarget = targetArr; camAfter = afterFn;
  const m = f('modal');
  m.innerHTML = '<h2> Foto maken</h2><video id="camv" autoplay playsinline muted></video>' +
    '<div style="display:flex;gap:8px;justify-content:center;margin-top:12px">' +
    '<button class="btn" onclick="camSnap()"> Vastleggen</button>' +
    '<button class="btn gray" onclick="closeCam()">Klaar</button></div>' +
    '<div class="mini" style="text-align:center;margin-top:8px" id="camcount"></div>';
  f('modalbg').style.display = 'flex';
  navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}, audio:false})
    .then(s=>{ camStream = s; f('camv').srcObject = s; })
    .catch(()=>{ /* geen camera-toegang → val terug op systeem-camera via bestand */
      closeCam();
      fotoTarget = targetArr; fotoAfter = afterFn;
      f('camIn').click();
    });
}
function camSnap(){
  const v = f('camv');
  if (!v || !v.videoWidth){ toast('Camera nog niet klaar...'); return; }
  camTarget.push(shrink(v));
  f('camcount').textContent = ' foto toegevoegd';

}
function closeCam(){
  if (camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream = null; }

}

function saveOnline(pid, silent){
  const p = S.products.find(x=>x.id===pid);
  if (!f('o_titel')) return;
  p.titel = f('o_titel').value.trim();
  p.adtekst = f('o_tekst').value;
  p.adKosten = num(f('o_adk').value);
  const nfb = f('o_fb').checked, nmp = f('o_mp').checked;
  const td = today();
  if (nfb && !p.fb) p.fbDatum = td; if (!nfb) p.fbDatum = null;
  if (nmp && !p.mp) p.mpDatum = td; if (!nmp) p.mpDatum = null;
  p.fb = nfb; p.mp = nmp;
  if (!p.fb) p.adsOffline.fb = false;
  if (!p.mp) p.adsOffline.mp = false;
  save();
  if (!silent){
    if (nfb || nmp){ toast(' '+p.model+' staat online!'); nav('online'); }
    else { toast(' Opgeslagen — nog niet online gezet'); nav('online'); }
  }
}

  save(); toast(' Online-datum gereset naar vandaag'); render();
}
function saveProduct(pid, silent){
  const p = S.products.find(x=>x.id===pid);
  if (!f('e_ad')) return;
  p.adnummer = f('e_ad').value.trim(); p.vraagprijs = num(f('e_prijs').value); p.adKosten = num(f('e_adk').value);
  if (p.type==='laptop' && f('e_cpu')) p.specs = {cpu:f('e_cpu').value.trim(), ram:f('e_ram').value.trim(), opslag:f('e_opslag').value.trim(), scherm:f('e_scherm').value.trim()};
  p.titel = f('e_titel').value.trim(); p.adtekst = f('e_tekst').value;
  const nfb = f('e_fb').checked, nmp = f('e_mp').checked;
  if (nfb && !p.fb) p.fbDatum = today(); if (!nfb) p.fbDatum = null;
  if (nmp && !p.mp) p.mpDatum = today(); if (!nmp) p.mpDatum = null;
  p.fb = nfb; p.mp = nmp;
  if (f('e_fboff')) p.adsOffline.fb = f('e_fboff').checked; if (!p.fb) p.adsOffline.fb = false;

    '<div class="field"><label>Levering</label><select id="m_lev" onchange="f(\'m_vvbox\').style.display=this.value===\'verzenden\'?\'block\':\'none\'"><option value="ophalen"'+(u.levering!=='verzenden'?' selected':'')+'> Ophalen</option><option value="verzenden"'+(u.levering==='verzenden'?' selected':'')+'> Verzenden</option></select></div></div>' +
    '<div class="field" id="m_mpbox" style="display:'+(u.betaal==='mp'?'block':'none')+'"><div class="checkrow"><input type="checkbox" id="m_mpu"'+(u.mpUitbetaald?' checked':'')+'> <span>Marktplaats heeft al uitbetaald</span></div></div>' +
    '<div class="field" id="m_vvbox" style="display:'+(u.levering==='verzenden'?'block':'none')+'"><label>Vervoerder</label><select id="m_vv"><option'+(u.vervoerder!=='DHL'?' selected':'')+'>PostNL</option><option'+(u.vervoerder==='DHL'?' selected':'')+'>DHL</option></select></div>' +
    '<div class="notice blue" style="margin-top:6px">Je winstdeel bepaal je straks op de pagina <b>Marge berekening</b>.</div>' +
    '<div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap">' +
    (u.verkocht?'<button class="btn gray" onclick="unsell(\''+pid+'\',\''+uidv+'\')">↩ Terug naar voorraad</button>':'') +
    '<button class="btn gray" onclick="closeModal()">Annuleren</button>' +
    '<button class="btn green" onclick="confirmSell(\''+pid+'\',\''+uidv+'\')">'+(u.verkocht?'Opslaan':' Verkocht')+'</button></div>';
  f('modalbg').style.display = 'flex';
}
function confirmSell(pid, uidv){
  const p = S.products.find(x=>x.id===pid), u = p.units.find(x=>x.id===uidv);
  const wasSold = u.verkocht;
  u.verkocht = true; u.prijs = num(f('m_prijs').value); u.betaal = f('m_betaal').value;
  u.mpUitbetaald = u.betaal==='mp' ? f('m_mpu').checked : undefined;
  u.levering = f('m_lev').value; u.vervoerder = f('m_vv').value; if (u.geleverd==null) u.geleverd = false;
  if (!u.datum) u.datum = today();
  /* Een vaste sleutel per verkoop. Die komt in de uitdraai-historie te staan, zodat een
     verkoop nooit twee keer wordt afgerekend, ook niet als de blob-markering verdwijnt. */
  if (!u.verkoopId) u.verkoopId = uid();
  save(); closeModal();
  const rest = voorraadUnits(p).length;
  if (!wasSold){
    if (rest === 0 && adsChannels(p).length){ adsPopup(pid); }
    else if (rest === 0) toast(' Laatste exemplaar verkocht!');
    else toast('Verkocht! Nog '+rest+' van dit model beschikbaar.');
  }
  render();
}
function unsell(pid, uidv){
  const p = S.products.find(x=>x.id===pid), u = p.units.find(x=>x.id===uidv);
  u.verkocht=false; u.prijs=null; u.datum=null; u.betaal=null; u.deelGezet=false; u.mpUitbetaald=undefined;
  /* Verkoop-sleutel en uitdraai-stempels wissen: gaat hij terug naar voorraad en later
     opnieuw de deur uit, dan is dat een nieuwe verkoop die weer afgerekend moet worden.
     De oude batch in de historie blijft die verkoop als momentopname tonen. */
  u.verkoopId=undefined; u.uitgedraaid=undefined; u.uitgedraaidOp=undefined;
  p.adsOffline={fb:false,mp:false};
  save(); closeModal(); render();
}
function adsPopup(pid){
  const p = S.products.find(x=>x.id===pid);
  const m = f('modal');

/* ============ marge en uitbetalen ============
   De verkopen die verdeeld zijn maar nog niet afgerekend staan hier klaar. Zodra je
   ze uitbetaalt ("uitdraaien") gaan ze als een gedateerde batch naar de historie
   (echte tabel partner_uitdraaien) en verdwijnen ze uit deze werklijst. Zo hoef je
   niet meer door alle oude verkopen te scrollen en kun je elke afrekenronde
   terugkijken. */
async function laadUitdraaien(){
  if (!PARTNER_ID) return;
  try {
    const { data } = await sb.from('partner_uitdraaien')
      .select('*').eq('werkruimte_id', PARTNER_ID).order('datum', { ascending:false });
    uitdraaiLijst = data || [];
  } catch(e){ /* offline: laat de al geladen lijst staan */ }
  herkenUitbetaald();
}
/* De historie (echte tabel) is leidend voor "al uitbetaald", niet de fragiele blob.
   We bouwen een map verkoopId -> batch, en herstellen zo een markering die door een
   mislukte of overschreven blob-push zou zijn weggevallen. Zo kan een verkoop nooit
   twee keer worden afgerekend, ook niet na een herlaad of op een tweede apparaat. */
function herkenUitbetaald(){
  uitbetaaldeVerkopen = new Map();
  uitdraaiLijst.forEach(b => (b.regels||[]).forEach(r => { if (r.verkoopId) uitbetaaldeVerkopen.set(r.verkoopId, b.id); }));
  S.products.forEach(p => p.units.forEach(u => {
    if (u.verkoopId && uitbetaaldeVerkopen.has(u.verkoopId) && !u.uitgedraaid) u.uitgedraaid = uitbetaaldeVerkopen.get(u.verkoopId);
  }));
}
function isUitbetaald(u){ return !!u.uitgedraaid || !!(u.verkoopId && uitbetaaldeVerkopen.has(u.verkoopId)); }
/* De verkochte units die nog niet uitgedraaid (afgerekend) zijn, nieuwste eerst. */
function margeRijen(){ return allSold().filter(r => !isUitbetaald(r.u)); }

function rMarge(){
  if (bekekenBatch) return rUitdraaiBatch(bekekenBatch);
  const rows = margeRijen();
  const open = rows.filter(r=>!r.u.deelGezet).length;
  let html = '<h1>Marge en uitbetalen</h1><div class="sub">Vul per verkocht artikel de echte verkoopprijs en je verdeling in. Alles rekent direct door. Klaar met een ronde? Draai hem uit, dan is hij afgerekend en verdwijnt hij hier.</div>';

  if (uitdraaiLijst.length){
    html += '<div class="card" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">' +
      '<b style="font-size:14px">Eerdere uitdraaien</b>' +
      '<select class="cell" style="max-width:360px" onchange="if(this.value)toonUitdraai(this.value)">' +
      '<option value="">Kies een afrekenronde om terug te kijken...</option>' +
      uitdraaiLijst.map(b=>'<option value="'+b.id+'">'+esc(batchLabel(b))+'</option>').join('') +
      '</select></div>';
  }

  if (open) html += '<div class="notice orange">Nog <b>'+open+'</b> verk'+(open===1?'oop':'open')+' zonder verdeling. Vul de verdeling in; alleen verdeelde verkopen kun je uitdraaien.</div>';
  if (!rows.length) return html + '<div class="card"><div class="empty">Niets openstaand. Alles is uitbetaald.</div></div>';

  html += '<div class="tablewrap"><table><tr><th>Status</th><th>Model</th><th>Productnr</th><th class="right">Kosten p/st</th><th class="right">Werkelijke verkoopprijs</th><th>Jouw deel</th><th class="right">Winst</th><th class="right">Winkel</th><th class="right">Jij</th></tr>';
  rows.forEach(({p,u})=>{
    const w = unitWinst(p,u);
    html += '<tr'+(!u.deelGezet?' class="hl"':'')+' id="mr_'+u.id+'"><td id="ms_'+u.id+'">'+(u.deelGezet?'<span class="badge b-ok">verdeeld</span>':'<span class="badge b-purple">nog verdelen</span>')+'</td><td><b>'+esc(p.model)+'</b></td><td>'+esc(p.adnummer)+'</td><td class="right">'+eur(unitCost(p,u))+'</td>' +
      '<td class="right"><input class="cell" type="number" step="0.01" value="'+u.prijs+'" onchange="mUpd(\''+p.id+'\',\''+u.id+'\')" id="mp_'+u.id+'"></td>' +
      '<td><select class="cell" id="mt_'+u.id+'" onchange="mUpd(\''+p.id+'\',\''+u.id+'\')"><option value="pct"'+(u.deelType!=='eur'?' selected':'')+'>%</option><option value="eur"'+(u.deelType==='eur'?' selected':'')+'>€</option></select> ' +
      '<input class="cell" style="width:70px" type="number" step="0.01" value="'+u.deelWaarde+'" onchange="mUpd(\''+p.id+'\',\''+u.id+'\')" id="mw_'+u.id+'"></td>' +
      '<td class="right" id="mwin_'+u.id+'">'+eur(w.winst)+'</td><td class="right" id="mwinkel_'+u.id+'">'+(u.deelGezet?eur(w.winkel):'—')+'</td><td class="right" id="mdeel_'+u.id+'"><b>'+(u.deelGezet?eur(w.deel):'—')+'</b></td></tr>';
  });
  html += '</table></div><div class="card" style="margin-top:16px" id="mtot">'+margeTotals()+'</div>';
  return html;
}
/* Totalen over de openstaande (nog niet uitgedraaide) verkopen, plus de uitdraaiknop. */
function margeTotals(){
  const klaar = margeRijen().filter(r=>r.u.deelGezet);
  let winst=0, winkel=0, deel=0;
  klaar.forEach(({p,u})=>{ const w=unitWinst(p,u); winst+=w.winst; winkel+=w.winkel; deel+=w.deel; });
  const teVerdelen = margeRijen().filter(r=>!r.u.deelGezet).length;
  let html = '<div style="display:flex;gap:30px;flex-wrap:wrap;font-size:14px;margin-bottom:14px"><span>Klaar om uit te betalen: <b>'+klaar.length+'</b></span><span>Winst: <b>'+eur(winst)+'</b></span><span>Winkel: <b>'+eur(winkel)+'</b></span><span>Jij: <b>'+eur(deel)+'</b></span>' + (teVerdelen>0?'<span style="color:#c2540a">Nog te verdelen: <b>'+teVerdelen+'</b></span>':'') + '</div>';
  html += '<button class="btn green" onclick="uitDraaien(this)"'+(klaar.length?'':' disabled')+'>Uitdraaien'+(klaar.length?' (' + klaar.length + ' artikel'+(klaar.length===1?'':'en')+', '+eur(deel)+' voor jou)':'')+'</button>';
  html += '<div class="mini" style="margin-top:8px">Uitdraaien betaalt de verdeelde verkopen af: ze gaan naar de historie en verdwijnen uit deze lijst.</div>';
  return html;
}
function mUpd(pid, uidv){
  const p = S.products.find(x=>x.id===pid), u = p.units.find(x=>x.id===uidv);
  u.prijs = num(f('mp_'+uidv).value);
  u.deelType = f('mt_'+uidv).value;
  u.deelWaarde = num(f('mw_'+uidv).value);
  u.deelGezet = true;
  save();
  const w = unitWinst(p,u);
  f('mr_'+uidv).classList.remove('hl');
  f('ms_'+uidv).innerHTML = '<span class="badge b-ok">verdeeld</span>';
  f('mwin_'+uidv).innerHTML = eur(w.winst);
  f('mwinkel_'+uidv).innerHTML = eur(w.winkel);
  f('mdeel_'+uidv).innerHTML = '<b>'+eur(w.deel)+'</b>';
  f('mtot').innerHTML = margeTotals();
}
/* Een afrekenronde uitdraaien: de verdeelde, nog niet uitbetaalde verkopen als een
   gedateerde batch wegschrijven (echte tabel), ze markeren, en uit de lijst halen. */
async function uitDraaien(knop){
  const klaar = [];
  S.products.forEach(p=>p.units.forEach(u=>{ if (u.verkocht && u.deelGezet && !isUitbetaald(u)) klaar.push({p,u}); }));
  if (!klaar.length){ toast('Niets om uit te draaien','let-op'); return; }
  /* Oude verkopen zonder sleutel (van voor deze functie) krijgen er nu een, zodat de
     historie ze eenduidig vasthoudt en ze niet nog eens kunnen worden afgerekend. */
  klaar.forEach(({u})=>{ if (!u.verkoopId) u.verkoopId = uid(); });
  const regels = klaar.map(({p,u})=>{ const w=unitWinst(p,u); return { verkoopId:u.verkoopId, productId:p.id, unitId:u.id, model:p.model, adnummer:p.adnummer, verkoopprijs:u.prijs||0, kosten:Math.round(unitCost(p,u)*100)/100, winst:w.winst, winkel:w.winkel, deel:w.deel, betaal:u.betaal||null, verkocht_op:u.datum||null }; });
  const totalen = regels.reduce((t,r)=>({ omzet:t.omzet+r.verkoopprijs, winst:t.winst+r.winst, winkel:t.winkel+r.winkel, deel:t.deel+r.deel, aantal:t.aantal+1 }), {omzet:0,winst:0,winkel:0,deel:0,aantal:0});
  ['omzet','winst','winkel','deel'].forEach(k=>{ totalen[k]=Math.round(totalen[k]*100)/100; });
  if (!confirm('Deze '+totalen.aantal+' verkopen afrekenen en uitdraaien? Ze verdwijnen daarna uit deze lijst en komen in de historie.')) return;
  const oud = knop?knop.textContent:''; if (knop){ knop.disabled=true; knop.textContent='Bezig...'; }
  try {
    const { data, error } = await sb.from('partner_uitdraaien')
      .insert({ werkruimte_id: PARTNER_ID, door: USER || null, regels, totalen }).select().single();
    if (error) throw error;
    const stempel = data.datum || new Date().toISOString();
    klaar.forEach(({u})=>{ u.uitgedraaid = data.id; u.uitgedraaidOp = stempel; });
    uitdraaiLijst.unshift(data);
    herkenUitbetaald();
    save();
    const gesynct = await pushRemote();
    toast(gesynct
      ? ('Uitgedraaid: '+totalen.aantal+' artikel'+(totalen.aantal===1?'':'en'))
      : 'Uitgedraaid en vastgelegd. Nog niet gesynct, controleer je verbinding.',
      gesynct ? true : 'let-op');
    render();
  } catch(e){ if(knop){ knop.disabled=false; knop.textContent=oud; } toast('Uitdraaien mislukt','fout'); }
}
function batchLabel(b){
  const d = new Date(b.datum);
  const dt = isNaN(d.getTime()) ? '' : d.toLocaleDateString('nl-NL',{day:'numeric',month:'long',year:'numeric'});
  const t = b.totalen||{};
  return dt+' | '+(t.aantal||0)+' artikel'+((t.aantal||0)===1?'':'en')+', '+eur(t.deel||0)+' voor jou';
}

function sluitUitdraai(){ bekekenBatch = null; render(); }

  regels.forEach(r=>{
    html += '<tr><td><b>'+esc(r.model)+'</b></td><td>'+esc(r.adnummer||'')+'</td><td>'+esc(r.verkocht_op||'')+'</td><td class="right">'+eur(r.kosten||0)+'</td><td class="right">'+eur(r.verkoopprijs||0)+'</td><td class="right">'+eur(r.winst||0)+'</td><td class="right">'+eur(r.winkel||0)+'</td><td class="right"><b>'+eur(r.deel||0)+'</b></td></tr>';

async function maakVersie(){
  if (!PARTNER_ID) return false;
  const snap = { products: S.products, settings: S.settings };
  try {
    await sb.from('partner_versies').insert({ partner_id: PARTNER_ID, snapshot: snap, saved_by: USER, grootte: JSON.stringify(snap).length });
    return true;
  } catch(e){ return false; }
}
async function bewaarVersie(){
  toast(await maakVersie() ? 'Versie bewaard' : 'Bewaren mislukt');
  loadVersions();
}
async function loadVersions(){
  const box = f('verslist'); if (!box) return;
  box.innerHTML = '<div class="mini">Laden...</div>';
  try {
    const { data, error } = await sb.from('partner_versies')
      .select('id, saved_at, saved_by, grootte').eq('partner_id', PARTNER_ID)
      .order('saved_at', { ascending:false }).limit(20);
    if (error) throw error;
    const rows = data || [];
    if (!rows.length){ box.innerHTML = '<div class="mini">Nog geen eerdere versies opgeslagen.</div>'; return; }
    box.innerHTML = '<div class="tablewrap"><table><tr><th>Opgeslagen op</th><th>Door</th><th class="right">Grootte</th><th></th></tr>' +
      rows.map(v => '<tr><td>'+esc(new Date(v.saved_at).toLocaleString('nl-NL'))+'</td><td>'+esc(v.saved_by||'—')+'</td><td class="right">'+Math.round((v.grootte||0)/1024)+' KB</td>' +
        '<td><button class="btn gray sm" onclick="restoreVersion(\''+v.id+'\')">Herstel</button></td></tr>').join('') + '</table></div>';
  } catch(e){ box.innerHTML = '<div class="notice">Kon versies niet laden — controleer de verbinding.</div>'; }
}
async function restoreVersion(id){
  if (!confirm('Deze versie terugzetten? De huidige data wordt eerst zelf ook als back-up bewaard.')) return;
  try {
    await maakVersie();
    const { data, error } = await sb.from('partner_versies').select('snapshot').eq('id', id).maybeSingle();
    if (error || !data || !data.snapshot) throw new Error('niet gevonden');
    S.products = data.snapshot.products || [];
    S.settings = Object.assign({nextAd:1, template:'', pin:'1234', labW:62, labH:32}, data.snapshot.settings || {});
    migrate(S);
    save();
    toast('Versie hersteld');
    nav('instellingen');
  } catch(e){ toast('Herstellen mislukt'); }
}
function saveSettings(){
  S.settings.nextAd = Math.max(1, parseInt(f('s_next').value)||1);
  S.settings.template = f('s_tpl').value;
  S.settings.labW = Math.min(102, Math.max(20, num(f('s_labw').value) || 62));
  S.settings.labH = Math.min(100, Math.max(15, num(f('s_labh').value) || 32));
  save(); toast(' Instellingen opgeslagen'); render();
}
function exportData(){
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(S, null, 2));
  a.download = 'handel-backup-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
}

/* ============ start: sessie herstellen ============ */
if (S.draft && S.draft.data){ addData = S.draft.data; addStep = Math.min(1, S.draft.step||0); }
page = (S.ui && S.ui.page) || 'dash';
pageArg = (S.ui && S.ui.pageArg) || null;
if (page==='product' && !S.products.find(x=>x.id===pageArg)) page = 'dash';
/* Toon eerst het loginscherm; als er nog een geldige partner-sessie is, gaan we door. */
f('app').style.display='none'; f('loginwrap').style.display='flex';
(async () => {
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (session) await naLogin(session);
  } catch(e){}
})();
</script>
