<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Foto's maken · Storvo</title>
<link rel="icon" href="/merk/app-icoon.svg">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Sora:wght@700;800&display=swap" rel="stylesheet">
<style>
/* Foto's maken met de telefoon voor een advertentie in het partner-dashboard.
   Geen inloggen: werkt op een code (30 min geldig) uit de QR op de pc. */
:root{
  --groen:#0B5B52; --oranje:#E88A1D; --bg:#F7F6F3; --card:#fff; --border:#ECEAE4;
  --tekst:#17201E; --muted:#5B6663; --muted-l:#8A938F;
  --green-soft:#E3F4EC; --green-tekst:#177A51; --red-tekst:#A33333; --pil:100px;
}
*{box-sizing:border-box; margin:0; padding:0;}
[hidden]{display:none !important;}
body{font-family:'Instrument Sans',system-ui,sans-serif; background:var(--bg); color:var(--tekst);
  font-size:16px; line-height:1.6; padding:20px 18px calc(20px + env(safe-area-inset-bottom));
  max-width:560px; margin:0 auto;}
h1{font-family:'Sora',sans-serif; font-size:22px; font-weight:800; letter-spacing:-.02em;}
.kop{display:flex; align-items:center; gap:12px; margin-bottom:6px;}
.kop .mark{width:34px; height:34px; flex:none;}
.muted{color:var(--muted);}
.klein{font-size:13.5px;}
.kaart{background:var(--card); border-radius:20px; padding:20px; margin-top:16px;
  box-shadow:0 6px 24px rgba(23,32,30,.07);}
.btn{display:flex; align-items:center; justify-content:center; gap:9px; width:100%;
  padding:16px 20px; border:none; border-radius:var(--pil); font-family:inherit;
  font-size:16px; font-weight:700; cursor:pointer; background:var(--oranje); color:#fff;}
.btn:disabled{opacity:.5;}
label{display:block; font-size:12.5px; font-weight:700; color:var(--muted); margin-bottom:8px;}
.grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:14px;}
.grid img{width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:12px;}
#toasts{position:fixed; left:16px; right:16px; bottom:16px; display:flex; flex-direction:column; gap:8px;}
.toast{background:var(--tekst); color:#fff; padding:13px 18px; border-radius:14px; font-size:14.5px;}
.toast.ok{background:var(--green-tekst);}
.toast.fout{background:var(--red-tekst);}
</style>
</head>
<body>

<div class="kop">
  <div class="mark" id="merkVlak"></div>
  <div><h1>Foto's maken</h1></div>
</div>
<p class="muted klein" id="watIsHet">Bezig met openen…</p>

<div id="werk" hidden>
  <div class="kaart">
    <label>Maak of kies foto's van dit toestel</label>
    <button class="btn" id="maakKnop" onclick="document.getElementById('camera').click()">
      <svg viewBox="0 0 24 24" style="width:20px;height:20px" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      Foto toevoegen
    </button>
    <p class="muted klein" style="margin-top:10px"><b id="teller">0</b> foto's verstuurd. Ze staan meteen op de pc bij de advertentie. Je kunt er zo veel maken als je wilt; sluit dit venster als je klaar bent.</p>
    <div class="grid" id="rooster"></div>
  </div>
</div>

<div class="kaart" id="fout" hidden>
  <b id="foutKop"></b>
  <p class="muted klein" id="foutTekst" style="margin-top:6px"></p>
</div>

<input type="file" accept="image/*" capture="environment" id="camera" multiple hidden>
<div id="toasts"></div>

<script>
const SUPABASE_URL='https://ugilfxqolemxwssbpdwu.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVnaWxmeHFvbGVteHdzc2JwZHd1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3ODk1NTUsImV4cCI6MjEwMTM2NTU1NX0.7q6R7J0_U0iU6AGlxFoBHpH22cRBluapP3nOsuIssqA';

const code=new URLSearchParams(location.search).get('c');
let aantal=0;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(bericht, soort){
  const c=document.getElementById('toasts');
  const t=document.createElement('div'); t.className='toast '+(soort||''); t.textContent=bericht;
  c.appendChild(t); setTimeout(()=>t.remove(), 3000);
}
function stop(kop, tekst){
  document.getElementById('watIsHet').textContent='';
  document.getElementById('foutKop').textContent=kop;
  document.getElementById('foutTekst').textContent=tekst;
  document.getElementById('fout').hidden=false;
}
document.getElementById('merkVlak').innerHTML=
  `<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
    <rect x="3" y="3" width="19" height="19" rx="5" fill="#0B5B52"/>
    <rect x="26" y="3" width="19" height="19" rx="5" fill="#6A9C93"/>
    <rect x="3" y="26" width="19" height="19" rx="5" fill="#A7C3BD"/>
    <path d="M28 36.5 L33 41.5 L44 28" fill="none" stroke="#0B5B52" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;

async function praat(lijf){
  const res=await fetch(SUPABASE_URL+'/functions/v1/partner-foto',{
    method:'POST', headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON_KEY},
    body:JSON.stringify(Object.assign({code}, lijf))
  });
  const uit=await res.json().catch(()=>({}));
  if(!res.ok||!uit.ok) throw new Error(uit.error||'Er ging iets mis');
  return uit;
}

async function start(){
  if(!code){ stop('Geen code','Scan de QR-code opnieuw vanaf je computer.'); return; }
  try{
    const uit=await praat({actie:'kijken'});
    document.getElementById('watIsHet').innerHTML='<b>'+esc((uit.product&&uit.product.model)||'Toestel')+'</b> — maak hieronder de foto\'s.';
    document.getElementById('werk').hidden=false;
  }catch(e){ stop('Dit werkt niet meer', e.message); }
}

document.getElementById('camera').addEventListener('change', async e=>{
  const bestanden=[...(e.target.files||[])]; e.target.value='';
  if(!bestanden.length) return;
  const knop=document.getElementById('maakKnop'); knop.disabled=true;
  for(const bestand of bestanden){
    try{
      const klein=await verklein(bestand);
      const uit=await praat({foto:klein});
      aantal++; document.getElementById('teller').textContent=aantal;
      const img=document.createElement('img'); img.src=uit.url||klein;
      document.getElementById('rooster').appendChild(img);
    }catch(err){ toast(err.message,'fout'); }
  }
  knop.disabled=false;
  toast(bestanden.length+' foto'+(bestanden.length===1?'':'s')+' verstuurd', 'ok');
});

/* Verkleinen naar 1600px: scheelt uploadtijd op slechte wifi. */
function verklein(bestand){
  return new Promise((klaar, mis)=>{
    const lezer=new FileReader();
    lezer.onerror=()=>mis(new Error('De foto kon niet gelezen worden'));
    lezer.onload=()=>{
      const beeld=new Image();
      beeld.onerror=()=>mis(new Error('De foto kon niet geopend worden'));
      beeld.onload=()=>{
        const max=1600, f=Math.min(1, max/Math.max(beeld.width, beeld.height));
        const c=document.createElement('canvas');
        c.width=Math.round(beeld.width*f); c.height=Math.round(beeld.height*f);
        c.getContext('2d').drawImage(beeld, 0, 0, c.width, c.height);
        klaar(c.toDataURL('image/jpeg', 0.82));
      };
      beeld.src=lezer.result;
    };
    lezer.readAsDataURL(bestand);
  });
}

start();
</script>
</body>
</html>
